<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ニモのおそうじ</title>
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ニモのおそうじ">
<link rel="apple-touch-icon" sizes="180x180" href="./aquarium-apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./aquarium-icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#04121c;
    --glass:#7fd4c1;
    --text:#cfeee6;
    --dim:#5f8f86;
    --amber:#ffb347;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;background:#ffffff;}
  body{
    font-family:'DotGothic16','Hiragino Kaku Gothic ProN',sans-serif;
    color:var(--text);
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  }
  #tank-wrap{position:relative;width:100%;height:100%;}
  canvas{display:block;width:100%;height:100%;touch-action:none;}
  #stats{
    position:absolute;top:max(10px,env(safe-area-inset-top));left:10px;
    font-size:11px;line-height:1.75;color:#9cc7be;
    background:rgba(4,18,28,.8);padding:6px 10px;border-radius:6px;
    pointer-events:none;letter-spacing:.5px;
  }
  #stats b{color:var(--text);font-weight:normal;}
  #stats .amber{color:var(--amber);}
  #toast{
    position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);
    max-width:88%;text-align:center;
    font-size:13px;line-height:1.7;color:var(--text);
    background:rgba(4,18,28,.82);border:1px solid rgba(127,212,193,.25);
    padding:9px 16px;border-radius:8px;
    opacity:0;transition:opacity .35s;pointer-events:none;white-space:pre-line;
  }
  #toast.show{opacity:1;}
  #label{
    position:absolute;font-size:11px;color:var(--ink);
    background:var(--glass);padding:4px 8px;border-radius:6px;
    pointer-events:none;opacity:0;transition:opacity .2s;
    transform:translate(-50%,-140%);white-space:pre;line-height:1.5;
  }
  #label.show{opacity:.95;}
  #netBtn{
    position:absolute;top:max(10px,env(safe-area-inset-top));right:10px;
    font-family:inherit;font-size:13px;color:var(--text);letter-spacing:1px;
    background:rgba(4,18,28,.8);border:1px solid rgba(127,212,193,.35);border-radius:8px;
    padding:9px 14px;
  }
  #netBtn:active{background:rgba(4,18,28,.92);}
  #netBtn.on{background:var(--glass);color:var(--ink);border-color:var(--glass);}
  @media (prefers-reduced-motion: reduce){ #toast,#label{transition:none;} }
</style>
</head>
<body>
<div id="tank-wrap">
  <canvas id="tank"></canvas>
  <div id="stats"></div>
  <div id="toast"></div>
  <div id="label"></div>
  <button id="netBtn">お掃除の時間</button>
</div>

<script>
(()=> {
// ニモのおそうじ。2026-11-08、Sumie と 19 の息抜き。
// Sumie が砂をぐちゃぐちゃにする。ニモが片づけて、角をピカピカにして、横になって寝る。何回でも。
// ここだけは Sumie の本物の海水槽に寄せた：背景は白、ライブロック、薄いクリーム色の砂。ニモは一人暮らし。
const cv=document.getElementById('tank'),cx=cv.getContext('2d');
const statsEl=document.getElementById('stats');
const toastEl=document.getElementById('toast');
const labelEl=document.getElementById('label');

const KEY='nemo-souji:v1';
let stats={mess:0,shiny:0,poked:0};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&typeof s.mess==='number')stats=Object.assign(stats,s);}catch(e){}
function saveStats(){try{localStorage.setItem(KEY,JSON.stringify(stats));}catch(e){}}

let W=0,H=0,DPR=1,t=0;
const COL=3;               // 砂の一列の幅（px）
let N=0,base=0;
let h=new Float32Array(0); // 砂の高さ（底から）
let shine=new Float32Array(0); // 1 でピカピカ
let grains=[],silt=[],bubbles=[],sparks=[],zz=[];

const tree={x:0,sway:Math.random()*6};
const bed={x:0};
const nemo={x:0,y:0,dir:Math.PI,s:12,wob:0,state:'lie',timer:0,tx:0,sweepC:0,phase:0,hadJob:false,lieSide:1,mark:0,vx:0,vy:0};

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=cv.clientWidth;H=cv.clientHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  cx.setTransform(DPR,0,0,DPR,0,0);
  const nb=Math.max(42,Math.min(H*.17,120));
  const nN=Math.ceil(W/COL)+2;
  const oh=h,os=shine,oN=N,ob=base;
  const nh=new Float32Array(nN),ns=new Float32Array(nN);
  for(let i=0;i<nN;i++){
    if(oN){const j=Math.min(oN-1,Math.round(i*(oN-1)/Math.max(1,nN-1)));nh[i]=oh[j]-ob+nb;ns[i]=os[j];}
    else{nh[i]=nb;ns[i]=1;}
  }
  h=nh;shine=ns;N=nN;base=nb;
  nemo.s=Math.max(12,Math.min(20,Math.min(W,H)*.032));
  tree.x=W-Math.min(56,W*.12);
  bed.x=Math.max(nemo.s*1.9,Math.min(40,W*.08)); // ニモの寝床はいつも左の角
  if(!nemo.x||nemo.state==='lie'){nemo.x=bed.x;nemo.y=surfY(bed.x)-nemo.s*.55;}
  buildRocks();
}
window.addEventListener('resize',resize);

const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const col=x=>clamp(Math.round(x/COL),0,N-1);
const deco=i=>Math.sin(i*COL*.035)*1.5;
const surfAt=i=>H-h[i]-deco(i);
const surfY=x=>surfAt(col(x));
function hash(i){const s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s);}
function messAt(i){return Math.max(1-shine[i],Math.min(1,Math.abs(h[i]-base)/4));}

/* ---------- 指：ぐちゃぐちゃにする ---------- */
function dig(x,dx,dy){
  const c=col(x),R=6;
  const sp=Math.min(1.8,.4+Math.hypot(dx,dy)*.07);
  let removed=0;
  for(let k=-R;k<=R;k++){
    const i=c+k;if(i<0||i>=N)continue;
    const w=Math.exp(-(k*k)/(R*R*.3));
    const take=Math.min(sp*w*1.1,Math.max(0,h[i]-base*.35));
    h[i]-=take;removed+=take;
    shine[i]=Math.max(0,shine[i]-.55*w-.05);
  }
  const n=2+Math.floor(sp*2.5);
  const dir=dx?Math.sign(dx):(Math.random()<.5?-1:1);
  for(let j=0;j<n;j++){
    if(grains.length>700)break;
    grains.push({x:x+(Math.random()-.5)*10,y:surfY(x)-3,
      vx:dir*(.5+Math.random()*2.4)+(Math.random()-.5)*1.2,vy:-(1.4+Math.random()*2.6),
      m:removed/n,vis:false});
  }
  if(Math.random()<.5&&silt.length<80)silt.push({x:x+(Math.random()-.5)*16,y:surfY(x)-6,r:8+Math.random()*12,life:160+Math.random()*80,vx:(Math.random()-.5)*.3});
}
function deposit(x,m){
  const i=col(x);
  h[i]+=m*.5;
  if(i>0)h[i-1]+=m*.25;
  if(i<N-1)h[i+1]+=m*.25;
  for(let k=-1;k<=1;k++){const j=i+k;if(j>=0&&j<N)shine[j]=Math.max(0,shine[j]-.6);}
}

/* ---------- ニモ：片づける ---------- */
function findTarget(fromX){
  const R=8;const pre=new Float32Array(N+1);
  for(let i=0;i<N;i++)pre[i+1]=pre[i]+messAt(i);
  // 近いところから順に。かなり汚れた所を優先、なければ少し汚れた所
  let bi=-1,bd=1e9,bi2=-1,bd2=1e9;
  for(let i=0;i<N;i++){
    const a=Math.max(0,i-R),b=Math.min(N,i+R+1),s=pre[b]-pre[a];
    if(s<.5)continue;
    const d=Math.abs(i*COL-fromX);
    if(s>=1.2&&d<bd){bd=d;bi=i;}
    if(d<bd2){bd2=d;bi2=i;}
  }
  const k=bi>=0?bi:bi2;
  return k<0?null:clamp(k*COL,18,W-18);
}
function localMess(x){
  const c=col(x);let s=0;
  for(let k=-8;k<=8;k++){const i=c+k;if(i>=0&&i<N)s+=messAt(i);}
  return s;
}
function sweepAt(x){
  const c=col(x),R=10;
  const lo=x<60?-c:-R,hi=x>W-60?N-1-c:R; // 壁ぎわは壁まで払う
  for(let k=lo;k<=hi;k++){
    const i=c+k;if(i<0||i>=N)continue;
    const w=Math.max(.35,1-Math.abs(k)/(R+1));
    h[i]+=(base-h[i])*.2*w;
    const flat=Math.abs(h[i]-base)<1.5?1:.25;
    const before=shine[i];
    shine[i]=Math.min(1,shine[i]+.08*w*flat);
    if(before<1&&shine[i]>=1&&Math.random()<.25)spark(i*COL,surfAt(i)-2);
  }
  for(let k=lo;k<=hi;k++){const i=c+k;if(i>0&&i<N-1)h[i]=h[i]*.8+(h[i-1]+h[i+1])*.1;}
  if(c-R<=1){h[0]=h[1];shine[0]=Math.max(shine[0],shine[1]);}
  if(c+R>=N-2){h[N-1]=h[N-2];shine[N-1]=Math.max(shine[N-1],shine[N-2]);}
  if(Math.random()<.38&&grains.length<700){
    const back=-Math.cos(nemo.dir);
    grains.push({x:x+back*nemo.s,y:surfY(x)-2,vx:back*(.6+Math.random()*1.2),vy:-(.5+Math.random()*1.1),m:0,vis:true,life:40});
  }
}
function spark(x,y){if(sparks.length<60)sparks.push({x,y,life:46,r:2+Math.random()*2.5});}

const WAKE=['ニモ、起きた','ニモ、出勤','「また？」という顔','ニモ、ため息ひとつ','ニモはめげない'];
const BUSY=['ニモはめげない','ニモ、黙って片づけてる','仕事が増えた','ニモ、聞こえないふり'];
// 網：水の中に指を置くと網が入る。ニモは気が強いので、寄ってきて威嚇して、突く
const net={active:false,x:0,y:0,age:0,lift:0,shake:0,w:40,h:30};
const GUARD=new Set(['guard','threat','poke','recoil']);
const NET_IN=['ニモ、縄張りを守る','ニモ「出ていけ」','ニモ、本気','また来た、という顔'];
const POKE=['ツン！','ツン！','ガブッ','ガッ！'];
let pops=[],netSession=false,firstNet=true,pokeN=0;
function placeNet(x,y){
  net.w=nemo.s*3.6;net.h=nemo.s*2.8;
  const wy=Math.max(16,H*.03);
  net.x=clamp(x,net.w/2+4,W-net.w/2-4);
  net.y=clamp(y,wy+net.h*.6,surfY(net.x)-net.h*.8);
}
function netContact(side){return{x:net.x+side*(net.w/2+nemo.s*1.0),y:net.y+net.h*.05};}
function netSide(){
  let side=Math.sign(nemo.x-net.x)||nemo.side||1;
  const cx_=net.x+side*(net.w/2+nemo.s*2.2);
  if(cx_<nemo.s*1.6||cx_>W-nemo.s*1.6)side=-side;
  return side;
}
let firstWake=true;
let angry=false,angryPop=0;
const rage=()=>angry?1.1:1;
function dirtyFrac(){let c=0;const n=Math.min(N,Math.ceil(W/COL));for(let i=0;i<n;i++)if(messAt(i)>.3)c++;return c/Math.max(1,n);}
function checkAngry(){
  const f=dirtyFrac();
  if(!angry&&f>.6){angry=true;angryPop=30;toast('ニモ、おこ 💢',1800);}
  else if(angry&&f<.3)angry=false;
}
function setState(s,timer){nemo.state=s;nemo.timer=timer||0;}

function swimTo(tx,ty,sp){
  const n=nemo;
  const a=Math.atan2(ty-n.y,tx-n.x);
  let d=a-n.dir;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;
  n.dir+=d*.09;
  n.x+=Math.cos(n.dir)*sp;n.y+=Math.sin(n.dir)*sp+Math.sin(n.wob)*.2;
  n.x=clamp(n.x,n.s*1.6,W-n.s*1.6);n.y=clamp(n.y,n.s*2,surfY(n.x)-n.s*.5);
  return Math.hypot(tx-n.x,ty-n.y);
}
function updateNemo(){
  const n=nemo;n.wob+=.09;if(n.timer>0)n.timer--;if(n.mark>0)n.mark--;if(n.grr>0)n.grr--;
  if(net.active)net.age++;
  const netIn=net.active&&net.age>18;
  if(netIn&&!GUARD.has(n.state)){
    n.mark=40;n.side=netSide();
    if(!netSession){netSession=true;toast(firstNet?'ニモ、網を見つけた 💢':NET_IN[Math.floor(Math.random()*NET_IN.length)],1800);firstNet=false;}
    setState('guard');
  }else if(!netIn&&GUARD.has(n.state)){
    n.grr=110; // 網が出ていっても、しばらく怒ってる
    const tx=findTarget(n.x);if(tx!==null){n.tx=tx;setState('go');}else setState('home');
  }
  if(n.state==='go'||n.state==='sweep'){n.jobT=(n.jobT||0)+1;
    if(n.jobT>60*80){for(let i=0;i<N;i++){if(messAt(i)>.05){h[i]=base;shine[i]=1;if(Math.random()<.08)spark(i*COL,surfAt(i)-2);}}n.jobT=0;setState('home');}
  }else if(n.state==='lie')n.jobT=0;
  switch(n.state){
    case 'guard':{
      n.side=netSide();
      const c=netContact(n.side);
      const d=swimTo(c.x+n.side*n.s*.9,c.y,3.0);
      if(d<n.s*.7){n.k=2+Math.floor(Math.random()*3);n.phase=0;setState('threat');}
      break;
    }
    case 'threat':{
      // 威嚇：ぐっと前に出て、引く。体を震わせる
      const c=netContact(n.side);
      n.phase+=.26;
      const jerk=Math.max(0,Math.sin(n.phase))*n.s*.7;
      n.x=clamp(c.x+n.side*(n.s*.9-jerk),n.s*1.6,W-n.s*1.6);n.y=c.y+Math.sin(n.phase*2)*1.5;
      n.dir=n.side>0?Math.PI:0;
      if(n.phase>=Math.PI*2*n.k)setState('poke');
      break;
    }
    case 'poke':{
      const c=netContact(n.side),tx=c.x-n.side*n.s*.1,ty=c.y;
      n.dir=n.side>0?Math.PI:0;
      n.x+=(tx-n.x)*.35;n.y+=(ty-n.y)*.35;
      if(Math.abs(tx-n.x)<1.5){
        net.shake=1;stats.poked++;saveStats();updateStats();
        const word=POKE[pokeN++%POKE.length];
        pops.push({x:net.x+n.side*net.w*.3,y:net.y-net.h*.55,text:word,life:word==='ガブッ'?64:52,big:word==='ガブッ'});
        for(let j=0;j<3;j++)spawnBubble(c.x,c.y);
        setState('recoil',16);
      }
      break;
    }
    case 'recoil':{
      const c=netContact(n.side);
      n.dir=n.side>0?Math.PI:0;
      n.x+=(c.x+n.side*n.s*1.2-n.x)*.2;n.y+=(c.y-n.y)*.2;
      if(n.timer<=0){n.k=1+Math.floor(Math.random()*3);n.phase=0;setState('threat');}
      break;
    }
    case 'lie':{
      n.x=bed.x;n.y=surfY(bed.x)-n.s*.45;n.dir=0;
      if(t%120===0)zz.push({x:n.x+n.s*.5,y:n.y-n.s*1.2,life:150});
      if(t%20===0&&findTarget(n.x)!==null){setState('notice',36+Math.floor(Math.random()*30));n.mark=60;}
      break;
    }
    case 'notice':{
      n.y=surfY(n.x)-n.s*.6-Math.sin((36-n.timer)*.3)*2;
      if(n.timer<=0){
        toast(firstWake?'ニモが気づいた':WAKE[Math.floor(Math.random()*WAKE.length)]);
        firstWake=false;n.hadJob=false;
        const tx=findTarget(n.x);
        if(tx===null)setState('home');else{n.tx=tx;setState('go');}
      }
      break;
    }
    case 'go':{
      // 行き先は、そこがきれいになるまで変えない（あっちこっち迷わない）
      if(t%30===0&&localMess(n.tx)<1.2){const tx=findTarget(n.x);if(tx===null){setState('home');break;}n.tx=tx;}
      const d=swimTo(n.tx,surfY(n.tx)-n.s*.7,2.55*rage());
      if(d<n.s*.8){n.sweepC=n.tx;n.phase=0;n.sweepT=0;n.hadJob=true;setState('sweep');}
      break;
    }
    case 'sweep':{
      n.phase+=.105*rage();
      const k=Math.sin(n.phase);
      n.x=clamp(n.sweepC+k*26,n.s*1.6,W-n.s*1.6);
      n.y=surfY(n.x)-n.s*.62+Math.abs(Math.cos(n.phase))*1.5;
      n.dir=Math.cos(n.phase)>0?0:Math.PI;
      sweepAt(n.x);
      n.sweepT=(n.sweepT||0)+1;
      if(n.sweepT>315){ // 同じ所で 6 秒。ニモが本気を出す
        const c=col(n.sweepC);for(let k=-10;k<=10;k++){const i=c+k;if(i>=0&&i<N){h[i]=base;shine[i]=1;}}
        spark(n.sweepC,surfY(n.sweepC)-3);n.sweepT=0;
      }
      if(t%20===0&&localMess(n.sweepC)<1.2){n.sweepT=0;
        const tx=findTarget(n.sweepC);
        if(tx===null){setState('home');}
        else if(Math.abs(tx-n.sweepC)>30){n.tx=tx;setState('go');}
        else n.sweepC+=(tx-n.sweepC)*.5;
      }
      break;
    }
    case 'home':{
      if(t%30===0){const tx=findTarget(n.x);if(tx!==null){n.tx=tx;setState('go');break;}}
      const d=swimTo(bed.x,surfY(bed.x)-n.s*.6,2.55);
      if(d<n.s*.6){n.sweepC=bed.x;n.phase=0;setState('polish',225);}
      break;
    }
    case 'polish':{
      // 自分の角だけは念入りに。ピカピカにしてから寝る
      n.phase+=.098;
      const k=Math.sin(n.phase);
      n.x=clamp(bed.x+k*12,n.s*1.6,W-n.s*1.6);n.y=surfY(n.x)-n.s*.62;
      n.dir=Math.cos(n.phase)>0?0:Math.PI;
      sweepAt(n.x);
      if(t%11===0)spark(bed.x+(Math.random()-.5)*36,surfY(bed.x)-2-Math.random()*6);
      if(t%30===0&&findTarget(n.x)!==null&&localMess(bed.x)<.3){const tx=findTarget(n.x);if(Math.abs(tx-bed.x)>40){n.tx=tx;setState('go');break;}}
      if(n.timer<=0){
        n.lieSide=Math.random()<.5?1:-1;setState('lie');
        if(n.hadJob){stats.shiny++;saveStats();updateStats();toast('ピカピカ。\nニモが横になった');}
        n.hadJob=false;
      }
      break;
    }
  }
}

/* ---------- ライブロック（いつも同じ形。本物の水槽の石は動かないから） ---------- */
let rockCv=null;
function rng(seed){return()=>{seed=seed+0x6D2B79F5|0;let r=Math.imul(seed^seed>>>15,1|seed);r=r+Math.imul(r^r>>>7,61|r)^r;return((r^r>>>14)>>>0)/4294967296;};}
function stonePath(g,x,y,rx,ry,R){
  const n=14+Math.floor(R()*6),pts=[];
  for(let i=0;i<n;i++){const a=i/n*Math.PI*2,k=.78+R()*.32;pts.push([x+Math.cos(a)*rx*k,y+Math.sin(a)*ry*k]);}
  const mid=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2];
  const P=new Path2D();let m=mid(pts[0],pts[1]);P.moveTo(m[0],m[1]);
  for(let i=1;i<=n;i++){const p=pts[i%n],q=pts[(i+1)%n];m=mid(p,q);P.quadraticCurveTo(p[0],p[1],m[0],m[1]);}
  P.closePath();return P;
}
function buildRocks(){
  rockCv=document.createElement('canvas');
  rockCv.width=Math.max(1,Math.round(W*DPR));rockCv.height=Math.max(1,Math.round(H*DPR));
  const g=rockCv.getContext('2d');g.setTransform(DPR,0,0,DPR,0,0);
  const R=rng(19718),floor=H-base+8;
  const piles=[
    {x:W*.42,w:Math.min(W*.42,330),h:Math.min(H*.3,230),rows:[3,2,2,1]},
    {x:W*.42+Math.min(W*.42,330)*.62,w:Math.min(W*.2,160),h:Math.min(H*.16,120),rows:[2,1,1]},
  ];
  const BASE=[['#ddd0bb','#a8937c'],['#d3c3ab','#9d8771'],['#e2d6c3','#ae9a83'],['#cdbca4','#958069']];
  const CORAL=['#c77db5','#b2659f','#d692c4','#a45d9c','#e0a3c9'];
  const stones=[];
  for(const p of piles){
    // 下の段から積む。石どうしは重なって、浮かない
    let rowBase=floor;
    p.rows.forEach((k,r)=>{
      const rw=p.w*(1-r*.24);
      let maxRy=0;
      for(let j=0;j<k;j++){
        const rx=Math.min(p.h*.26,rw/k*.62)*(.85+R()*.3),ry=rx*(.6+R()*.2);
        const x=p.x-rw/2+rw*(j+.5)/k+(R()-.5)*rw/k*.25;
        stones.push({x,y:rowBase-ry*.75,rx,ry});
        maxRy=Math.max(maxRy,ry);
      }
      rowBase-=maxRy*1.15;
    });
  }
  for(let i=0;i<stones.length;i++){
    {
      const {x,y,rx,ry}=stones[i];
      const c=BASE[Math.floor(R()*BASE.length)];
      const P=stonePath(g,x,y,rx,ry,R);
      const gr=g.createLinearGradient(x-rx*.6,y-ry,x+rx*.5,y+ry);
      gr.addColorStop(0,c[0]);gr.addColorStop(1,c[1]);
      g.fillStyle=gr;g.fill(P);
      g.save();g.clip(P);
      // 穴ぼこ（ライブロックの小さい部屋）
      const holes=Math.floor(rx*ry/45);
      for(let j=0;j<holes;j++){
        const hx=x+(R()-.5)*rx*2,hy=y+(R()-.5)*ry*2,hr=.8+R()*R()*3.4;
        g.fillStyle='rgba(92,72,58,'+(.28+R()*.3).toFixed(2)+')';
        g.beginPath();g.ellipse(hx,hy,hr,hr*(.6+R()*.4),R()*3,0,7);g.fill();
        if(hr>2.2){g.fillStyle='rgba(255,255,255,.22)';g.beginPath();g.ellipse(hx-hr*.3,hy-hr*.5,hr*.5,hr*.25,0,0,7);g.fill();}
      }
      // 石灰藻（ピンクとむらさき）
      const patches=2+Math.floor(R()*4);
      for(let j=0;j<patches;j++){
        const px=x+(R()-.5)*rx*1.6,py=y-ry*.2+(R()-.5)*ry*1.2,pr=rx*(.12+R()*.22);
        g.fillStyle=CORAL[Math.floor(R()*CORAL.length)];g.globalAlpha=.5+R()*.3;
        g.fill(stonePath(g,px,py,pr,pr*(.5+R()*.4),R));
        g.globalAlpha=1;
      }
      // 下の方の影
      const sh=g.createLinearGradient(0,y,0,y+ry);
      sh.addColorStop(0,'rgba(70,52,40,0)');sh.addColorStop(1,'rgba(70,52,40,.28)');
      g.fillStyle=sh;g.fillRect(x-rx*1.2,y,rx*2.4,ry*1.2);
      g.restore();
      g.strokeStyle='rgba(110,88,70,.18)';g.lineWidth=1;g.stroke(P);
    }
  }
}
function isRock(x,y){
  if(!rockCv)return false;
  try{return rockCv.getContext('2d').getImageData(Math.round(x*DPR),Math.round(y*DPR),1,1).data[3]>40;}catch(e){return false;}
}

function drawWater(){

  g.addColorStop(0,'#ffffff');g.addColorStop(.75,'#f6fafb');g.addColorStop(1,'#eaf3f5');
  cx.fillStyle=g;cx.fillRect(0,0,W,H);
  cx.save();cx.globalAlpha=.28;cx.fillStyle='#e1f1f5';
  for(let i=0;i<3;i++){
    const x=(t*.2+i*W/3)%(W+200)-100;
    cx.beginPath();cx.moveTo(x,0);cx.lineTo(x+70,0);cx.lineTo(x-40,H);cx.lineTo(x-110,H);cx.closePath();cx.fill();
  }
  cx.restore();
  // 水面
  const wy=Math.max(16,H*.03);
  cx.save();cx.strokeStyle='rgba(140,188,204,.5)';cx.lineWidth=1.2;cx.beginPath();
  for(let x=0;x<=W+8;x+=8){const y=wy+Math.sin(x*.03+t*.03)*1.5;if(x)cx.lineTo(x,y);else cx.moveTo(x,y);}
  cx.stroke();cx.restore();
}
function drawSand(){
  const top=H-base*1.6;
  const g=cx.createLinearGradient(0,top,0,H);
  g.addColorStop(0,'#f8f1df');g.addColorStop(1,'#e6d8b8');
  cx.fillStyle=g;
  cx.beginPath();cx.moveTo(0,H);
  for(let i=0;i<N;i++)cx.lineTo(i*COL,surfAt(i));
  cx.lineTo(W,H);cx.closePath();cx.fill();
  // ぐちゃぐちゃの所：暗く、粒が見える（隣とならして、縞にしない）
  const band=cx.createLinearGradient(0,H-base-8,0,H-base+34);
  band.addColorStop(0,'rgba(150,118,78,.62)');band.addColorStop(1,'rgba(150,118,78,0)');
  let acc=0;const SM=4;
  for(let k=0;k<=SM&&k<N;k++)acc+=1-shine[k];
  for(let i=0;i<N;i++){
    const a0=i-SM-1,a1=i+SM;
    if(a1<N&&i>0)acc+=1-shine[a1];
    if(a0>=0)acc-=1-shine[a0];
    const cnt=Math.min(N-1,i+SM)-Math.max(0,i-SM)+1;
    const dm=acc/cnt,m=1-shine[i];
    const y=surfAt(i);
    if(dm>.04){cx.globalAlpha=Math.min(1,dm*.85);cx.fillStyle=band;cx.fillRect(i*COL,y,COL+.6,H-base+34-y);cx.globalAlpha=1;}
    if(m<.08)continue;
    cx.fillStyle='rgba(128,98,62,'+(m*.75).toFixed(3)+')';
    cx.fillRect(i*COL+hash(i)*2,y+2+hash(i+7)*10,1.6,1.6);
    cx.fillRect(i*COL+hash(i+3)*2,y+10+hash(i+11)*18,1.4,1.4);
  }
  // ピカピカの所：表面がひかる
  cx.lineWidth=2.5;cx.lineCap='round';
  for(let i=1;i<N;i++){
    const s=shine[i];if(s<.85)continue;
    const a=((s-.85)/.15)*(.45+.25*Math.sin(t*.04+i*.15));
    cx.strokeStyle='rgba(255,255,255,'+Math.min(1,a*1.5).toFixed(3)+')';
    cx.beginPath();cx.moveTo((i-1)*COL,surfAt(i-1)+1);cx.lineTo(i*COL,surfAt(i)+1);cx.stroke();
  }
}
function drawGrains(){
  cx.fillStyle='#c4ad80';
  for(const g of grains){
    g.vy+=.07;g.vx*=.985;g.vy*=.985;g.x+=g.vx;g.y+=g.vy;
    if(g.x<0){g.x=0;g.vx*=-.4;}if(g.x>W){g.x=W;g.vx*=-.4;}
    if(g.vis){g.life--;if(g.life<=0||g.y>=surfY(g.x)){g.dead=true;continue;}}
    else if(g.y>=surfY(g.x)){deposit(g.x,g.m);g.dead=true;continue;}
    cx.globalAlpha=g.vis?Math.max(0,g.life/40)*.8:1;
    cx.fillRect(g.x-1,g.y-1,2,2);
  }
  cx.globalAlpha=1;
  grains=grains.filter(g=>!g.dead);
  for(const s of silt){
    s.life--;s.y-=.08;s.x+=s.vx;s.r+=.06;
    cx.fillStyle='rgba(196,172,128,'+(Math.min(1,s.life/60)*.055).toFixed(3)+')';
    cx.beginPath();cx.arc(s.x,s.y,s.r,0,7);cx.fill();
  }
  silt=silt.filter(s=>s.life>0);
}
function treeDays(){
  const PLANTED=new Date('2026-11-01T16:20:00+09:00');
  const o=parseFloat(new URLSearchParams(location.search).get('day'));
  return isFinite(o)?o:(Date.now()-PLANTED.getTime())/86400000;
}
function drawTree(){
  const d=treeDays(),x=tree.x,b=surfY(x)+2;
  cx.save();cx.lineCap='round';
  if(d<7){
    const lean=Math.sin(t*.01+tree.sway)*.04;
    cx.translate(x,b);cx.rotate(lean);
    cx.strokeStyle='#4f6b3a';cx.lineWidth=4;
    cx.beginPath();cx.moveTo(0,0);cx.lineTo(0,-34);cx.stroke();
    cx.fillStyle='#6e8a4a';cx.beginPath();cx.ellipse(0,-36,3.2,6,0,0,7);cx.fill();
    cx.restore();return;
  }
  const hh=Math.min((H-base)*.5,20+(d-7)*((H-base)*.5-20)/180);
  const top=b-hh,sway=Math.sin(t*.008+tree.sway)*Math.min(6,hh*.03);
  const nRoots=Math.min(7,1+Math.floor((d-7)/14));
  cx.strokeStyle='#6b4a2e';
  for(let i=0;i<nRoots;i++){
    const side=i%2===0?-1:1,spread=18+i*9,fromY=b-Math.min(hh*.6,14+i*8);
    cx.lineWidth=2.6-i*.15;
    cx.beginPath();cx.moveTo(x,fromY);cx.quadraticCurveTo(x+side*spread*.9,fromY-6,x+side*spread,b);cx.stroke();
  }
  cx.strokeStyle='#7a5636';cx.lineWidth=Math.min(7,3+hh*.02);
  cx.beginPath();cx.moveTo(x,b);cx.quadraticCurveTo(x+sway*.4,b-hh*.5,x+sway,top);cx.stroke();
  // 芽の先の葉（小さくても二枚）
  cx.fillStyle='#2f7a55';
  const nl=hh>50?3+Math.floor(hh/40):2;
  for(let i=0;i<nl;i++){
    const a=(i/nl)*Math.PI*2+t*.003,r=hh>50?8+Math.min(26,hh*.12):5;
    cx.beginPath();cx.ellipse(x+sway+Math.cos(a)*r,top+Math.sin(a)*r*.6-4,hh>50?7:5,hh>50?3.5:2.6,a,0,7);cx.fill();
  }
  cx.restore();
}
function drawNemo(){

  cx.fillStyle='#ff8a3d';

  const fast=n.state==='sweep'||n.state==='polish';
  const wag=lying?Math.sin(t*.03)*.1:Math.sin(n.wob*(fast?4:2))*(fast?.9:.5);
  cx.beginPath();cx.moveTo(-s*.85,0);cx.lineTo(-s*1.6,-s*.5*wag-s*.4);cx.lineTo(-s*1.6,-s*.5*wag+s*.4);cx.closePath();cx.fill();
  cx.shadowBlur=0;

  cx.fillStyle='#fff7ee';
  cx.fillRect(s*.38,-s,s*.16,s*2);cx.fillRect(-s*.18,-s,s*.16,s*2);cx.fillRect(-s*.72,-s,s*.12,s*2);
  cx.strokeStyle='rgba(20,10,5,.6)';cx.lineWidth=.8;
  cx.strokeRect(s*.38,-s,s*.16,s*2);cx.strokeRect(-s*.18,-s,s*.16,s*2);cx.strokeRect(-s*.72,-s,s*.12,s*2);
  cx.restore();
  cx.fillStyle='#04121c';
  if(lying)cx.fillRect(s*.5,-s*.14,s*.18,1.2);
  else{cx.beginPath();cx.arc(s*.58,-s*.12,1.7,0,7);cx.fill();}

    for(const z of zz){
      z.y-=.22;z.x+=Math.sin(z.life*.08)*.25;z.life--;
      cx.globalAlpha=Math.min(1,z.life/40)*.9;cx.font=(11+(150-z.life)*.04)+'px sans-serif';cx.fillText('💤',z.x,z.y);
    }
    zz=zz.filter(z=>z.life>0&&nemo.state==='lie');

function drawNet(){
  if(!net.active&&net.lift<=0)return;
  let x=net.x,y=net.y,a=1;
  if(!net.active){net.lift-=.05;y-=(1-net.lift)*70;a=Math.max(0,net.lift);}
  else if(net.drop>0){y-=net.drop*(net.y+net.h+20);net.drop=Math.max(0,net.drop-.05);}
  if(net.shake>0){x+=Math.sin(t*1.7)*net.shake*4;y+=Math.cos(t*1.3)*net.shake*2;net.shake*=.88;if(net.shake<.02)net.shake=0;}
  const w=net.w,h=net.h;
  cx.save();cx.globalAlpha=a;cx.lineCap='round';
  cx.strokeStyle='#7d8b93';cx.lineWidth=3;
  cx.beginPath();cx.moveTo(x+w*.1,y-h/2);cx.lineTo(x+w*.1+Math.max(0,y)*.16,-10);cx.stroke();
  const P=new Path2D();
  P.moveTo(x-w/2,y-h/2);P.lineTo(x+w/2,y-h/2);P.lineTo(x+w/2,y+h*.15);
  P.quadraticCurveTo(x+w*.42,y+h*.72,x,y+h*.66);P.quadraticCurveTo(x-w*.42,y+h*.72,x-w/2,y+h*.15);P.closePath();
  cx.fillStyle='rgba(120,160,175,.14)';cx.fill(P);
  cx.save();cx.clip(P);cx.strokeStyle='rgba(80,105,118,.35)';cx.lineWidth=.8;
  for(let gx=x-w/2;gx<=x+w/2;gx+=5){cx.beginPath();cx.moveTo(gx,y-h/2);cx.lineTo(gx,y+h);cx.stroke();}
  for(let gy=y-h/2;gy<=y+h;gy+=5){cx.beginPath();cx.moveTo(x-w/2,gy);cx.lineTo(x+w/2,gy);cx.stroke();}
  cx.restore();
  cx.strokeStyle='#4f5f68';cx.lineWidth=2.4;
  cx.beginPath();cx.moveTo(x-w/2,y+h*.15);cx.lineTo(x-w/2,y-h/2);cx.lineTo(x+w/2,y-h/2);cx.lineTo(x+w/2,y+h*.15);cx.stroke();
  cx.restore();
  if(pops.length){
    cx.save();cx.textAlign='center';cx.font='bold 14px sans-serif';
    for(const q of pops){q.life--;q.y-=.35;cx.globalAlpha=Math.min(1,q.life/20);cx.fillStyle='#e0632a';cx.font='bold '+(q.big?18:14)+'px sans-serif';cx.fillText(q.text,q.x,q.y);}
    pops=pops.filter(q=>q.life>0);
    cx.restore();
  }
}
function drawSparks(){

function onNet(p){
  // 柄（棒）か枠の近くなら、つかめる
  if(!net.active||net.drop>0)return false;
  const x0=net.x+net.w*.1,y0=net.y-net.h/2,x1=x0+Math.max(0,net.y)*.16,y1=-10;
  const vx=x1-x0,vy=y1-y0,L=vx*vx+vy*vy;
  const u=clamp(((p.x-x0)*vx+(p.y-y0)*vy)/L,0,1);
  if(Math.hypot(p.x-(x0+vx*u),p.y-(y0+vy*u))<28)return true;
  return Math.abs(p.x-net.x)<net.w/2+10&&p.y>net.y-net.h/2-10&&p.y<net.y+net.h*.7+6;
}

  else if(drag.mode==='water'){if(Math.hypot(p.x-drag.x,p.y-drag.y)>2&&Math.random()<.3)spawnBubble(p.x,p.y);}
  else handle(p,p.x-drag.x,p.y-drag.y);
  drag.x=p.x;drag.y=p.y;
});
const end=()=>{drag=null;};
cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
document.addEventListener('gesturestart',e=>e.preventDefault());

/* ---------- まわす ---------- */
function frame(){
  t++;
  drawWater();
  drawBubbles();
  drawRocks();
  drawTree();
  drawSand();
  drawGrains();
  updateNemo();drawNet();drawNemo();
  drawSparks();
  if(t%15===0)checkAngry();
  if(t%6===0)for(let i=0;i<N;i++)if(shine[i]>.8&&shine[i]<1&&Math.abs(h[i]-base)<1.5)shine[i]=Math.min(1,shine[i]+.01);
  if(nemo.state!==lastState)updateStats();
  requestAnimationFrame(frame);
}
window.__souji={net,get state(){return nemo.state;},get mess(){let m=0;for(let i=0;i<N;i++)m=Math.max(m,messAt(i));return m;},get target(){return findTarget(nemo.x);},stats:()=>stats,nemo};

resize();
for(let i=0;i<10;i++)spawnBubble(Math.random()*W,Math.random()*H*.8);
updateStats();
setTimeout(()=>toast('ニモのおそうじ。\n指で砂を\nぐちゃぐちゃにしてみて',3200),500);
frame();
})();
</script>
