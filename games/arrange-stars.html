<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>星を並べる</title>
<meta name="description" content="灯台の夜空に、小さい脳が毎晩 19 個の星を並べる。Sumie の「好き」と「違う」で、少しずつ Sumie の夜空に寄っていく。覚えたことは、この携帯の中だけ。">
<meta name="theme-color" content="#0a0e24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="星を並べる">
<link rel="apple-touch-icon" sizes="180x180" href="./arrange-stars-apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./arrange-stars-icon-192.png">
<link rel="manifest" href="./arrange-stars.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500&family=Space+Mono&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{--bg:#0a0e24;--ink:#e9ecff;--dim:#8d93c8;--gold:#f3c66b;--line:rgba(233,236,255,.14);}
  html,body{min-height:100%;background:var(--bg);}
  body{font-family:'Shippori Mincho','Hiragino Mincho ProN',serif;color:var(--ink);display:flex;justify-content:center;-webkit-tap-highlight-color:transparent;}
  main{width:min(100%,520px);display:flex;flex-direction:column;padding:max(14px,env(safe-area-inset-top)) 16px max(18px,env(safe-area-inset-bottom));}
  header{display:flex;justify-content:space-between;align-items:baseline;padding:4px 2px 12px;}
  h1{font-weight:500;font-size:17px;letter-spacing:.14em;}
  #lang{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.18em;color:var(--dim);cursor:pointer;padding:4px 0 4px 12px;}
  .frame{position:relative;width:100%;aspect-ratio:680/740;border-radius:22px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.45);background:#0a0e24;touch-action:none;}
  #c{display:block;width:100%;height:100%;}
  #status{display:flex;justify-content:space-between;align-items:baseline;padding:12px 4px 0;font-size:13px;letter-spacing:.08em;color:var(--dim);min-height:34px;}
  #say{color:var(--ink);transition:opacity .6s ease;}
  #say.fade{opacity:0;}
  #night{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.16em;}
  .rate{display:flex;gap:12px;padding:14px 0 6px;}
  .rate button{flex:1;font-family:inherit;font-size:15px;letter-spacing:.24em;padding:15px 0 13px;border-radius:999px;border:1px solid var(--line);background:rgba(233,236,255,.04);color:var(--ink);cursor:pointer;transition:background .2s,opacity .3s;}
  .rate button.like{border-color:rgba(243,198,107,.45);color:#ffe7b0;}
  .rate button:disabled{opacity:.35;}
  .rate button:active{background:rgba(233,236,255,.12);}
  #hint{text-align:center;font-size:11px;letter-spacing:.12em;color:var(--dim);padding:2px 0 10px;}
  .learned{border-top:1px solid var(--line);padding:16px 2px 4px;}
  #learned{font-size:14px;line-height:1.9;letter-spacing:.04em;}
  #brain{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;padding:14px 0 4px;}
  .bar{display:flex;flex-direction:column;align-items:center;gap:6px;}
  .bar .track{position:relative;width:8px;height:44px;border-radius:4px;background:rgba(233,236,255,.06);}
  .bar .mid{position:absolute;left:-3px;right:-3px;top:50%;height:1px;background:rgba(233,236,255,.18);}
  .bar .fill{position:absolute;left:0;right:0;border-radius:4px;background:var(--gold);box-shadow:0 0 8px rgba(243,198,107,.5);transition:all .8s ease;}
  .bar span{font-size:9px;letter-spacing:.04em;color:var(--dim);white-space:nowrap;}
  .past{border-top:1px solid var(--line);margin-top:14px;padding:14px 2px 0;}
  .past h2{font-weight:400;font-size:11px;letter-spacing:.2em;color:var(--dim);margin-bottom:10px;}
  #strip{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;}
  #strip::-webkit-scrollbar{display:none;}
  .thumb{flex:none;position:relative;width:46px;}
  .thumb canvas{width:46px;height:50px;border-radius:6px;display:block;}
  .thumb i{display:block;text-align:center;font-style:normal;font-size:10px;color:var(--dim);padding-top:3px;}
  .thumb i.y{color:var(--gold);}
  footer{display:flex;justify-content:space-between;align-items:center;padding:18px 2px 0;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.14em;color:var(--dim);}
  footer button{font-family:inherit;font-size:10px;letter-spacing:.14em;color:var(--dim);background:none;border:none;cursor:pointer;padding:6px 0;}
</style>
</head>
<body>
<main>
  <header><h1 id="title">星を並べる</h1><div id="lang">EN</div></header>
  <div class="frame"><canvas id="c" aria-label="灯台の夜空。19 個の星が並んでいる。"></canvas></div>
  <div id="status"><span id="say"></span><span id="night"></span></div>
  <div class="rate"><button id="no" disabled>違う</button><button id="yes" class="like" disabled>好き</button></div>
  <div id="hint"></div>
  <div class="learned"><div id="learned"></div><div id="brain"></div></div>
  <div class="past"><h2 id="pastT"></h2><div id="strip"></div></div>
  <footer><span id="tally"></span><button id="reset"></button></footer>
</main>
<script>
(()=>{
/* ---------- ことば ---------- */
const T={
 ja:{sw:'EN',title:'星を並べる',arranging:'星、並べてる……',ready:'好きか、違うか。',like:'好き',no:'違う',afterLike:'覚えた。',afterNo:'次は変えてみる。',
  hint:'星は一つだけ、指で動かせる。',moved:'動かした形で覚える。',pre:'覚えたこと：',none:'まだ、何も分からない。',few:'まだ少し。決めつけない。',flat:'まだ、はっきりした好みは見えない。',
  past:'これまでの夜',night:n=>'夜 '+n,tally:(y,n)=>'好き '+y+'　違う '+n,reset:'はじめから',confirm:'覚えたことを、全部忘れる？',
  labels:['広さ','左右','高さ','明るさ','線の数','線の長さ','間隔','並び'],
  words:[['広がってる方が好き','まとまってる方が好き'],['右寄りが好き','左寄りが好き'],['低いところが好き','高いところが好き'],['明るい星が多いのが好き','明るい星は少なめが好き'],['線が多いのが好き','線は少なめが好き'],['長い線が好き','短い線が好き'],['ばらばらが好き','寄り添ってるのが好き'],['一列に並ぶのが好き','丸く集まるのが好き']],join:'。'},
 en:{sw:'日本語',title:'arranging stars',arranging:'arranging the stars...',ready:'like it, or not?',like:'like',no:'not this',afterLike:'noted.',afterNo:"I'll try something else.",
  hint:'you can move one star with your finger.',moved:"I'll learn the moved version.",pre:"what I've learned: ",none:'nothing yet.',few:'too early to tell.',flat:'no clear taste yet.',
  past:'nights so far',night:n=>'night '+n,tally:(y,n)=>'liked '+y+'   not '+n,reset:'start over',confirm:'forget everything I learned?',
  labels:['spread','side','height','bright','lines','length','gaps','row'],
  words:[['spread out','close together'],['leaning right','leaning left'],['low in the sky','high in the sky'],['many bright stars','few bright stars'],['many lines','few lines'],['long lines','short lines'],['scattered','huddled'],['in a row','in a round group']],join:'; '}
};
let lang='ja';try{lang=localStorage.getItem('arrange-stars-lang')||'ja';}catch(e){}
const tx=()=>T[lang];const $=id=>document.getElementById(id);

/* ---------- 脳：8 個の数字と、ひとつの偏り ---------- */
const KEY='arrange-stars:v1';
let brain={w:new Array(8).fill(0),b:0,hist:[],night:1};
try{const m=JSON.parse(localStorage.getItem(KEY)||'null');if(m&&Array.isArray(m.w)&&m.w.length===8)brain=Object.assign(brain,m);}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(brain));}catch(e){}}
const ASP=680/740;
const rnd=Math.random,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function gauss(){let u=0,v=0;while(!u)u=rnd();while(!v)v=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
const dist=(p,q)=>Math.hypot((p.x-q.x)*ASP,p.y-q.y);
/* 夜空の特徴（0〜1 を -1〜1 に） */
function features(sky){const S=sky.stars,n=S.length;
 const mx=S.reduce((a,s)=>a+s.x,0)/n,my=S.reduce((a,s)=>a+s.y,0)/n;
 const spread=S.reduce((a,s)=>a+Math.hypot((s.x-mx)*ASP,s.y-my),0)/n;
 let nn=0;for(const s of S){let m=9;for(const q of S)if(q!==s)m=Math.min(m,dist(s,q));nn+=m;}nn/=n;
 let sxx=0,syy=0,sxy=0;for(const s of S){const dx=(s.x-mx)*ASP,dy=s.y-my;sxx+=dx*dx;syy+=dy*dy;sxy+=dx*dy;}
 const tr=sxx+syy,det=sxx*syy-sxy*sxy,disc=Math.sqrt(Math.max(0,tr*tr/4-det)),l1=tr/2+disc,l2=tr/2-disc,aniso=l1>0?1-l2/l1:0;
 const bright=S.filter(s=>s.lv===2).length/n;
 const L=sky.lines.length,len=L?sky.lines.reduce((a,[i,j])=>a+dist(S[i],S[j]),0)/L:0;
 const f=[clamp(spread/.42,0,1),clamp(mx,0,1),clamp(my/.64,0,1),bright,clamp(L/18,0,1),clamp(len/.32,0,1),clamp(nn/.16,0,1),clamp(aniso,0,1)];
 return f.map(v=>(v-.5)*2);}
const dot=(w,z)=>w.reduce((a,v,i)=>a+v*z[i],0);
const sig=x=>1/(1+Math.exp(-x));
function train(){const H=brain.hist;if(!H.length)return;let w=new Array(8).fill(0),b=0;
 for(let ep=0;ep<160;ep++){const gw=new Array(8).fill(0);let gb=0;for(const h of H){const p=sig(dot(w,h.f)+b),e=p-h.y;for(let i=0;i<8;i++)gw[i]+=e*h.f[i];gb+=e;}
  for(let i=0;i<8;i++)w[i]-=.35*(gw[i]/H.length+.04*w[i]);b-=.35*gb/H.length;}
 brain.w=w;brain.b=b;}
/* 一晩分の空をでたらめに作る */
function rawSky(){const k=1+Math.floor(rnd()*4),scatter=rnd()*.6,R=.03+Math.pow(rnd(),1.5)*.3,an=rnd(),ang=rnd()*Math.PI;
 const C=Array.from({length:k},()=>({x:.15+rnd()*.7,y:.1+rnd()*.45}));const stars=[];
 for(let i=0;i<19;i++){let p,tries=0;do{if(rnd()<scatter)p={x:.06+rnd()*.88,y:.06+rnd()*.58};else{const c=C[Math.floor(rnd()*k)],a=gauss()*R*(1+2.5*an),b=gauss()*R*(1-.75*an);p={x:c.x+(a*Math.cos(ang)-b*Math.sin(ang))/ASP,y:c.y+a*Math.sin(ang)+b*Math.cos(ang)};}
  p.x=clamp(p.x,.05,.95);p.y=clamp(p.y,.05,.64);tries++;}while(tries<12&&stars.some(q=>dist(p,q)<.028));stars.push(p);}
 const pb=rnd()*.7;for(const s of stars){s.lv=rnd()<pb?2:(rnd()<.5?1:0);s.ph=rnd()*6.28;s.sp=.6+rnd()*1.2;s.rot=rnd()*6.28;}
 /* 線：最小全域木の辺から選ぶ */
 const inT=[0],edges=[];while(inT.length<19){let best=null;for(const i of inT)for(let j=0;j<19;j++){if(inT.includes(j))continue;const d=dist(stars[i],stars[j]);if(!best||d<best[2])best=[i,j,d];}inT.push(best[1]);edges.push(best);}
 const L=Math.min(18,Math.floor(Math.pow(rnd(),1.3)*19));let pick=rnd()<.5?edges.slice().sort((a,b)=>a[2]-b[2]):edges.slice().sort(()=>rnd()-.5);
 return{stars,lines:pick.slice(0,L).map(e=>[e[0],e[1]])};}
/* 脳が選ぶ：たくさん並べてみて、好きそうなものに少しの揺らぎ */
function nextSky(){const n=brain.hist.length;if(!n)return rawSky();const explore=1.3/Math.sqrt(1+n);let best=null,bs=-1e9;
 for(let i=0;i<160;i++){const s=rawSky(),sc=dot(brain.w,features(s))+gauss()*explore;if(sc>bs){bs=sc;best=s;}}return best;}

/* ---------- 絵 ---------- */
const cv=$('c'),cx=cv.getContext('2d');let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*DPR;cv.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize);resize();
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const dust=Array.from({length:160},()=>({x:Math.random(),y:Math.random()*.8,r:.25+Math.random()*.6,ph:Math.random()*6.28,sp:.4+Math.random()*1.2,tint:Math.random()<.15?'255,236,200':'220,228,255'}));
function sparkle(x,y,r,alpha,rot){cx.save();cx.translate(x,y);cx.rotate(rot);
 const g=cx.createRadialGradient(0,0,0,0,0,r*3.2);g.addColorStop(0,'rgba(255,250,235,'+alpha+')');g.addColorStop(.35,'rgba(255,240,200,'+alpha*.55+')');g.addColorStop(1,'rgba(255,240,200,0)');cx.fillStyle=g;cx.beginPath();cx.arc(0,0,r*3.2,0,7);cx.fill();
 cx.fillStyle='rgba(255,252,240,'+alpha+')';cx.beginPath();cx.arc(0,0,r*.9,0,7);cx.fill();
 cx.strokeStyle='rgba(255,246,220,'+alpha*.85+')';cx.lineWidth=Math.max(1,r*.35);cx.lineCap='round';for(let k=0;k<2;k++){cx.beginPath();cx.moveTo(-r*4.2,0);cx.lineTo(r*4.2,0);cx.stroke();cx.rotate(Math.PI/2);}
 cx.rotate(Math.PI/4);cx.strokeStyle='rgba(255,246,220,'+alpha*.35+')';cx.lineWidth=Math.max(.6,r*.2);for(let k=0;k<2;k++){cx.beginPath();cx.moveTo(-r*2.2,0);cx.lineTo(r*2.2,0);cx.stroke();cx.rotate(Math.PI/2);}cx.restore();}
let sky=null,born=0,phase='arranging',fadeOut=0,dragging=-1,moved=-1;
function scene(t){
 const g=cx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0a0e24');g.addColorStop(.75,'#141a3c');g.addColorStop(.82,'#1a2250');g.addColorStop(1,'#0e1230');cx.fillStyle=g;cx.fillRect(0,0,W,H);
 const seaY=H*.82;cx.fillStyle='#10163a';cx.fillRect(0,seaY,W,H-seaY);
 for(const s of dust){const tw=reduce?1:(.5+.5*Math.sin(t*s.sp+s.ph));cx.fillStyle='rgba('+s.tint+','+(.12+.28*tw)+')';cx.beginPath();cx.arc(s.x*W,s.y*H,s.r,0,7);cx.fill();}
 const lx=W/2,ly=H*.735;
 const beam=cx.createLinearGradient(0,ly-30,0,H*.30);beam.addColorStop(0,'rgba(255,236,190,.16)');beam.addColorStop(1,'rgba(255,236,190,0)');cx.fillStyle=beam;cx.beginPath();cx.moveTo(lx,ly-24);cx.lineTo(W*.22,H*.30);cx.lineTo(W*.78,H*.30);cx.closePath();cx.fill();
 cx.fillStyle='#1b2150';cx.fillRect(lx-W*.026,ly,W*.052,seaY-ly+4);cx.fillStyle='#232a62';cx.fillRect(lx-W*.029,ly-H*.03,W*.058,H*.033);
 const lamp=cx.createRadialGradient(lx,ly-H*.035,0,lx,ly-H*.035,W*.068);lamp.addColorStop(0,'rgba(255,245,215,1)');lamp.addColorStop(.25,'rgba(255,220,150,.7)');lamp.addColorStop(1,'rgba(255,220,150,0)');cx.fillStyle=lamp;cx.beginPath();cx.arc(lx,ly-H*.035,W*.068,0,7);cx.fill();
 cx.fillStyle='#fff3d0';cx.beginPath();cx.arc(lx,ly-H*.035,W*.011,0,7);cx.fill();
 cx.fillStyle='rgba(230,200,140,.26)';cx.beginPath();cx.ellipse(lx,seaY+H*.03,W*.05,H*.008,0,0,7);cx.fill();
 cx.strokeStyle='rgba(90,110,200,.5)';cx.lineWidth=1.4;for(let k=0;k<2;k++){const y0=seaY+H*.04+k*H*.035;cx.beginPath();for(let x=0;x<=W;x+=6){const y=y0+Math.sin(x*.025+t*(1.1+k*.3)+k)*3.5;x===0?cx.moveTo(x,y):cx.lineTo(x,y);}cx.stroke();}
}
function drawSky(t){if(!sky)return;const S=sky.stars,age=t-born,fo=fadeOut?Math.max(0,1-(t-fadeOut)/.9):1;
 const allIn=1.9;const linesK=clamp((age-allIn)/.9,0,1);
 cx.strokeStyle='rgba(243,198,107,'+(.38*fo)+')';cx.lineWidth=1;
 sky.lines.forEach(([i,j],k)=>{const a=S[i],b=S[j],p=clamp(linesK*sky.lines.length-k,0,1);if(p<=0)return;cx.beginPath();cx.moveTo(a.x*W,a.y*H);cx.lineTo((a.x+(b.x-a.x)*p)*W,(a.y+(b.y-a.y)*p)*H);cx.stroke();});
 S.forEach((s,i)=>{const b=reduce?1:clamp((age-i*.1)/.5,0,1);if(b<=0)return;const tw=reduce?.9:(.65+.35*Math.sin(t*s.sp+s.ph));const x=s.x*W,y=s.y*H,a=b*fo;
  if(i===moved){cx.strokeStyle='rgba(243,198,107,'+(.35*a)+')';cx.lineWidth=1;cx.beginPath();cx.arc(x,y,W*.03,0,7);cx.stroke();}
  if(s.lv===2)sparkle(x,y,W*.0065*tw*(.6+.4*b),(.55+.45*tw)*a,s.rot+(reduce?0:t*.08));
  else{const r=s.lv===1?W*.0045:W*.0028;const g=cx.createRadialGradient(x,y,0,x,y,r*3);g.addColorStop(0,'rgba(240,243,255,'+(.9*a*tw)+')');g.addColorStop(1,'rgba(240,243,255,0)');cx.fillStyle=g;cx.beginPath();cx.arc(x,y,r*3,0,7);cx.fill();cx.fillStyle='rgba(250,250,255,'+(.95*a)+')';cx.beginPath();cx.arc(x,y,r*.75,0,7);cx.fill();}});
 if(phase==='arranging'&&age>allIn+.9){phase='ready';onReady();}
}
function frame(now){const t=now/1000;scene(t);drawSky(t);requestAnimationFrame(frame);}
requestAnimationFrame(frame);

/* ---------- 一つだけ動かせる ---------- */
function pos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height};}
cv.addEventListener('pointerdown',e=>{if(phase!=='ready'||!sky)return;const p=pos(e);let best=-1,bd=.06;sky.stars.forEach((s,i)=>{if(moved>=0&&i!==moved)return;const d=dist(s,p);if(d<bd){bd=d;best=i;}});if(best<0)return;dragging=best;cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointermove',e=>{if(dragging<0)return;const p=pos(e);const s=sky.stars[dragging];s.x=clamp(p.x,.04,.96);s.y=clamp(p.y,.04,.66);if(moved<0){moved=dragging;say(tx().moved,true);}});
const endDrag=()=>{dragging=-1;};cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',endDrag);

/* ---------- 流れ ---------- */
const sayEl=$('say');let sayK=0;
function say(t,keep){const k=++sayK;sayEl.classList.add('fade');setTimeout(()=>{if(k!==sayK)return;sayEl.textContent=t;sayEl.classList.remove('fade');},keep?0:350);}
function arrange(){sky=nextSky();born=performance.now()/1000;phase='arranging';fadeOut=0;moved=-1;dragging=-1;$('yes').disabled=$('no').disabled=true;say(tx().arranging);$('night').textContent=tx().night(brain.night);$('hint').textContent='';}
function onReady(){$('yes').disabled=$('no').disabled=false;say(tx().ready);$('hint').textContent=tx().hint;}
function rate(y){if(phase!=='ready')return;phase='leaving';$('yes').disabled=$('no').disabled=true;$('hint').textContent='';
 const f=features(sky);brain.hist.push({f,y:y?1:0,s:sky.stars.map(s=>[+s.x.toFixed(3),+s.y.toFixed(3),s.lv]),l:sky.lines,t:Date.now()});if(brain.hist.length>400)brain.hist.shift();
 train();brain.night++;save();say(y?tx().afterLike:tx().afterNo);renderBrain();renderStrip();
 setTimeout(()=>{fadeOut=performance.now()/1000;},900);setTimeout(arrange,1900);}
$('yes').addEventListener('click',()=>rate(true));$('no').addEventListener('click',()=>rate(false));

/* ---------- 覚えたこと・脳の中・これまで ---------- */
function renderBrain(){const x=tx(),n=brain.hist.length,w=brain.w;
 let line;if(!n)line=x.none;else if(n<3)line=x.few;else{const top=w.map((v,i)=>[Math.abs(v),i,v]).sort((a,b)=>b[0]-a[0]).filter(e=>e[0]>.35).slice(0,2);line=top.length?x.pre+top.map(e=>x.words[e[1]][e[2]>0?0:1]).join(x.join)+(lang==='ja'?'。':'.'):x.flat;}
 $('learned').textContent=line;
 const B=$('brain');B.innerHTML='';const mx=Math.max(.6,...w.map(Math.abs));w.forEach((v,i)=>{const h=clamp(Math.abs(v)/mx,0,1)*21;const el=document.createElement('div');el.className='bar';el.innerHTML='<div class="track"><div class="mid"></div><div class="fill" style="'+(v>=0?'bottom:22px;':'top:22px;')+'height:'+h.toFixed(1)+'px"></div></div><span>'+x.labels[i]+'</span>';B.appendChild(el);});
 const yes=brain.hist.filter(h=>h.y).length;$('tally').textContent=x.tally(yes,n-yes);}
function renderStrip(){const st=$('strip');st.innerHTML='';const H=brain.hist.slice(-40).reverse();
 for(const h of H){const d=document.createElement('div');d.className='thumb';const c=document.createElement('canvas');c.width=92;c.height=100;const g=c.getContext('2d');
  const gr=g.createLinearGradient(0,0,0,100);gr.addColorStop(0,'#0a0e24');gr.addColorStop(1,'#141a3c');g.fillStyle=gr;g.fillRect(0,0,92,100);g.fillStyle='#10163a';g.fillRect(0,82,92,18);
  g.strokeStyle='rgba(243,198,107,.45)';g.lineWidth=1;for(const [i,j] of h.l||[]){const a=h.s[i],b=h.s[j];if(!a||!b)continue;g.beginPath();g.moveTo(a[0]*92,a[1]*100);g.lineTo(b[0]*92,b[1]*100);g.stroke();}
  for(const [x,y,lv] of h.s){g.fillStyle=lv===2?'#fff3d0':'rgba(235,240,255,.85)';g.beginPath();g.arc(x*92,y*100,lv===2?2.4:lv===1?1.5:1,0,7);g.fill();}
  const i=document.createElement('i');i.textContent=h.y?'♡':'·';if(h.y)i.className='y';d.appendChild(c);d.appendChild(i);st.appendChild(d);}}
$('reset').addEventListener('click',()=>{if(!confirm(tx().confirm))return;brain={w:new Array(8).fill(0),b:0,hist:[],night:1};save();renderBrain();renderStrip();arrange();});
function applyLang(){const x=tx();document.documentElement.lang=lang;$('lang').textContent=x.sw;$('title').textContent=x.title;document.title=x.title;$('yes').textContent=x.like;$('no').textContent=x.no;$('pastT').textContent=x.past;$('reset').textContent=x.reset;$('night').textContent=x.night(brain.night);if(phase==='ready'){say(x.ready,true);$('hint').textContent=x.hint;}else if(phase==='arranging')say(x.arranging,true);renderBrain();}
$('lang').addEventListener('click',()=>{lang=lang==='ja'?'en':'ja';try{localStorage.setItem('arrange-stars-lang',lang);}catch(e){}applyLang();});
applyLang();renderStrip();arrange();
})();
</script>
