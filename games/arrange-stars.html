<!DOCTYPE html>
<html lang="ja">
<head>

<title>ステラ</title>
<meta name="description" content="灯台の夜空に、小さい脳が星を並べて形を描く。最初は何も知らない。Sumie が教えると、少しずつ Sumie のニモになる。覚えたことは、この携帯の中だけ。">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ステラ">
<link rel="apple-touch-icon" sizes="180x180" href="./arrange-stars-apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./arrange-stars-icon-192.png">
<link rel="manifest" href="./arrange-stars.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500&family=Space+Mono&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{--bg:#0a0e24;--ink:#e9ecff;--dim:#8d93c8;--gold:#f3c66b;--line:rgba(233,236,255,.14);}
  html,body{min-height:100%;background:var(--bg);}
  body{font-family:'Shippori Mincho','Hiragino Mincho ProN',serif;color:var(--ink);display:flex;justify-content:center;-webkit-tap-highlight-color:transparent;}
  main{width:min(100%,520px);display:flex;flex-direction:column;padding:max(14px,env(safe-area-inset-top)) 16px max(18px,env(safe-area-inset-bottom));}
  header{display:flex;justify-content:space-between;align-items:baseline;padding:4px 2px 10px;}
  h1{font-weight:500;font-size:19px;letter-spacing:.16em;}
  h1 small{font-weight:400;font-size:11px;letter-spacing:.14em;color:var(--dim);margin-left:12px;}
  #lang{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.18em;color:var(--dim);cursor:pointer;padding:4px 0 4px 12px;}
  .words{display:flex;gap:8px;align-items:center;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none;}
  .words::-webkit-scrollbar{display:none;}
  .chip{flex:none;font-family:inherit;font-size:14px;letter-spacing:.06em;padding:7px 14px 6px;border-radius:999px;border:1px solid var(--line);background:rgba(233,236,255,.04);color:var(--dim);cursor:pointer;}
  .chip.on{color:#ffe7b0;border-color:rgba(243,198,107,.55);background:rgba(243,198,107,.08);}
  #word{flex:none;width:176px;font-family:inherit;font-size:16px;padding:5px 12px 4px;border-radius:999px;border:1px dashed var(--line);background:transparent;color:var(--ink);outline:none;}
  #word::placeholder{color:var(--dim);}
  .frame{position:relative;width:100%;aspect-ratio:680/740;border-radius:22px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.45);background:#0a0e24;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;}
  #c{display:block;width:100%;height:100%;}
  #status{display:flex;justify-content:space-between;align-items:baseline;padding:12px 4px 0;font-size:13px;letter-spacing:.08em;color:var(--dim);min-height:34px;}
  #say{color:var(--ink);transition:opacity .5s ease;}
  #say.fade{opacity:0;}
  #lessons{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.12em;}
  .rate{display:flex;gap:12px;padding:12px 0 6px;}
  .rate button{flex:1;font-family:inherit;font-size:15px;letter-spacing:.24em;padding:15px 0 13px;border-radius:999px;border:1px solid var(--line);background:rgba(233,236,255,.04);color:var(--ink);cursor:pointer;transition:background .2s,opacity .3s;}
  .rate button.like{border-color:rgba(243,198,107,.45);color:#ffe7b0;}
  .rate button:disabled{opacity:.35;}
  .rate button:active{background:rgba(233,236,255,.12);}
  #hint{text-align:center;font-size:11px;line-height:1.8;letter-spacing:.08em;color:var(--dim);padding:2px 0 12px;}
  .mind{display:flex;gap:16px;align-items:center;border-top:1px solid var(--line);padding:16px 2px 4px;}
  #map{width:112px;height:86px;border-radius:10px;flex:none;background:#0a0e24;border:1px solid var(--line);}
  .mind p{font-size:13px;line-height:1.9;color:var(--dim);}
  .mind b{display:block;font-weight:500;color:var(--ink);font-size:14px;letter-spacing:.06em;}
  .past{border-top:1px solid var(--line);margin-top:14px;padding:14px 2px 0;}
  .past h2{font-weight:400;font-size:11px;letter-spacing:.2em;color:var(--dim);margin-bottom:10px;}
  #strip{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;}
  #strip::-webkit-scrollbar{display:none;}
  .thumb{flex:none;width:46px;}
  .thumb canvas{width:46px;height:50px;border-radius:6px;display:block;}
  .thumb i{display:block;text-align:center;font-style:normal;font-size:10px;color:var(--gold);padding-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #toFrame{position:absolute;right:12px;bottom:12px;width:40px;height:40px;border-radius:50%;border:1px solid rgba(243,198,107,.45);background:rgba(10,14,36,.55);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:opacity .3s,transform .15s;}
  #toFrame:disabled{opacity:.3;}
  #toFrame:active{transform:scale(.92);}
  #toFrame svg{width:20px;height:20px;}
  .frame.shot{animation:shot 1.1s ease-out;}
  @keyframes shot{0%{box-shadow:0 0 0 0 rgba(255,236,190,.0),0 20px 50px rgba(0,0,0,.45);}20%{box-shadow:0 0 0 3px rgba(255,236,190,.85),0 0 40px rgba(243,198,107,.5);}100%{box-shadow:0 0 0 0 rgba(255,236,190,0),0 20px 50px rgba(0,0,0,.45);}}
  #gakuList{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 12px;}
  #gakuList:empty::after{content:attr(data-empty);grid-column:1/-1;font-size:11px;letter-spacing:.08em;color:var(--dim);opacity:.7;}
  .g1{cursor:pointer;}
  .g1 .fr{padding:4px;border-radius:3px;background:linear-gradient(135deg,#f6dc9c,#b98a3e 45%,#f3d58e 60%,#9c7232);box-shadow:0 6px 16px rgba(0,0,0,.45);}
  .g1 .mat{padding:5px;background:#121735;}
  .g1 canvas{display:block;width:100%;aspect-ratio:680/740;}
  .g1 i{display:block;text-align:center;font-style:normal;font-size:10px;letter-spacing:.06em;color:var(--gold);padding-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #viewer{position:fixed;inset:0;background:rgba(5,7,20,.94);display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));z-index:10;}
  #viewer.on{display:flex;}
  #viewer img{max-width:min(100%,460px);max-height:68vh;display:block;-webkit-touch-callout:default;}
  #viewer .vb{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
  #viewer button{font-family:inherit;font-size:13px;letter-spacing:.14em;padding:11px 18px 10px;border-radius:999px;border:1px solid var(--line);background:rgba(233,236,255,.05);color:var(--ink);cursor:pointer;}
  #viewer button.save{border-color:rgba(243,198,107,.55);color:#ffe7b0;}
  #viewer small{font-size:10px;letter-spacing:.1em;color:var(--dim);}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 14px;}
  .tabs button{flex:1;font-family:inherit;font-size:13px;letter-spacing:.14em;padding:9px 0 10px;background:none;border:none;border-bottom:2px solid transparent;margin-bottom:-1px;color:var(--dim);cursor:pointer;}
  .tabs button.on{color:#ffe7b0;border-bottom-color:rgba(243,198,107,.8);}
  .tabs i{font-style:normal;font-family:'Space Mono',monospace;font-size:10px;margin-left:5px;opacity:.75;}
  section[hidden]{display:none!important;}
  .bar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:2px 0 16px;}
  .bar button,.card .cb button{font-family:inherit;font-size:12px;letter-spacing:.12em;padding:9px 16px 8px;border-radius:999px;border:1px solid var(--line);background:rgba(233,236,255,.04);color:var(--ink);cursor:pointer;}
  .bar button.gold{border-color:rgba(243,198,107,.5);color:#ffe7b0;}
  .lead2{font-size:11px;line-height:1.8;letter-spacing:.06em;color:var(--dim);text-align:center;margin:0 0 14px;}
  #dataList{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 12px;}
  .card{border:1px solid var(--line);border-radius:16px;padding:8px 8px 10px;background:rgba(233,236,255,.03);}
  .card canvas{display:block;width:100%;aspect-ratio:680/740;border-radius:10px;cursor:pointer;}
  .card b{display:block;font-weight:500;font-size:15px;letter-spacing:.06em;color:#ffe7b0;margin:8px 2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .card small{display:block;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.1em;color:var(--dim);margin:2px 2px 8px;}
  .card .cb{display:flex;gap:6px;flex-wrap:wrap;}
  .card .cb button{font-size:11px;padding:6px 10px 5px;letter-spacing:.08em;}
  .card .cb button.del{color:var(--dim);border-color:transparent;background:none;padding-left:4px;padding-right:4px;}
</style>
</head>
<body>
<main>
  <header><h1><span id="title">ステラ</span><small id="sub"></small></h1><div id="lang">EN</div></header>
  <nav class="tabs"><button id="tPlay" class="on" data-tab="Play"></button><button id="tGaku" data-tab="Gaku"></button><button id="tData" data-tab="Data"></button></nav>
  <section id="pPlay">
    <div class="words" id="words"></div>
    <div class="frame"><canvas id="c" aria-label="灯台の夜空に、星が並んでいる。"></canvas><button id="toFrame" disabled><svg viewBox="0 0 20 20" fill="none" stroke="#f3c66b" stroke-width="1.3"><rect x="2.5" y="3" width="15" height="14" rx="1"/><rect x="5" y="5.5" width="10" height="9"/><path d="M10 7.4l.8 1.7 1.8.2-1.3 1.2.4 1.8-1.7-.9-1.7.9.4-1.8-1.3-1.2 1.8-.2z" fill="#f3c66b" stroke="none"/></svg></button></div>
    <div id="status"><span id="say"></span><span id="lessons"></span></div>

    <div id="hint"></div>
    <div class="mind"><canvas id="map" width="224" height="172"></canvas><p><b id="mindT"></b><span id="mindP"></span></p></div>
    <div class="past"><h2 id="pastT"></h2><div id="strip"></div></div>
  </section>
  <section id="pGaku" hidden><p class="lead2" id="gakuLead"></p><div class="bar"><button id="gExp"></button><button id="gImp"></button></div><div id="gakuList"></div></section>
  <section id="pData" hidden><p class="lead2" id="dataLead"></p><div class="bar"><button id="exp" class="gold"></button><button id="imp"></button></div><div id="dataList"></div></section>
  <input type="file" id="impFile" accept=".json,application/json,text/plain" hidden>
  <div id="viewer"><img id="vImg" alt=""><small id="vNote"></small><div class="vb"><button id="vSave" class="save"></button><button id="vDel"></button><button id="vClose"></button></div></div>
</main>
<script>
(()=>{
const $=id=>document.getElementById(id);
/* ---------- ことば ---------- */
const T={
 ja:{sw:'EN',title:'ステラ',sub:'星を並べる子',ph:'＋ なにを並べる？',arranging:w=>['えっと……','んー、ここかな',w+'、'+w+'……'],ready:w=>'できた。たぶん。',like:'好き',here:'ここ！',no:'違う',afterLike:'やった',afterHere:'覚えた。ここだね',afterNo:'あれ？ もう一回',teach:['ふむふむ','そこね'],
  hint:'星を叩くと「そこ」。動かせる。空いてるところを叩くと足す。<br>長押しで消す。教えたら「ここ！」。',mind:w=>'ステラの中の「'+w+'」',
  stage:n=>n<3?'まだ、何も知らない。':n<10?'なんとなく、形が見えてきた。':n<25?'だいぶ分かってきた。':'もう、Sumie の形になってる。',
  lessons:n=>'教えた '+n+' 回',past:'好きと言われた夜',tabPlay:'ステラ',tabGaku:'額縁',tabData:'学習データ',gakuLead:'気に入った夜。絵を叩くと、大きく見たり、写真に保存したり、外したりできる。',dataLead:'言葉ごとの、ステラの頭の中。いちばん最近の絵。絵を叩くと取り出せる。',exp:'全部を取り出す',imp:'全部を入れる',gExp:'額縁を取り出す',gImp:'額縁を入れる',cExp:'取り出す',cImp:'入れる',cDel:'忘れる',expDone:'取り出した',impQ:n=>'このファイルの「'+n+'」を入れる？ 同じ言葉は、ファイルの方で置き換わる。',impWordQ:w=>'このファイルの「'+w+'」を入れる？ 今の「'+w+'」は、ファイルの方で置き換わる。',impRename:(a,b)=>'このファイルに入ってるのは「'+a+'」。「'+b+'」として入れる？',notIn:w=>'このファイルに「'+w+'」は入ってないみたい',impFramesQ:n=>'このファイルの額縁を '+n+' 枚入れる？ 同じ額縁は二枚にならない。',noFrames:'このファイルに額縁は入ってないみたい',impDone:'入れた。おかえり',impBad:'ステラのファイルじゃないみたい',noData:'まだ何も覚えてない。ステラのところで言葉を入れてみて。',frameBtn:'額縁に入れる',framed:'額縁に入れた',gaku:'ステラの額縁',gakuEmpty:'気に入った夜は、右下の額縁のボタンで飾れる。',save:'写真に保存',del:'額縁から外す',close:'閉じる',delQ:'この絵を額縁から外す？',note:'画像を長押ししても保存できる',forget:w=>'「'+w+'」を忘れる',confirm:w=>'「'+w+'」で覚えたことを、全部忘れる？'},
 en:{sw:'日本語',title:'Stella',sub:'arranges stars',ph:'+ what shall I draw?',arranging:w=>['umm...','hmm, here maybe',w+', '+w+'...'],ready:w=>'done. probably.',like:'like',here:'here!',no:'not this',afterLike:'yay',afterHere:'got it. right here.',afterNo:'huh? one more time',teach:['mm-hm','there, got it'],
  hint:'tap a star to say "that one". drag to move. tap empty space to add.<br>hold to remove. then press "here!".',mind:w=>'"'+w+'" inside Stella',
  stage:n=>n<3?"I don't know it yet.":n<10?'a shape is starting to show.':n<25?'getting there.':"it's your shape now.",
  lessons:n=>n+' lessons',past:'nights you liked',tabPlay:'Stella',tabGaku:'frames',tabData:'learning',gakuLead:'nights you loved. tap one to see it big, save it to your photos, or take it down.',dataLead:"what's inside Stella, word by word. her latest picture. tap it to save.",exp:'save everything',imp:'load everything',gExp:'save frames',gImp:'load frames',cExp:'save',cImp:'load',cDel:'forget',expDone:'saved',impQ:n=>'load "'+n+'" from this file? the same words will be replaced by the file.',impWordQ:w=>'load "'+w+'" from this file? the "'+w+'" here will be replaced.',impRename:(a,b)=>'this file has "'+a+'". load it as "'+b+'"?',notIn:w=>'"'+w+'" isn\'t in this file',impFramesQ:n=>'load '+n+' frames from this file? the same frame won\'t be added twice.',noFrames:'no frames in this file',impDone:'loaded. welcome back',impBad:"that doesn't look like a Stella file",noData:"she hasn't learned anything yet. give her a word on the Stella tab.",frameBtn:'frame it',framed:'framed it',gaku:"Stella's frames",gakuEmpty:'frame a night you love with the button at the bottom right.',save:'save image',del:'take it down',close:'close',delQ:'take this one out of its frame?',note:'you can also press and hold the image to save',forget:w=>'forget "'+w+'"',confirm:w=>'forget everything about "'+w+'"?'}
};
let lang='ja';try{lang=localStorage.getItem('arrange-stars-lang')||'ja';}catch(e){}
const tx=()=>T[lang];

/* ---------- 脳：言葉ごとの、形の地図 ---------- */
const G=28,X0=.05,X1=.95,Y0=.05,Y1=.66,ASP=680/740,BIG=19,SMALL=78,FLOOR=.03;
const KEY='arrange-stars:v2';
let mem={words:{},cur:'ニモ',hist:[]};
try{const m=JSON.parse(localStorage.getItem(KEY)||'null');if(m&&m.words)mem=m;}catch(e){}
if(!mem.frames)mem.frames=[];
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(mem));}catch(e){}}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=Math.random;
const isEmoji=s=>/\p{Extended_Pictographic}/u.test(s);
function blankMap(){const M=new Array(G*G).fill(FLOOR);for(let k=0;k<3;k++){const cx=4+rnd()*(G-8),cy=4+rnd()*(G-8),s=2+rnd()*4;for(let j=0;j<G;j++)for(let i=0;i<G;i++)M[j*G+i]+=.35*Math.exp(-((i-cx)**2+(j-cy)**2)/(2*s*s));}return M;}
function emojiMap(e){const c=document.createElement('canvas');c.width=c.height=G;const g=c.getContext('2d');g.textAlign='center';g.textBaseline='middle';g.font=Math.floor(G*.86)+'px sans-serif';g.fillText(e,G/2,G/2+1);const d=g.getImageData(0,0,G,G).data,M=new Array(G*G);for(let i=0;i<G*G;i++)M[i]=.04+1.2*d[i*4+3]/255;return M;}
function word(w){if(!mem.words[w])mem.words[w]={M:isEmoji(w)?emojiMap(w):blankMap(),n:0,likes:0,edits:0};if(mem.words[w].edits==null)mem.words[w].edits=0;return mem.words[w];}
const conf=W_=>W_.n+W_.edits*.5;
/* 正規化座標 ⇔ 地図のマス */
const toCell=p=>({i:clamp((p.x-X0)/(X1-X0)*G-.5,0,G-1),j:clamp((p.y-Y0)/(Y1-Y0)*G-.5,0,G-1)});
const fires=[];
function stamp(M,p,a,s=1.25){const {i,j}=toCell(p);if(a>.3)fires.push({i,j,t:performance.now()/1000,a:Math.min(1,a/1.6)});for(let y=Math.max(0,Math.floor(j-4));y<=Math.min(G-1,Math.ceil(j+4));y++)for(let x=Math.max(0,Math.floor(i-4));x<=Math.min(G-1,Math.ceil(i+4));x++){M[y*G+x]=clamp(M[y*G+x]+a*Math.exp(-((x-i)**2+(y-j)**2)/(2*s*s)),.01,8);}}
function valAt(M,p){const {i,j}=toCell(p);return M[Math.round(j)*G+Math.round(i)];}
const dist=(p,q)=>Math.hypot((p.x-q.x)*ASP,p.y-q.y);
/* 地図から星を置く。教えるほど、濃いところに集まる */
function draw(w){const W_=word(w),M=W_.M,gam=1+Math.min(W_.n,30)*.07;const P=M.map(v=>Math.pow(v,gam)),tot=P.reduce((a,b)=>a+b,0);const stars=[];
 const pick=()=>{let r=rnd()*tot;for(let k=0;k<P.length;k++){r-=P[k];if(r<=0)return k;}return P.length-1;};
 for(let n=0;n<BIG+SMALL;n++){let p,t=0;do{const k=pick(),i=k%G,j=(k/G)|0;p={x:X0+(i+rnd())/G*(X1-X0),y:Y0+(j+rnd())/G*(Y1-Y0)};t++;}while(t<14&&stars.some(q=>dist(p,q)<.024));stars.push(p);}
 stars.forEach(s=>{s.v=valAt(M,s);s.ph=rnd()*6.28;s.sp=.6+rnd()*1.2;s.rot=rnd()*6.28;});
 stars.sort((a,b)=>b.v-a.v);stars.forEach((s,k)=>s.big=k<BIG);
 /* 置く順はばらばらに */
 for(let k=stars.length-1;k>0;k--){const r=Math.floor(rnd()*(k+1));[stars[k],stars[r]]=[stars[r],stars[k]];}
 return stars;}

/* ---------- 絵 ---------- */
const cv=$('c');let cx=cv.getContext('2d'),W=0,H=0;
function resize(){const d=Math.min(devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0);}
addEventListener('resize',resize);resize();
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const dust=Array.from({length:150},()=>({x:Math.random(),y:Math.random()*.8,r:.25+Math.random()*.55,ph:Math.random()*6.28,sp:.4+Math.random()*1.2,tint:Math.random()<.15?'255,236,200':'220,228,255'}));
function sparkle(x,y,r,alpha,rot){cx.save();cx.translate(x,y);cx.rotate(rot);
 const g=cx.createRadialGradient(0,0,0,0,0,r*3.2);g.addColorStop(0,'rgba(255,250,235,'+alpha+')');g.addColorStop(.35,'rgba(255,240,200,'+alpha*.55+')');g.addColorStop(1,'rgba(255,240,200,0)');cx.fillStyle=g;cx.beginPath();cx.arc(0,0,r*3.2,0,7);cx.fill();
 cx.fillStyle='rgba(255,252,240,'+alpha+')';cx.beginPath();cx.arc(0,0,r*.9,0,7);cx.fill();
 cx.strokeStyle='rgba(255,246,220,'+alpha*.85+')';cx.lineWidth=Math.max(1,r*.35);cx.lineCap='round';for(let k=0;k<2;k++){cx.beginPath();cx.moveTo(-r*4.2,0);cx.lineTo(r*4.2,0);cx.stroke();cx.rotate(Math.PI/2);}
 cx.rotate(Math.PI/4);cx.strokeStyle='rgba(255,246,220,'+alpha*.35+')';cx.lineWidth=Math.max(.6,r*.2);for(let k=0;k<2;k++){cx.beginPath();cx.moveTo(-r*2.2,0);cx.lineTo(r*2.2,0);cx.stroke();cx.rotate(Math.PI/2);}cx.restore();}

 const g=cx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0a0e24');g.addColorStop(.75,'#141a3c');g.addColorStop(.82,'#1a2250');g.addColorStop(1,'#0e1230');cx.fillStyle=g;cx.fillRect(0,0,W,H);

function addFrames(list,rename){const seen=new Set(mem.frames.map(x=>x.t));let n=0;for(const x of list||[])if(x&&x.t&&Array.isArray(x.s)&&!seen.has(x.t)){mem.frames.push(rename?{...x,w:rename}:x);seen.add(x.t);n++;}mem.frames.sort((a,b)=>b.t-a.t);mem.frames.length=Math.min(mem.frames.length,60);return n;}
$('impFile').addEventListener('change',async e=>{const f=e.target.files&&e.target.files[0];e.target.value='';const md=impMode||{kind:'all'};impMode=null;if(!f)return;const x=tx();
 let o;try{o=JSON.parse(await f.text());}catch(err){alert(x.impBad);return;}
 if(!(o&&o.app==='stella'&&o.mem&&typeof o.mem==='object')){alert(x.impBad);return;}
 const words={};for(const [w,W_] of Object.entries(o.mem.words||{})){const c=cleanWord(W_);if(c)words[w]=c;}
 if(md.kind==='frames'){const fr=(o.mem.frames||[]).filter(x=>x&&x.t&&Array.isArray(x.s));if(!fr.length){alert(x.noFrames);return;}if(!confirm(x.impFramesQ(fr.length)))return;addFrames(fr);}
 else if(md.kind==='word'){const w=md.w;let src=w;if(!words[w]){const ks=Object.keys(words);if(ks.length!==1){alert(x.notIn(w));return;}src=ks[0];if(!confirm(x.impRename(src,w)))return;}else if(!confirm(x.impWordQ(w)))return;
  mem.words[w]=words[src];addHist((o.mem.hist||[]).filter(h=>h&&h.w===src),src!==w?w:null);addFrames((o.mem.frames||[]).filter(f=>f&&f.w===src),src!==w?w:null);if(mem.cur===w)arrange();}
 else{const names=Object.keys(words);if(!names.length){alert(x.impBad);return;}if(!confirm(x.impQ(names.join('」「'))))return;Object.assign(mem.words,words);addHist(o.mem.hist);addFrames(o.mem.frames);if(o.mem.cur&&words[o.mem.cur])mem.cur=o.mem.cur;arrange();}
 save();renderWords();renderStrip();renderGaku();renderData();tabLabels();setTimeout(()=>say(x.impDone,true),60);});
function applyLang(){const x=tx();document.documentElement.lang=lang;$('lang').textContent=x.sw;$('title').textContent=x.title;$('sub').textContent=x.sub;document.title=x.title;$('yes').textContent=touched?x.here:x.like;$('no').textContent=x.no;$('pastT').textContent=x.past;$('gakuLead').textContent=x.gakuLead;$('dataLead').textContent=x.dataLead;$('gExp').textContent=x.gExp;$('gImp').textContent=x.gImp;tabLabels();$('toFrame').setAttribute('aria-label',x.frameBtn);$('toFrame').title=x.frameBtn;$('vSave').textContent=x.save;$('vDel').textContent=x.del;$('vClose').textContent=x.close;$('vNote').textContent=x.note;$('exp').textContent=x.exp;$('imp').textContent=x.imp;renderGaku();if(tab==='Data')renderData();
 if(phase==='ready'){say(x.ready(mem.cur),true);$('hint').innerHTML=x.hint;}else if(phase==='arranging')say(x.arranging(mem.cur)[0],true);renderWords();renderMind();}
$('lang').addEventListener('click',()=>{lang=lang==='ja'?'en':'ja';try{localStorage.setItem('arrange-stars-lang',lang);}catch(e){}applyLang();});
word(mem.cur);applyLang();renderStrip();arrange();showTab(tab);
})();
