 if(fishStart&&box.children.length){const f=fishStart;fishStart=null;setFish(true);if(f.includes(',')){const a=f.split(',').map(Number);FP.x=a[0];FP.y=a[1];FP.z=a[2];FP.yaw=FP.ty=a[3]||0;FP.pitch=FP.tp=a[4]||0;FP.still=true;}}
 const dt=Math.min(.05,Math.max(.001,t-(frame.lt||t)));frame.lt=t;if(fish)fishStep(dt,t);else{project();if(ED.on)edDraw();}renderer.render(scene,cam);
