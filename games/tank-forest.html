if(innerHeight>innerWidth)tip.textContent='横にすると、水槽が大きくなる';
const clock=new THREE.Clock();let first=true;
function frame(){const t=clock.getElapsedTime();uTime.value=t;
 if(!fixed&&!drag&&!tilt&&performance.now()-lastTouch>4000){tx+=(Math.sin(t*.22)*.4-tx)*.008;ty+=(.08+Math.sin(t*.13)*.1-ty)*.008;}
 const k=drag?.75:.22;ex+=(tx*hw*1.1-ex)*k;ey+=(ty*HS*.42-ey)*k;
 if(surf){const sp=surf.geometry.attributes.position;for(let i=0;i<sp.count;i++){const x=surfBase[i*3],y=surfBase[i*3+1];sp.setZ(i,Math.sin(x*6+t*1.5)*.012+Math.cos(y*7+t*1.2)*.01);}sp.needsUpdate=true;}
 for(const r of rays)r.material.opacity=.05+.1*(.5+.5*Math.sin(t*r.userData.sp+r.userData.ph));
 if(motes){const mp=motes.geometry.attributes.position,mv=motes.userData.v;for(let i=0;i<mp.count;i++){let y=mp.getY(i)+.00018;if(y>TOPY)y=BOT+.3;mp.setY(i,y);mp.setX(i,mp.getX(i)+Math.sin(t*.4+mv[i])*.00016);}mp.needsUpdate=true;}
 project();renderer.render(scene,cam);
 if(first){first=false;const l=document.getElementById('load');l.style.opacity=0;setTimeout(()=>l.remove(),1100);setTimeout(()=>tip.style.opacity=0,5000);window.__ready=true;}
 requestAnimationFrame(frame);}
setTimeout(()=>{resize();requestAnimationFrame(frame);},60);
})();
</script>
