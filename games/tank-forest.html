varying vec3 vWPos;uniform float uTime;uniform float uCa;

 /* 前のガラスの下：底砂の断面 */
 {const pos=[],col=[],idx=[],n=160;for(let i=0;i<=n;i++){const x=-hw+WS*i/n,y=ground(x,-.001),d0=Math.abs(x-pathX(0)),pw0=pathW(0),tt=sst(pw0*1.1,pw0*.8,d0),k=.75+vn(x*22,3,0)*.5,ym=Math.max(BOT+.004,y-.022);
   pos.push(x,BOT,0,x,ym,0,x,y,0);const L=(a,b,t)=>a+(b-a)*t;col.push(.035*k,.033*k,.032*k,.06*k,.055*k,.05*k,L(.075,.86,tt)*k,L(.07,.82,tt)*k,L(.06,.7,tt)*k);if(i<n){const a=i*3;idx.push(a,a+3,a+1,a+1,a+3,a+4,a+1,a+4,a+2,a+2,a+4,a+5);}}

 {const blobs=[];for(const [p,rad] of mossPts){const n=16+Math.floor(R()*12);for(let i=0;i<n;i++){const a=R()*6.283,d=Math.sqrt(R())*rad*1.1,hh=(1-d/(rad*1.1));blobs.push([p.x+Math.cos(a)*d,p.y+(R()-.4)*rad*.3+hh*rad*.3,p.z+Math.sin(a)*d,rad*(.2+R()*.22)]);}}
