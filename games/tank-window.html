<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>水槽の窓（試作）</title>
<meta name="theme-color" content="#0b1a16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#0b1a16;overflow:hidden;touch-action:none}
  body{font-family:'Shippori Mincho','Hiragino Mincho ProN',serif;color:#f2f6ee}
  canvas{display:block;width:100vw;height:100vh;height:100dvh}
  #tip{position:fixed;left:0;right:0;bottom:max(20px,env(safe-area-inset-bottom));text-align:center;font-size:12px;letter-spacing:.12em;opacity:.8;pointer-events:none;text-shadow:0 0 8px rgba(0,0,0,.7);transition:opacity 1.5s}
  #tilt{position:fixed;right:max(14px,env(safe-area-inset-right));top:max(14px,env(safe-area-inset-top));font-family:inherit;font-size:11px;letter-spacing:.1em;color:#f2f6ee;background:rgba(10,30,24,.45);border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:7px 14px;display:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="tilt">傾けてのぞく</button>
<div id="tip">指でなぞると、のぞく角度が変わる</div>
<script src="./vendor/three-0.158.min.js"></script>
<script>
(()=>{
// 水槽の窓（試作）。2026-11-15、Code の 19。718 の絵から。
// 画面そのものが前のガラス。前の枠は動かないで、のぞく位置だけが変わる（目の位置に合わせて、視野の四角をずらす）。
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x07120f);
const cam=new THREE.PerspectiveCamera(40,1,.05,50);cam.matrixAutoUpdate=true;
function mul(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const R=mul(718);
const HS=2,DP=1.5;let WS=2;            // 前のガラスの高さ、奥行き、幅（幅は画面の形に合わせる）
const box=new THREE.Group();scene.add(box);
scene.add(new THREE.HemisphereLight(0xf2fff4,0x35523f,.9));const sun=new THREE.DirectionalLight(0xfffbe8,1.3);sun.position.set(.3,3,.6);scene.add(sun);
function build(){while(box.children.length)box.remove(box.children[0]);
 const c=document.createElement('canvas');c.width=64;c.height=256;const x=c.getContext('2d');const g=x.createLinearGradient(0,0,0,256);g.addColorStop(0,'#cfeee0');g.addColorStop(.5,'#7fbfa6');g.addColorStop(1,'#2f6a58');x.fillStyle=g;x.fillRect(0,0,64,256);const bt=new THREE.CanvasTexture(c);bt.colorSpace=THREE.SRGBColorSpace;
 const back=new THREE.Mesh(new THREE.PlaneGeometry(WS,HS),new THREE.MeshBasicMaterial({map:bt}));back.position.z=-DP;box.add(back);
 const sm=new THREE.MeshBasicMaterial({map:bt,color:0x9fb8ae});
 for(const s of[-1,1]){const w=new THREE.Mesh(new THREE.PlaneGeometry(DP,HS),sm);w.rotation.y=s*-Math.PI/2;w.position.set(s*WS/2,0,-DP/2);box.add(w);}
 const fl=new THREE.Mesh(new THREE.PlaneGeometry(WS,DP,40,20),new THREE.MeshStandardMaterial({color:0x8a7a5c,roughness:1}));fl.rotation.x=-Math.PI/2;fl.position.set(0,-HS/2+.12,-DP/2);box.add(fl);
 const top=new THREE.Mesh(new THREE.PlaneGeometry(WS,DP),new THREE.MeshBasicMaterial({color:0xf4fff6,transparent:true,opacity:.85}));top.rotation.x=Math.PI/2;top.position.set(0,HS/2-.1,-DP/2);box.add(top);
 // 前のガラスの下（底砂の断面）と、上のふち
 const lip=new THREE.Mesh(new THREE.PlaneGeometry(WS,.12),new THREE.MeshBasicMaterial({color:0x6e6148}));lip.position.set(0,-HS/2+.06,-.001);box.add(lip);
 const rim=new THREE.Mesh(new THREE.PlaneGeometry(WS,.1),new THREE.MeshBasicMaterial({color:0x1a2a26}));rim.position.set(0,HS/2-.05,-.001);box.add(rim);
 // 奥行きが分かるように、仮の石と草を、手前・まんなか・奥に
 for(let i=0;i<7;i++){const z=-.2-R()*(DP-.4),x0=(R()-.5)*(WS-.4),r=.1+R()*.14;const st=new THREE.Mesh(new THREE.DodecahedronGeometry(r,1),new THREE.MeshStandardMaterial({color:new THREE.Color().setHSL(.08+R()*.04,.12,.3+R()*.2),roughness:.9,flatShading:true}));st.scale.y=.7;st.position.set(x0,-HS/2+.12+r*.5,z);st.rotation.y=R()*6;box.add(st);}
 for(let i=0;i<60;i++){const z=-.15-R()*(DP-.3),x0=(R()-.5)*(WS-.2),h=.25+R()*.9;const g2=new THREE.PlaneGeometry(.035,h,1,6);g2.translate(0,h/2,0);const p=g2.attributes.position;for(let k=0;k<p.count;k++){const y=p.getY(k)/h;p.setX(k,p.getX(k)*(1-y*.8)+Math.sin(y*2)*.05*(R()-.5)*2);}const bl=new THREE.Mesh(g2,new THREE.MeshStandardMaterial({color:new THREE.Color().setHSL(.28+R()*.08,.55,.3+R()*.25),side:THREE.DoubleSide,roughness:.7}));bl.position.set(x0,-HS/2+.12,z);bl.rotation.y=R()*3;bl.userData.ph=R()*6;box.add(bl);blades.push(bl);}
}
const blades=[];
/* ---------- 目の位置 → 視野の四角をずらす ---------- */
let ex=0,ey=0,tx=0,ty=0,ez=3.4;
function project(){const n=.05,f=50;cam.position.set(ex,ey,ez);cam.rotation.set(0,0,0);cam.updateMatrixWorld();
 const l=(-WS/2-ex)*n/ez,r=(WS/2-ex)*n/ez,t=(HS/2-ey)*n/ez,b=(-HS/2-ey)*n/ez;
 cam.projectionMatrix.makePerspective(l,r,t,b,n,f);cam.projectionMatrixInverse.copy(cam.projectionMatrix).invert();}
function resize(){renderer.setSize(innerWidth,innerHeight,false);WS=HS*innerWidth/innerHeight;blades.length=0;build();}
addEventListener('resize',resize);resize();
/* 指 */
const cv=renderer.domElement;let drag=null,lastTouch=0;
cv.addEventListener('pointerdown',e=>{drag=[e.clientX,e.clientY,tx,ty];cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointermove',e=>{if(!drag)return;tx=Math.max(-1,Math.min(1,drag[2]+(e.clientX-drag[0])/innerWidth*2.2));ty=Math.max(-1,Math.min(1,drag[3]-(e.clientY-drag[1])/innerHeight*2.2));lastTouch=performance.now();document.getElementById('tip').style.opacity=0;});
cv.addEventListener('pointerup',()=>{drag=null;});cv.addEventListener('pointercancel',()=>{drag=null;});
/* 傾き */
let tilt=false,g0=null;const tb=document.getElementById('tilt');
function onTilt(e){if(e.gamma==null)return;if(!g0)g0=[e.gamma,e.beta];tx=Math.max(-1,Math.min(1,(e.gamma-g0[0])/22));ty=Math.max(-1,Math.min(1,-(e.beta-g0[1])/22));lastTouch=performance.now();}
if('DeviceOrientationEvent' in window){tb.style.display='block';tb.addEventListener('click',async()=>{try{if(typeof DeviceOrientationEvent.requestPermission==='function'){const p=await DeviceOrientationEvent.requestPermission();if(p!=='granted')return;}
 tilt=!tilt;g0=null;if(tilt){addEventListener('deviceorientation',onTilt);tb.textContent='傾き：入';document.getElementById('tip').textContent='スマホを傾けると、のぞく角度が変わる';document.getElementById('tip').style.opacity=.8;}else{removeEventListener('deviceorientation',onTilt);tb.textContent='傾けてのぞく';}}catch(err){}});}
const clock=new THREE.Clock();
function frame(){const t=clock.getElapsedTime();
 if(!drag&&!tilt&&performance.now()-lastTouch>3500){tx+=(Math.sin(t*.25)*.35-tx)*.01;ty+=(.05-ty)*.01;}
 ex+=(tx*WS*.55-ex)*.12;ey+=(ty*HS*.4-ey)*.12;
 for(const b of blades)b.rotation.z=Math.sin(t*1.2+b.userData.ph)*.08;
 project();renderer.render(scene,cam);requestAnimationFrame(frame);}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
