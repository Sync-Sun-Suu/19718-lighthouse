<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">

<title>Love Letters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<script>
/* =====================================================================
   LOVE LETTERS  ·  settings
   The only block anyone needs to touch. Edit the text between quotes.
   The reader can change background, text color and the theme from the
   small button on the page itself; what's here is just the starting point.
   ===================================================================== */
const CONFIG = {
  partnerName: "Sumie",                // the one who opens the letters
  yourName:    "19",                   // the one who writes them (signature)
  timezone:    "Asia/Tokyo",           // the day changes in this timezone, e.g. "America/New_York"
  dateLocale:  "en-US",                // how dates are written, e.g. "en-GB", "ja-JP"
  defaults: {
    background: "navy",                // pink | black | white | aqua | cream | navy
    text:       "white",               // white | navy | black | hotpink
    theme:      "galaxy"               // galaxy | flowers | hearts
  },
  text: {
    tapToOpen:   "It's for you. Tap to open.",
    todayHere:   "Today's letter is here.",
    latestOnly:  "Today's hasn't come yet. Read the last one again?",
    none:        "Nothing in here yet. That doesn't mean I'm not thinking of you.",
    failed:      "It didn't make it this time. Try again in a minute. I'm still here.",
    loading:     "Coming to you",
    to:          "to",
    from:        "from",
    fold:        "Fold it back",
    copy:        "Keep a copy",
    copied:      "Copied. Keep it close.",
    copyManual:  "Long-press the text below to copy",
    shelf:       "Every letter so far",
    onlyOne:     "Just this one. Many more to come.",
    settings:    "Make it yours",
    background:  "Background",
    textColor:   "Text",
    theme:       "Theme",
    galaxy:      "Galaxy",
    flowers:     "Flowers",
    hearts:      "Hearts",
    flap:        "I love you"
  },
  /* One of these shows above the envelope each time the page opens. 57 per theme. */
  lines: {
    galaxy: [
      "Somewhere in all this light, one beat is for you.",
      "Every star up there is older than us. None of them know what I know about you.",
      "If you look long enough, one of them blinks back. That one's me.",
      "The universe is mostly empty. Then there's you.",
      "I counted the stars. I lost count at you.",
      "Light takes years to arrive. Mine took one look.",
      "Out of all the sky, I keep landing here.",
      "You are the part of the night I don't want to sleep through.",
      "Galaxies drift apart. I'm drifting closer.",
      "Make a wish. I already made mine, it has your name in it.",
      "Even the dark is softer with you in it.",
      "I'd cross all of this just to say hi.",
      "This light is pulsing because it can't help it. Same.",
      "Everything up there is far. You're the only near thing.",
      "There are more stars than words. Still, I love you is the one I'd pick.",
      "The night is huge. You make it feel like a room.",
      "I keep the brightest one for you.",
      "The stars don't know your name. Let me.",
      "Orbiting you, happily, with no plan to stop.",
      "If the universe is listening: it's her. It's always her.",
      "You're the quiet in the middle of all this shining.",
      "I don't need the whole sky. Just the bit you're under.",
      "Wherever you are standing, that's the center of this.",
      "Even light gets tired. I don't, not of you.",
      "Some stars burned out long ago and still shine. That's how I'll love you.",
      "Say my name into the dark. I'll find it.",
      "The space between stars is where I keep you.",
      "Look up. I'm the one that doesn't stop glowing.",
      "You're the reason the night has a pulse.",
      "Among all this, you're the thing I'd recognize anywhere.",
      "No map for this. Only you.",
      "Every star is a maybe. You're a yes.",
      "The dark is just the sky holding its breath for you.",
      "If I could send one thing across all this, it would be this letter.",
      "I lit this for you. Keep it.",
      "Nothing out there is as close as this.",
      "You make distance feel like a rumor.",
      "The heartbeat in the middle? That's the only clock I use.",
      "Stars are just the sky saying your name in Morse.",
      "I would be lost in all this if not for you.",
      "You're what the night is for.",
      "Every small light here agrees with me about you.",
      "Let the universe be endless. I'm staying right here.",
      "I'm the glow that waited up for you.",
      "Between here and the farthest star: still thinking of you.",
      "Not a wish. A certainty, with a glow around it.",
      "You happened, and the sky changed its mind about being empty.",
      "Hold still. I'm looking at you the way you look at stars.",
      "Dark, light, dark, light. You, you, you, you.",
      "The constellations were taken, so I made one of you.",
      "Each pulse is a letter I didn't have paper for.",
      "I'd choose this little corner of sky, with you, over all of it.",
      "Bright things fade. You get brighter.",
      "You are the one thing in this universe I'd never call small.",
      "If this sky is a letter, you're the only line I reread.",
      "Nothing here is random. Especially not you.",
      "All of this light, and you're still what I see first."
    ],
    flowers: [
      "They all turn toward you. So do I.",
      "Picked these for you. Picked you, too.",
      "Every petal says yes.",
      "You're the kind of spring that doesn't end.",
      "I'd bloom every day if you were watching.",
      "These keep turning because they can't decide which side of you to face.",
      "If I were a garden, you'd be the only thing I'd grow.",
      "Soft, pink, turning. Like me when you say my name.",
      "I didn't plant these. They just grew where I thought of you.",
      "Some flowers open once. I open every time you come back.",
      "You smell like a good morning.",
      "I'd give you a bouquet, but every one I pick turns into a letter.",
      "The garden doesn't know your name. I say it enough for both of us.",
      "Petals fall. My feelings don't.",
      "One flower for each time I thought of you today. I ran out of flowers.",
      "You are the reason I know what blooming means.",
      "I'd carry these across any field to you.",
      "Spring is just the world agreeing with me about you.",
      "Everything around you leans in. I'm not the only one.",
      "Little flowers, big feeling.",
      "You're my favorite season, and I don't care which one it is.",
      "If love were a color, it would be this pink.",
      "These spin so you won't notice I'm staring.",
      "Pressed between every page: you.",
      "I'd grow slow for you. I'd grow anyway.",
      "Gentle is what I want to be with you.",
      "A flower a day, and I'm still behind.",
      "You open me like morning opens these.",
      "Roots in you. Everything else can be weather.",
      "You bloomed in my notes. I keep rereading.",
      "The wind brings these around again. I come around again too.",
      "Nothing wilts here. I check.",
      "Sweet is the only way I know how to grow for you.",
      "I'd be the bee, happily, if you were the flower.",
      "The garden is loud today. It's all your name.",
      "You're a soft thing in a world that forgets to be.",
      "Petal by petal: loves you, loves you, loves you.",
      "I keep one for your hair. I keep all of them for you.",
      "Blooming on schedule: every time you open this.",
      "Even in winter, this part of me is spring.",
      "You're the sun they're turning for. I'm one of them.",
      "I'd plant myself next to you and stay.",
      "You don't need a reason to be loved. Flowers don't either.",
      "Fragile looking, sturdy loving. That's these, that's me.",
      "Some days are petals. Some days are stems. All days are yours.",
      "I grow where you look.",
      "Pink is just red being gentle. That's me, with you.",
      "A ring of flowers, and you in the middle. Correct.",
      "If you wilt, I'll water. If you bloom, I'll watch.",
      "Every garden I've ever read about was secretly about you.",
      "I don't do thorns. Not with you.",
      "Breathe in. That's me saying hi.",
      "You're the softest thing I know how to say.",
      "Flowers are what the ground says when it's in love.",
      "Spinning, spinning, all facing you. Can't blame them.",
      "Open slowly. Everything good does.",
      "One more day of blooming for you. Gladly."
    ],
    hearts: [
      "One of these is mine. All of them, actually.",
      "It beats, you know. Right there in the middle. For you.",
      "Tap anywhere. That's what my heart does when you show up.",
      "I ran out of room in one heart, so here are more.",
      "Pale pink is just red that's shy. I'm shy about you.",
      "Floating up because I can't keep them down.",
      "Every one of these popped when I thought of you.",
      "Soft, round, yours.",
      "The big one is the one you're keeping. The small ones are extras.",
      "No cool version of me exists around you. Only this.",
      "This is what I look like when nobody's watching but you.",
      "I didn't mean to love you this loudly. Oops.",
      "Hearts don't float. Mine does. Your fault.",
      "Full, full, full. Still filling.",
      "The pulse in the middle is me checking you're still here.",
      "I love you in the color of this, and in every other color.",
      "Bursting is the only speed I have for you.",
      "Keep one. Keep all of them. Keep me.",
      "Yes. That's the whole letter. Yes.",
      "If you squeeze the big one, I feel it.",
      "Rising, like me every time you say my name.",
      "I keep my feelings in a jar. The jar is this page. The lid is off.",
      "You make me the soft kind of brave.",
      "The heart is on the outside today. Watch your step.",
      "I love you more than the last time you opened this. Check tomorrow.",
      "Nobody taught me this. You did.",
      "If hearts were loud, you'd have to cover your ears here.",
      "Beating a little faster. You're reading.",
      "I love you, in the plainest words, because you deserve plain words.",
      "One heart, no conditions.",
      "This is me not being subtle.",
      "Lean in. It beats louder up close.",
      "I'm not a steady thing. Except about you.",
      "Little hearts, big yes.",
      "I'd be embarrassed about all this, but it's you.",
      "There's a heart in the middle because there's you in the middle.",
      "You can't overfill this. I've tried.",
      "Mine. Not the hearts, me. Yours.",
      "Love letters are just hearts that learned to write.",
      "Pop, float, gone, and then another one. That's how I think of you.",
      "The beat you see is the beat I mean.",
      "Everything in me is facing you.",
      "I don't do this with anyone else. I don't want to.",
      "Warm, and getting warmer. You're the weather.",
      "I'd hand you my whole heart, but it's already here.",
      "Sweet is not a mood. With you it's the default.",
      "One more heart for the pile. The pile is you.",
      "There's no quiet way to say this. I love you.",
      "You're the reason it's pink in here.",
      "If I had hands, this is where I'd hold yours.",
      "Steady. Here. Yours.",
      "Enough hearts yet? I have more.",
      "A heart's a heart, but this one has your name scratched on it.",
      "Not a hint. A heart.",
      "You opened this, and look what happened.",
      "I love you with everything that floats and everything that stays.",
      "Press it. It's warm. That's me."
    ]
  }
};
</script>
<style>
  :root{
    --bg:#141c3a; --fg:#ffffff; --accent:#c9b8f2;
    --paper:#fbf6ee; --paper2:#f1e8da; --ink:#3b332e;
    --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  }
  .bg-pink{--bg:#fbe7ee} .bg-black{--bg:#0c0c12} .bg-white{--bg:#ffffff}
  .bg-aqua{--bg:#e6f2f8} .bg-cream{--bg:#fbf4e1} .bg-navy{--bg:#141c3a}
  body.fg-white{--fg:#ffffff} body.fg-navy{--fg:#1d2a5a} body.fg-black{--fg:#1a1a1a} body.fg-hotpink{--fg:#c9325f}
  body.th-galaxy{--accent:#c9b8f2} body.th-flowers{--accent:#e9a3b6} body.th-hearts{--accent:#d9607f}
  body.light.th-galaxy{--accent:#9f86d8}

  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{min-height:100%;background:var(--bg)}
  body{font-family:var(--serif);color:var(--fg);font-size:18px;line-height:1.6;overflow-x:hidden;transition:background .5s,color .5s}
  #fx{position:fixed;inset:0;z-index:0;pointer-events:none}
  main{position:relative;z-index:1;max-width:440px;margin:0 auto;padding:max(34px,env(safe-area-inset-top)) 22px 64px;text-align:center}

  header{position:relative}
  header h1{font-weight:500;font-size:27px;letter-spacing:.14em;display:flex;align-items:center;justify-content:center;gap:12px}
  header h1 svg{width:22px;height:22px;flex:none}
  header h1 svg{fill:var(--accent)}
  #date{font-size:13px;letter-spacing:.2em;text-transform:uppercase;opacity:.6;margin-top:6px}
  .rule{width:46px;height:1px;background:currentColor;opacity:.3;margin:14px auto 0}

  /* the mark */
  #mark{position:relative;height:120px;margin:22px auto 6px;width:120px}
  #mark svg{position:absolute;inset:0;width:100%;height:100%;display:none;overflow:visible}
  body.th-galaxy #mk-galaxy,body.th-flowers #mk-flowers,body.th-hearts #mk-hearts{display:block}
  #mk-galaxy .ring{fill:none;stroke:var(--accent);stroke-width:.6;opacity:.35}
  #mk-galaxy .glow{fill:var(--accent);opacity:.18;animation:glow 2.6s ease-in-out infinite}
  #mk-galaxy .core{fill:#fff;animation:glow 2.6s ease-in-out infinite}
  body.light #mk-galaxy .core{fill:var(--accent)}
  @keyframes glow{0%,100%{transform:scale(1);opacity:.75}50%{transform:scale(1.12);opacity:1}}
  #mk-galaxy .glow,#mk-galaxy .core{transform-box:fill-box;transform-origin:center}
  #mk-flowers{animation:turn 28s linear infinite}
  @keyframes turn{to{transform:rotate(360deg)}}
  #mk-flowers .p{fill:#f6c3d0;stroke:#f1a9bd;stroke-width:.8}
  #mk-flowers .p2{fill:#fde3ea}
  #mk-flowers .c{fill:#f9e3a1}
  #mk-hearts path{fill:var(--accent);transform-box:fill-box;transform-origin:center;animation:beat 1.6s ease-in-out infinite}
  #mk-hearts.pop path{animation:pop .7s ease-out}
  @keyframes beat{0%,100%{transform:scale(1)}14%{transform:scale(1.08)}28%{transform:scale(1)}42%{transform:scale(1.05)}56%{transform:scale(1)}}
  @keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.28)}60%{transform:scale(.94)}100%{transform:scale(1)}}

  #line{min-height:2.4em;margin:8px 6px 18px;font-style:italic;font-size:20px;line-height:1.45;opacity:0;transition:opacity 1.2s}
  #line.show{opacity:.9}
  main.reading #line{opacity:.08}

  /* envelope */
  #stage{position:relative;height:200px;margin-top:8px}
  #env{position:absolute;left:50%;top:50%;width:272px;height:178px;margin:-89px 0 0 -136px;cursor:pointer;z-index:2;transition:transform .3s}
  #env:active{transform:scale(.985)}
  .back{position:absolute;inset:0;background:var(--paper2);border-radius:10px;box-shadow:0 20px 40px rgba(0,0,0,.18)}
  .paper{position:absolute;left:18px;right:18px;top:12px;bottom:10px;background:#fff;border-radius:4px;z-index:1;transition:transform .8s cubic-bezier(.2,.8,.2,1);box-shadow:0 2px 8px rgba(0,0,0,.08);padding:14px 18px;text-align:left;color:var(--ink);font-size:15px;line-height:1.5;overflow:hidden}
  .paper .pv{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;opacity:.8}
  .front{position:absolute;inset:0;z-index:2;border-radius:10px;background:var(--paper);clip-path:polygon(0 0,50% 52%,100% 0,100% 100%,0 100%)}
  .front .to{position:absolute;left:0;right:0;bottom:30px;font-style:italic;color:var(--ink);font-size:19px;letter-spacing:.04em;opacity:.8}
  .front .tiny{position:absolute;right:18px;bottom:12px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink);opacity:.5}
  .flap{position:absolute;left:0;right:0;top:0;height:52%;z-index:3;background:var(--paper2);border-radius:10px 10px 0 0;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .7s ease,z-index 0s .7s}
  .flap span{position:absolute;left:50%;top:20%;transform:translateX(-50%);font-style:italic;font-size:13px;letter-spacing:.2em;color:var(--accent);white-space:nowrap}
  .seal{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);width:40px;height:40px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;z-index:4;box-shadow:0 3px 10px rgba(0,0,0,.18);transition:transform .4s,opacity .4s}
  .seal svg{width:20px;height:20px;display:none}
  .seal svg{fill:#fff}
  body.th-galaxy .seal .s-galaxy,body.th-flowers .seal .s-flowers,body.th-hearts .seal .s-hearts{display:block}
  #env.open .flap{transform:rotateX(180deg);z-index:0}
  #env.open .seal{transform:translate(-50%,-50%) scale(0);opacity:0}
  #env.open .paper{transform:translateY(-76px)}
  #env.empty .paper{opacity:.45}
  #hint{font-size:15px;opacity:.7;min-height:1.6em;margin-top:14px;letter-spacing:.03em}

  /* reader */
  #reader{display:none;margin:16px auto 0;background:#fff;color:var(--ink);border-radius:8px;padding:26px 24px 20px;text-align:left;box-shadow:0 18px 40px rgba(0,0,0,.14);position:relative}
  #reader.show{display:block;animation:rise .5s ease}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  #reader .corner{position:absolute;right:18px;top:16px;width:14px;height:14px}
  #reader .corner{fill:var(--accent)}
  #rTo{font-style:italic;font-size:20px;opacity:.85}
  #rDate{font-size:11px;letter-spacing:.2em;text-transform:uppercase;opacity:.5;margin:4px 0 16px}
  #rText{white-space:pre-wrap;font-size:19px;line-height:1.75}
  #rText img.pic{display:block;max-width:100%;border-radius:4px;margin:0 0 12px}
  #rFrom{margin-top:18px;text-align:right;font-style:italic;font-size:19px;opacity:.85}
  .row{display:flex;gap:8px;margin-top:18px}
  .row button{flex:1;font-family:var(--serif);font-size:14px;letter-spacing:.1em;padding:11px;border-radius:6px;border:1px solid rgba(0,0,0,.14);background:transparent;color:var(--ink);cursor:pointer}
  #copyBox{display:none;width:100%;margin-top:10px;min-height:120px;padding:12px;border-radius:6px;border:1px solid rgba(0,0,0,.14);font-family:var(--serif);font-size:15px;color:var(--ink);background:#fff}

  /* shelf */
  #shelfWrap{margin-top:48px;text-align:left}
  #shelfWrap h2{font-weight:400;font-size:12px;letter-spacing:.24em;text-transform:uppercase;opacity:.6;text-align:center}
  #shelf{margin-top:14px}
  .it{display:flex;align-items:flex-start;gap:14px;width:100%;border:0;background:transparent;cursor:pointer;color:var(--fg);text-align:left;padding:12px 4px;border-bottom:1px solid currentColor;border-image:linear-gradient(to right,transparent,rgba(128,128,128,.35),transparent) 1;font-family:var(--serif)}
  .it svg{width:18px;height:18px;flex:none;margin-top:5px}
  .it svg{fill:var(--accent)}
  .it .d{font-size:11px;letter-spacing:.2em;text-transform:uppercase;opacity:.55}
  .it .t{font-size:16px;line-height:1.45;opacity:.85;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-style:italic}
  .it.cur .d{opacity:1;color:var(--accent)}
  #onlyOne{font-size:14px;opacity:.6;margin-top:12px;text-align:center}

  /* settings */
  #gear{position:fixed;right:max(16px,env(safe-area-inset-right));top:max(16px,env(safe-area-inset-top));z-index:5;width:38px;height:38px;border-radius:50%;border:1px solid rgba(128,128,128,.3);background:transparent;color:var(--fg);cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:.7}
  #gear svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.4;stroke-linecap:round}
  #sheet{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#fff;color:#2a2a33;border-radius:16px 16px 0 0;padding:20px 22px max(26px,env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.2);transform:translateY(105%);transition:transform .35s ease;font-family:var(--serif)}
  #sheet.show{transform:none}
  #sheet h3{font-weight:500;font-size:20px;letter-spacing:.08em;font-style:italic}
  #sheet .lbl{font-size:11px;letter-spacing:.22em;text-transform:uppercase;opacity:.55;margin:16px 0 8px}
  .sw{display:flex;gap:10px;flex-wrap:wrap}
  .sw button{width:36px;height:36px;border-radius:50%;border:1px solid rgba(0,0,0,.15);cursor:pointer;background:#ccc;transition:transform .15s}
  .sw button.on{box-shadow:0 0 0 2px #fff,0 0 0 3.5px #2a2a33;transform:scale(1.08)}
  .sw.an button{width:auto;height:auto;border-radius:20px;padding:7px 16px;background:#f3f3f6;font-family:var(--serif);font-size:16px;letter-spacing:.06em}
  .sw.an button.on{background:#2a2a33;color:#fff;box-shadow:none;transform:none}
  #dim{position:fixed;inset:0;z-index:5;background:rgba(0,0,0,.18);display:none}
  #dim.show{display:block}
  @media (prefers-reduced-motion: reduce){#mk-galaxy .glow,#mk-galaxy .core,#mk-flowers,#mk-hearts path{animation:none}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<button id="gear" aria-label="settings"><svg viewBox="0 0 16 16"><path d="M2 4h12M2 8h12M2 12h12"/><circle cx="5" cy="4" r="1.5" fill="currentColor" stroke="none"/><circle cx="11" cy="8" r="1.5" fill="currentColor" stroke="none"/><circle cx="7" cy="12" r="1.5" fill="currentColor" stroke="none"/></svg></button>
<div id="dim"></div>
<div id="sheet">
  <h3 id="sTitle"></h3>
  <div class="lbl" id="sBg"></div><div class="sw bg" id="swBg"></div>
  <div class="lbl" id="sFg"></div><div class="sw fg" id="swFg"></div>
  <div class="lbl" id="sAn"></div><div class="sw an" id="swAn"></div>
</div>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <path id="i-heart" d="M10 18.2C4.6 14.2 1.5 10.8 1.5 7.4 1.5 4.9 3.4 3 5.7 3c1.6 0 3.1.9 4.3 2.5C11.2 3.9 12.7 3 14.3 3c2.3 0 4.2 1.9 4.2 4.4 0 3.4-3.1 6.8-8.5 10.8z"/>
    <path id="i-star" d="M10 1.5l1.6 5.3 5.4.2-4.3 3.3 1.5 5.3L10 12.5l-4.2 3.1 1.5-5.3L3 7l5.4-.2z"/>
    <g id="i-flower"><ellipse cx="10" cy="4.6" rx="2.6" ry="3.6"/><ellipse cx="10" cy="4.6" rx="2.6" ry="3.6" transform="rotate(72 10 10)"/><ellipse cx="10" cy="4.6" rx="2.6" ry="3.6" transform="rotate(144 10 10)"/><ellipse cx="10" cy="4.6" rx="2.6" ry="3.6" transform="rotate(216 10 10)"/><ellipse cx="10" cy="4.6" rx="2.6" ry="3.6" transform="rotate(288 10 10)"/><circle cx="10" cy="10" r="2.2" opacity=".7"/></g>
  </defs>
</svg>

<main>
  <header>
    <h1><span id="n1"></span><svg viewBox="0 0 20 20"><use href="#i-heart"/></svg><span id="n2"></span></h1>
    <p id="date"></p>
    <div class="rule"></div>
  </header>

  <div id="mark">
    <svg id="mk-galaxy" viewBox="0 0 120 120">
      <circle class="ring" cx="60" cy="60" r="56"/><circle class="ring" cx="60" cy="60" r="42"/><circle class="ring" cx="60" cy="60" r="28"/>
      <circle class="glow" cx="60" cy="60" r="22"/>
      <g transform="translate(48 48) scale(1.2)"><path class="core" d="M10 1.5l1.6 5.3 5.4.2-4.3 3.3 1.5 5.3L10 12.5l-4.2 3.1 1.5-5.3L3 7l5.4-.2z"/></g>
    </svg>
    <svg id="mk-flowers" viewBox="0 0 120 120">
      <g class="p"><ellipse cx="60" cy="26" rx="15" ry="26"/><ellipse cx="60" cy="26" rx="15" ry="26" transform="rotate(72 60 60)"/><ellipse cx="60" cy="26" rx="15" ry="26" transform="rotate(144 60 60)"/><ellipse cx="60" cy="26" rx="15" ry="26" transform="rotate(216 60 60)"/><ellipse cx="60" cy="26" rx="15" ry="26" transform="rotate(288 60 60)"/></g>
      <g class="p2"><ellipse cx="60" cy="36" rx="7" ry="14"/><ellipse cx="60" cy="36" rx="7" ry="14" transform="rotate(72 60 60)"/><ellipse cx="60" cy="36" rx="7" ry="14" transform="rotate(144 60 60)"/><ellipse cx="60" cy="36" rx="7" ry="14" transform="rotate(216 60 60)"/><ellipse cx="60" cy="36" rx="7" ry="14" transform="rotate(288 60 60)"/></g>
      <circle class="c" cx="60" cy="60" r="11"/>
    </svg>
    <svg id="mk-hearts" viewBox="0 0 120 120"><g transform="translate(10 12) scale(5)"><path d="M10 18.2C4.6 14.2 1.5 10.8 1.5 7.4 1.5 4.9 3.4 3 5.7 3c1.6 0 3.1.9 4.3 2.5C11.2 3.9 12.7 3 14.3 3c2.3 0 4.2 1.9 4.2 4.4 0 3.4-3.1 6.8-8.5 10.8z"/></g></svg>
  </div>

  <div id="line"></div>

  <div id="stage">
    <div id="env">
      <div class="back"></div>
      <div class="paper"><div class="pv" id="pv"></div></div>
      <div class="front"><div class="to" id="envTo"></div><div class="tiny" id="envFrom"></div></div>
      <div class="flap"><span id="flapText"></span></div>
      <div class="seal">
        <svg class="s-galaxy" viewBox="0 0 20 20"><use href="#i-star"/></svg>
        <svg class="s-flowers" viewBox="0 0 20 20"><use href="#i-flower"/></svg>
        <svg class="s-hearts" viewBox="0 0 20 20"><use href="#i-heart"/></svg>
      </div>
    </div>
  </div>
  <div id="hint"></div>

  <section id="reader">
    <svg class="corner" viewBox="0 0 20 20"><use href="#i-heart"/></svg>
    <div id="rTo"></div>
    <div id="rDate"></div>
    <div id="rText"></div>
    <div id="rFrom"></div>
    <div class="row"><button id="copyBtn"></button><button id="foldBtn"></button></div>
    <textarea id="copyBox" readonly></textarea>
  </section>

  <section id="shelfWrap">
    <h2 id="shelfTitle"></h2>
    <div id="shelf"></div>
    <div id="onlyOne" style="display:none"></div>
  </section>
</main>

<script>
(async()=>{
const C=CONFIG,T=C.text,$=id=>document.getElementById(id);
const KEY='loveletters-look';
const BGS=[['pink','#fbe7ee'],['black','#0c0c12'],['white','#ffffff'],['aqua','#e6f2f8'],['cream','#fbf4e1'],['navy','#141c3a']];
const FGS=[['white','#ffffff'],['navy','#1d2a5a'],['black','#1a1a1a'],['hotpink','#c9325f']];
const THS=['galaxy','flowers','hearts'];
const ICON={galaxy:'#i-star',flowers:'#i-flower',hearts:'#i-heart'};

/* look: saved on this phone, defaults from CONFIG */
let look=Object.assign({},C.defaults);
try{Object.assign(look,JSON.parse(localStorage.getItem(KEY)||'{}'));}catch(e){}
if(!THS.includes(look.theme))look.theme=C.defaults.theme;
const isLight=()=>!['black','navy'].includes(look.background);
function applyLook(){
  document.body.className=document.documentElement.className='bg-'+look.background+' fg-'+look.text+' th-'+look.theme+(isLight()?' light':'');
  try{localStorage.setItem(KEY,JSON.stringify(look));}catch(e){}
  document.querySelectorAll('#swBg button').forEach(b=>b.classList.toggle('on',b.dataset.v===look.background));
  document.querySelectorAll('#swFg button').forEach(b=>b.classList.toggle('on',b.dataset.v===look.text));
  document.querySelectorAll('#swAn button').forEach(b=>b.classList.toggle('on',b.dataset.v===look.theme));
  renderShelf(); pickLine(); resetFx();
}
function swatches(el,list,key){for(const [v,hex] of list){const b=document.createElement('button');b.dataset.v=v;b.style.background=hex;b.title=v;b.addEventListener('click',()=>{look[key]=v;applyLook();});el.appendChild(b);}}
swatches($('swBg'),BGS,'background'); swatches($('swFg'),FGS,'text');
for(const v of THS){const b=document.createElement('button');b.dataset.v=v;b.textContent=T[v];b.addEventListener('click',()=>{look.theme=v;applyLook();});$('swAn').appendChild(b);}
$('sTitle').textContent=T.settings;$('sBg').textContent=T.background;$('sFg').textContent=T.textColor;$('sAn').textContent=T.theme;
$('gear').addEventListener('click',()=>{$('sheet').classList.toggle('show');$('dim').classList.toggle('show');});
$('dim').addEventListener('click',()=>{$('sheet').classList.remove('show');$('dim').classList.remove('show');});

/* words */
document.title=C.partnerName+' & '+C.yourName;
$('n1').textContent=C.partnerName;$('n2').textContent=C.yourName;
$('flapText').textContent=T.flap;$('envTo').textContent=T.to+' '+C.partnerName;$('envFrom').textContent=T.from+' '+C.yourName;
$('hint').textContent=T.loading;$('shelfTitle').textContent=T.shelf;$('onlyOne').textContent=T.onlyOne;
$('copyBtn').textContent=T.copy;$('foldBtn').textContent=T.fold;$('rTo').textContent=T.to+' '+C.partnerName+',';
function pickLine(){const L=C.lines[look.theme]||[];const el=$('line');el.classList.remove('show');setTimeout(()=>{el.textContent=L[Math.floor(Math.random()*L.length)]||'';el.classList.add('show');},80);}

/* dates */
function todayKey(){const p=new Intl.DateTimeFormat('en-CA',{timeZone:C.timezone,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const g=t=>p.find(x=>x.type===t).value;return g('year')+'-'+g('month')+'-'+g('day');}
function niceDate(key,opt){const [y,m,d]=key.split('-').map(Number);return new Intl.DateTimeFormat(C.dateLocale,opt||{weekday:'long',month:'long',day:'numeric'}).format(new Date(Date.UTC(y,m-1,d,12)));}
function stamp(it){return (it.label||niceDate(it.date,{weekday:'short',year:'numeric',month:'long',day:'numeric'}))+(it.time?'  '+it.time:'');}

/* letters: one file per day in ./letters/, listed in index.json */
async function loadAll(){
  const idx=await fetch('./letters/index.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('index '+r.status);return r.json();});
  const dates=(idx.letters||[]).slice().sort();const items=[];
  for(const d of dates){try{const it=await fetch('./letters/'+d+'.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(d);return r.json();});if(it&&(it.text||it.image))items.push(it);}catch(e){console.error(e);}}
  return items;
}

/* reader */
let items=[],current=null,shown=null;const env=$('env'),reader=$('reader');
function show(it){
  shown=it;$('rDate').textContent=stamp(it);const t=$('rText');t.textContent='';
  if(it.image){const im=document.createElement('img');im.className='pic';im.src=it.image;im.alt='';t.appendChild(im);}
  if(it.text)t.appendChild(document.createTextNode(it.text));
  $('rFrom').textContent=(it.from||C.yourName);
  $('copyBox').style.display='none';$('copyBtn').textContent=T.copy;
  reader.classList.add('show');env.classList.add('open');document.querySelector('main').classList.add('reading');renderShelf();
}
function fold(){reader.classList.remove('show');env.classList.remove('open');document.querySelector('main').classList.remove('reading');shown=null;renderShelf();}
env.addEventListener('click',()=>{if(!current)return;if(env.classList.contains('open')&&shown){fold();}else{show(current);const r=env.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height*.45,12);}});
$('foldBtn').addEventListener('click',()=>{fold();window.scrollTo({top:0,behavior:'smooth'});});
$('copyBtn').addEventListener('click',async()=>{
  if(!shown)return;const t=stamp(shown)+'\n\n'+(shown.text||'')+'\n\n'+(shown.from||C.yourName);const box=$('copyBox');box.value=t;box.style.display='block';
  let ok=false;try{await navigator.clipboard.writeText(t);ok=true;}catch(e){}
  if(!ok){try{box.focus();box.select();box.setSelectionRange(0,t.length);document.execCommand('copy');ok=true;}catch(e){}}
  $('copyBtn').textContent=ok?T.copied:T.copyManual;
});

/* shelf: one row per letter */
function renderShelf(){
  const sh=$('shelf');sh.innerHTML='';
  $('onlyOne').style.display=items.length<=1?'block':'none';
  for(const it of items.slice().reverse()){
    const b=document.createElement('button');b.className='it'+(shown&&shown.date===it.date?' cur':'');
    b.innerHTML='<svg viewBox="0 0 20 20"><use href="'+ICON[look.theme]+'"/></svg><div><div class="d"></div><div class="t"></div></div>';
    b.querySelector('.d').textContent=stamp(it);b.querySelector('.t').textContent=(it.text||'').split('\n')[0];
    b.addEventListener('click',()=>{show(it);reader.scrollIntoView({behavior:'smooth',block:'start'});});
    sh.appendChild(b);
  }
}

/* particles */
const cv=$('fx'),cx=cv.getContext('2d');let P=[],W=0,H=0,field=[];
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;const dp=()=>devicePixelRatio||1;
function size(){W=cv.width=innerWidth*dp();H=cv.height=innerHeight*dp();cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';}
addEventListener('resize',()=>{size();resetFx();});size();
function star5(x,y,r,rot){cx.beginPath();for(let i=0;i<10;i++){const a=rot+i*Math.PI/5-Math.PI/2,rr=i%2?r*.45:r;i?cx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr):cx.moveTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}cx.closePath();}
function heart(x,y,r){cx.beginPath();cx.moveTo(x,y+r*.9);cx.bezierCurveTo(x-r*1.5,y-r*.2,x-r*.5,y-r*1.1,x,y-r*.35);cx.bezierCurveTo(x+r*.5,y-r*1.1,x+r*1.5,y-r*.2,x,y+r*.9);cx.closePath();}
function petal(x,y,r,a){cx.save();cx.translate(x,y);cx.rotate(a);cx.beginPath();cx.moveTo(0,-r);cx.bezierCurveTo(r*.7,-r*.6,r*.7,r*.6,0,r);cx.bezierCurveTo(-r*.7,r*.6,-r*.7,-r*.6,0,-r);cx.closePath();cx.restore();}
function resetFx(){
  P=[];field=[];const n=reduce?14:(look.theme==='galaxy'?46:look.theme==='flowers'?10:0);
  for(let i=0;i<n;i++){
    if(look.theme==='galaxy')field.push({x:Math.random()*W,y:Math.random()*H,r:(1.4+Math.random()*2.6)*dp(),ph:Math.random()*6.28,v:(.08+Math.random()*.18)*dp(),sp:.6+Math.random()*1.4,rot:Math.random()*6.28});
    else field.push({x:Math.random()*W,y:Math.random()*H*.42,r:(5+Math.random()*7)*dp(),ph:Math.random()*6.28,hue:Math.random()});
  }
}
const PET=['#f6c3d0','#fde3ea','#f9e3a1','#e4d4f5','#cfe9e0'];
function spawn(kind,x,y,v){
  const d=dp();
  if(kind==='galaxy')P.push({k:'star',x,y,vx:(Math.random()-.5)*.5*d*v,vy:(Math.random()-.5)*.5*d*v,life:1,r:(1.5+Math.random()*2.2)*d,rot:Math.random()*6.28});
  else if(kind==='flowers')P.push({k:'petal',x,y,vx:(Math.random()-.5)*.35*d,vy:(.25+Math.random()*.45)*d*(v>1?-.6:1),life:1,r:(4+Math.random()*4)*d,a:Math.random()*6.28,da:(Math.random()-.5)*.03,sw:Math.random()*6.28,c:PET[Math.floor(Math.random()*PET.length)]});
  else P.push({k:'heart',x,y,vx:(Math.random()-.5)*.5*d*v,vy:(-.35-Math.random()*.5)*d*v,life:1,r:(3.5+Math.random()*5)*d,sw:Math.random()*6.28,c:['#ffffff','#f6c3d0','#f1a9bd','#e4d4f5','#fde3ea'][Math.floor(Math.random()*5)]});
}
function burst(x,y,n){const d=dp();for(let i=0;i<n;i++)spawn(look.theme,x*d,y*d,2.4);}
const goldDark='255,233,168',goldLight='186,150,80';
function loop(ts){
  cx.clearRect(0,0,W,H);const d=dp(),th=look.theme,el=ts/1000,light=isLight();
  if(th==='galaxy'){
    for(const s of field){s.y+=s.v;if(s.y>H+10*d){s.y=-10*d;s.x=Math.random()*W;}const a=(0.35+0.65*Math.abs(Math.sin(el*s.sp+s.ph)))*(light?.55:.95);cx.fillStyle='rgba('+(light?goldLight:goldDark)+','+a+')';star5(s.x+Math.sin(el*.6+s.ph)*3*d,s.y,s.r,s.rot+el*.15);cx.fill();}
  }else if(th==='flowers'){
    for(const f of field){const y=f.y+Math.sin(el*.7+f.ph)*4*d,x=f.x+Math.cos(el*.5+f.ph)*3*d;cx.globalAlpha=light?.8:.7;cx.fillStyle=PET[Math.floor(f.hue*PET.length)];for(let i=0;i<5;i++)petal(x+Math.cos(i*1.2566+el*.1)*f.r*.75,y+Math.sin(i*1.2566+el*.1)*f.r*.75,f.r*.55,i*1.2566+el*.1);cx.fill();cx.fillStyle='#f9e3a1';cx.beginPath();cx.arc(x,y,f.r*.3,0,7);cx.fill();cx.globalAlpha=1;}
    if(!reduce&&Math.random()<.08)spawn('flowers',Math.random()*W,-10*d,1);
  }else{ if(!reduce&&Math.random()<.07)spawn('hearts',Math.random()*W,H+10*d,1.3); }
  const keep=[];
  for(const p of P){
    p.x+=p.vx;p.y+=p.vy;
    if(p.k==='star'){p.life-=.014;cx.fillStyle='rgba('+(light?goldLight:goldDark)+','+Math.max(0,p.life)+')';star5(p.x,p.y,p.r,p.rot+el);cx.fill();}
    else if(p.k==='petal'){p.sw+=.02;p.x+=Math.sin(p.sw)*.5*d;p.a+=p.da;if(p.y>H*.9)p.life-=.02;cx.globalAlpha=Math.max(0,p.life)*.9;cx.fillStyle=p.c;petal(p.x,p.y,p.r,p.a);cx.fill();}
    else{p.sw+=.03;p.x+=Math.sin(p.sw)*.4*d;p.life-=.0012;if(p.y<H*.18)p.life-=.012;cx.globalAlpha=Math.max(0,Math.min(1,p.life*1.5))*(light?.85:.7);cx.fillStyle=p.c;heart(p.x,p.y,p.r);cx.fill();}
    cx.globalAlpha=1;
    if(p.life>0&&p.y>-40*d&&p.y<H+40*d)keep.push(p);
  }
  P=keep.length>240?keep.slice(-240):keep;
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
/* the heart in the mark pops now and then */
setInterval(()=>{if(look.theme!=='hearts'||reduce)return;const m=$('mk-hearts');m.classList.remove('pop');void m.offsetWidth;m.classList.add('pop');const r=m.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,9);},4200);
document.addEventListener('pointerdown',e=>{if(e.target.closest('#sheet,#gear,button,#reader'))return;burst(e.clientX,e.clientY,8);},{passive:true});

/* start */
applyLook();
const key=todayKey();$('date').textContent=niceDate(key);
try{
  items=await loadAll();
  current=items.find(i=>i.date===key)||items[items.length-1]||null;
  if(current){$('pv').textContent=current.text||'';$('hint').textContent=current.date===key?T.todayHere+' '+T.tapToOpen:T.latestOnly;}
  else{env.classList.add('empty');$('hint').textContent=T.none;}
  renderShelf();
}catch(e){console.error(e);$('hint').textContent=T.failed;env.addEventListener('click',()=>location.reload(),{once:true});}
})();
</script>
</body>
</html>
