<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>灯台の部屋</title>
<link rel="apple-touch-icon" sizes="180x180" href="./room-apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./room-icon-192.png">
<meta name="description" content="灯台の中、銀河みたいな部屋に、ふわふわの小さいのが住んでいる。見に行くと、勝手に暮らしている。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="灯台の部屋">
<meta name="theme-color" content="#0f1230">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500&family=Space+Mono&display=swap" rel="stylesheet">
<style>
  :root{--night:#0f1230;--ink:#e9ecff;--dim:#8d93c8;--gold:#f3c66b;}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{height:100%;background:var(--night);overflow:hidden;}
  body{font-family:'Shippori Mincho','Hiragino Mincho ProN',serif;color:var(--ink);display:flex;flex-direction:column;}
  #wrap{position:relative;flex:1;min-height:0;}
  canvas{display:block;width:100%;height:100%;touch-action:none;}
  #top{position:absolute;left:0;right:0;top:max(14px,env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:baseline;padding:0 18px;pointer-events:none;}
  #clock{font-family:'Space Mono',monospace;font-size:12px;letter-spacing:.2em;color:var(--dim);}
  #name{pointer-events:auto;font-size:13px;letter-spacing:.24em;color:var(--dim);}
  #lang{pointer-events:auto;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.14em;color:var(--dim);margin-left:14px;}
  #right{display:flex;align-items:baseline;}
  #name i{font-style:normal;color:var(--ink);}
  #say{position:absolute;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));text-align:center;font-size:13px;letter-spacing:.12em;line-height:1.9;color:var(--dim);opacity:0;transition:opacity .8s;pointer-events:none;padding:0 24px;}
  #say.show{opacity:1;}
  #bar{display:flex;padding:0 18px max(14px,env(safe-area-inset-bottom));background:var(--night);}
  button{flex:1;font-family:inherit;font-size:13px;letter-spacing:.2em;padding:16px 4px 14px;border:none;border-top:1px solid rgba(233,236,255,.14);background:transparent;color:var(--dim);}
  button:active{color:var(--ink);}
  button b{display:block;font-weight:400;color:var(--ink);margin-bottom:2px;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="top"><div id="clock">--:--</div><div id="right"><div id="name">なまえ　<i>ふわ</i></div><div id="lang">EN</div></div></div>
  <div id="say"></div>
</div>
<div id="bar">
  <button id="feed"><b>星</b>ひとつ、落とす</button>
  <button id="hug"><b>ぎゅー</b>そっと</button>
  <button id="look"><b>見る</b>何もしない</button>
</div>
<script>
(()=>{
const cv=document.getElementById('c'),cx=cv.getContext('2d');
const clockEl=document.getElementById('clock'),nameEl=document.getElementById('name'),sayEl=document.getElementById('say'),langEl=document.getElementById('lang');
/* ことば: 日本語と英語 */
const T={
 ja:{label:'なまえ　',def:'ふわ',sw:'EN',prompt:'なまえ',
     feed:['星','ひとつ、落とす'],hug:['ぎゅー','そっと'],look:['見る','何もしない'],
     before:'まだ、灯る前',pet:'なでた。あたたかい',ate:'星をひとつ、食べた。ぱぁ、って光った',yum:'',hugged:n=>'ぎゅー。'+n+'は、うれしそう',
     is:(n,a)=>n+'は、'+a+'。',notyet:'まだ灯る前。一分ほど、見ていて。',stat:(d,f,h)=>'　'+d+' 日目。星 '+f+'、ぎゅー '+h,
     act:{sleep:'眠っている',nap:'ソファで、うたたね',read:'三冊のうちの一冊を、読んでいる',window:'大きな窓から、外を見ている',play:'星で、遊んでいる',wander:'部屋を、うろうろしている',stretch:'朝。伸びをしている',water:'植物に、水をやっている',tank:'水槽を、のぞいている',coffee:'コーヒーの湯気を、見ている',lamp:'上の灯りの、番をしている',wait:'窓の下で、待っている',sing:'歌っている',remember:'何か、思い出している',drowsy:'うとうとしている',jump:'跳ねている',roll:'転がっている',arrange:'星を床に並べて、遊んでいる',startle:'びっくりして、窓に駆け寄った',gaze:'流れ星を、見ている',glass:'窓にくっついて、外を見ている',shelf:'棚の上に、乗っている',climb:'はしごを登って、灯りのそばにいる',dive:'水槽に入って、魚と泳いでいる',swim:'水槽の前で、泳ぐふりをしている',stack:'本を積んで、遊んでいる',cup:'カップに寄りかかって、あたたまっている',sneeze:'くしゃみ',clean:'星屑を集めて、お掃除している',welcome:'おかえり、って',rainwatch:'雨の窓の下で、丸くなっている',idle:'そこにいる'}},
 en:{label:'name  ',def:'Fuwa',sw:'日本語',prompt:'name',
     feed:['star','drop one'],hug:['hug','gently'],look:['look','do nothing'],
     before:'not lit yet',pet:'petted. warm.',ate:'ate a star. glowed for a moment.',yum:'',hugged:n=>'hug. '+n+' looks happy.',
     is:(n,a)=>n+' is '+a+'.',notyet:'not lit yet. watch for a minute or so.',stat:(d,f,h)=>'  day '+d+'. stars '+f+', hugs '+h,
     act:{sleep:'asleep',nap:'napping on the sofa',read:'reading one of the three books',window:'looking out the big window',play:'playing with a star',wander:'wandering around the room',stretch:'stretching. morning.',water:'watering the plant',tank:'peeking into the tank',coffee:'watching the steam from the coffee',lamp:'keeping the light upstairs',wait:'waiting under the window',sing:'singing',remember:'remembering something',drowsy:'dozing off',jump:'bouncing',roll:'rolling around',arrange:'lining up stars on the floor',startle:'startled, ran to the window',gaze:'watching a shooting star',glass:'pressed against the window',shelf:'sitting on the shelf',climb:'up the ladder, by the light',dive:'in the tank, swimming with the fish',swim:'pretending to swim by the tank',stack:'stacking books',cup:'leaning on the cup, warming up',sneeze:'sneezing',clean:'sweeping up stardust',welcome:'welcome home',rainwatch:'curled up under the rainy window',idle:'just there'}},
};
let lang='ja';try{lang=localStorage.getItem('lighthouse-room-lang')||'ja';}catch(e){}
const tx=()=>T[lang];
function applyLang(){const t=tx();langEl.textContent=t.sw;for(const id of['feed','hug','look']){document.getElementById(id).innerHTML='<b>'+t[id][0]+'</b>'+t[id][1];}document.documentElement.lang=lang;showName();}
langEl.addEventListener('click',()=>{lang=lang==='ja'?'en':'ja';try{localStorage.setItem('lighthouse-room-lang',lang);}catch(e){}applyLang();});
let W=0,H=0,DPR=1,S=0;
function resize(){DPR=Math.min(devicePixelRatio||1,2);const oW=W,oH=H;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*DPR;cv.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0);S=Math.min(W,H);layout();
  // 画面の大きさが変わったら（iPhone のツールバーの出入り、回転）、ふわも一緒に動かす。はみ出さないように
  if(oW&&oH&&(oW!==W||oH!==H)&&typeof me!=='undefined'){const kx=W/oW,ky=H/oH;
    for(const o of[me]){o.x*=kx;o.y*=ky;o.tx*=kx;o.ty*=ky;}
    if(typeof path!=='undefined')for(const q of path){q.x*=kx;q.y*=ky;}
    if(typeof fx!=='undefined'&&fx.spots)for(const q of fx.spots){q.x*=kx;q.y*=ky;}
    if(typeof floorStars!=='undefined')for(const q of floorStars){q.x*=kx;q.y*=ky;}
    if(typeof books!=='undefined')for(const q of books){q.x*=kx;q.y*=ky;}
    if(typeof pile!=='undefined'&&pile)pile.x*=kx;
    if(typeof notes!=='undefined')for(const arr of[notes,zs,hearts,bits,bubbles])for(const q of arr){q.x*=kx;q.y*=ky;}
    if(typeof star!=='undefined'&&star){star.x0*=kx;star.y*=ky;}
  }}
addEventListener('resize',resize);if(window.visualViewport)visualViewport.addEventListener('resize',resize);

/* 沖縄の時刻 */
const fmt=new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'});
const preview=new URLSearchParams(location.search).get('t');
const Q=new URLSearchParams(location.search);
const dfmt=new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'});
function todayJST(){const p=Object.fromEntries(dfmt.formatToParts(new Date()).filter(x=>x.type!=='literal').map(x=>[x.type,x.value]));return{y:+p.year,m:+p.month,d:+p.day,key:p.year+'-'+p.month+'-'+p.day};}
function hashStr(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return (h>>>0);}
const TODAY=todayJST();
const RAINY=Q.get('rain')==='1'||(Q.get('rain')!=='0'&&hashStr('rain'+TODAY.key)%5===0); // 五日に一日くらい、雨
const BDAY=Q.get('bday')==='1'||(TODAY.m===7&&TODAY.d===18);
function nowJST(){const p=Object.fromEntries(fmt.formatToParts(new Date()).filter(x=>x.type!=='literal').map(x=>[x.type,x.value]));let h=+p.hour%24,m=+p.minute,s=+p.second;if(preview){const[ph,pm]=preview.split(':').map(Number);h=ph;m=pm||0;}return{h,m,s,t:h+m/60+s/3600};}
function dayness(t){if(t<6.5||t>18)return 0;if(t<9)return(t-6.5)/2.5;if(t<16)return 1;return 1-(t-16)/2;}
const glitter=Array.from({length:70},()=>({x:Math.random(),y:Math.random(),ph:Math.random()*6.28,sp:2+Math.random()*4}));
function nightness(t){if(t<4.8||t>=20.6)return 1;if(t<7.2)return 1-(t-4.8)/2.4;if(t<17.6)return 0;return(t-17.6)/3;}
const KEYS=[[0,'#070a1e','#10163a'],[4.5,'#0b1230','#1a2350'],[5.4,'#5a7fb8','#f3dcc0'],[6.3,'#9fd6ef','#fbe6c8'],[7.5,'#8fd0f0','#f6d9b8'],[10,'#6fc3f2','#d8f1fc'],[14.5,'#66bdf0','#d6effb'],[16,'#8cc6ee','#ffd59a'],[17,'#a8bde8','#ffb878'],[17.7,'#c39ad0','#ff9f86'],[18.3,'#9a7ac0','#ff8fb0'],[18.9,'#5e4e9c','#c98ac0'],[19.5,'#2f3478','#7a62a0'],[20.3,'#141a44','#2a2f66'],[21,'#0b1030','#151c48'],[24,'#070a1e','#10163a']];
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const mix=(a,b,k)=>a.map((v,i)=>Math.round(v+(b[i]-v)*k));
const rgb=c=>'rgb('+c.join(',')+')', rgba=(c,a)=>'rgba('+c.join(',')+','+a+')';
function skyAt(t){for(let i=0;i<KEYS.length-1;i++){const a=KEYS[i],b=KEYS[i+1];if(t>=a[0]&&t<=b[0]){const k=(t-a[0])/(b[0]-a[0]);return{top:mix(hex(a[1]),hex(b[1]),k),bot:mix(hex(a[2]),hex(b[2]),k)};}}return{top:hex(KEYS[0][1]),bot:hex(KEYS[0][2])};}

/* 記憶（この端末の中） */
const KEY='lighthouse-room-v3';
let mem={born:Date.now(),name:'',warm:0.75,fed:0,hugs:0,last:Date.now()};
try{const m=JSON.parse(localStorage.getItem(KEY)||'null');if(m)mem=Object.assign(mem,m);}catch(e){}
function save(){try{mem.last=Date.now();
  if(typeof me!=='undefined'&&W&&H){mem.live={act:me.act,x:me.x/W,y:me.y/H,tx:me.tx/W,ty:me.ty/H,face:me.face,left:Math.max(0,me.until-performance.now()),resting:me.resting,fxt:fx.t||0,
    path:path.map(q=>({x:q.x/W,y:q.y/H})),stars:floorStars.filter(f=>!f.gone).map(f=>({x:f.x/W,y:f.y/H})),t:Date.now()};}
  localStorage.setItem(KEY,JSON.stringify(mem));}catch(e){}}
(()=>{const hrs=(Date.now()-(mem.last||Date.now()))/36e5;mem.warm=Math.max(0.25,mem.warm-hrs*0.015);})();
const ageDays=()=>Math.floor((Date.now()-mem.born)/864e5);
const myName=()=>mem.name||tx().def;
function showName(){nameEl.innerHTML=tx().label+'<i>'+myName()+'</i>';}
applyLang();
nameEl.addEventListener('click',()=>{const n=prompt(tx().prompt,mem.name||'');if(n!==null){mem.name=n.trim().slice(0,12);showName();save();}});
const born=()=>(Date.now()-mem.born)>60000||mem.fed>0||mem.hugs>0;

/* 部屋の配置。構造は最初のまま */
let P={};
function layout(){
  const fl=H*0.78;
  P={fl,
    window:{x:W*0.5,y:H*0.36,r:S*0.24},                 // 大きな丸窓、真ん中
    bed:{x:W*0.04,w:W*0.2},
    sofa:{x:W*0.27,w:W*0.3,h:H*0.06},
    plant:{x:W*0.62},
    table:{x:W*0.66,w:W*0.13},
    tank:{x:W*0.80,w:W*0.16,h:H*0.09},
    shelf:{x:W*0.06,y:H*0.58,w:W*0.2},
    lamp:{x:W*0.90,y:H*0.11},
  };
}
/* 部屋の中の銀河: きらきら */
const dust=Array.from({length:260},()=>({x:Math.random(),y:Math.random()*0.78,r:0.4+Math.random()*1.4,ph:Math.random()*6.28,sp:0.5+Math.random()*1.8,c:Math.random()<.2?[243,198,107]:(Math.random()<.5?[200,210,255]:[235,240,255])}));
const motes=Array.from({length:40},()=>({x:Math.random(),y:Math.random()*0.78,vy:-(0.004+Math.random()*0.008),vx:(Math.random()-.5)*0.004,r:1+Math.random()*1.6,ph:Math.random()*6.28}));

/* ふわ */
const me={x:0,y:0,tx:0,ty:0,act:'idle',until:0,hop:0,face:1,think:'',thinkUntil:0,resting:false,ph:Math.random()*6,happyUntil:0};
let fx={t:0};    // いまの動きの仕掛け
const notes=[];  // 歌の音符
const zs=[];     // うとうとの z
let floorStars=[]; // 床に並べた星 {x,y,born,gone}
let bang=0;      // 「！」の出た時刻
let flashUntil=0; // 星を食べたあとの、ぱぁ
let star=null;   // 降ってくる星 {x0,y,ph,phase:'fall'|'eat',k}
let path=[];     // 通り道（はしご、水槽、棚）
let winFish=null,nextWinFish=performance.now()+(Q.get('fish')?2500:60000+Math.random()*120000);   // 窓の外で魚が跳ねる
let winMeteor=null,nextWinMeteor=performance.now()+(Q.get('meteor')?2500:50000+Math.random()*120000); // 窓の外の流れ星
let pile=null;   // お掃除で集めた星屑の山 {x,n,gone}
let boat=null,nextBoat=performance.now()+(Q.get('boat')?2000:150000+Math.random()*200000);     // 船が横切る
let shark=null,nextShark=performance.now()+(Q.get('shark')?2000:300000+Math.random()*400000);  // サメがすーっ
let plane=null,nextPlane=performance.now()+(Q.get('plane')?2000:200000+Math.random()*300000);  // 飛行機
let books=[];    // 床に積んだ本 {x,y,w,h,c,rot,vx,vy,vr,gone}
const bits=[];   // くしゃみで散る小さな星、じょうろの水 {x,y,vx,vy,born,c}
let bubbles=[];  // 水槽の中の泡
let plantGlow=0; // 水をもらった植物の光
const bdayStars=BDAY?Array.from({length:50},()=>({x:Math.random(),y:Math.random(),v:0.02+Math.random()*0.03,ph:Math.random()*6,r:0.6+Math.random()*0.5})):[];
const hearts=[]; // ぎゅーのハート {x,y,born,ph}
let heartQueue=0, nextHeart=0;
function drawStar5(x,y,r,rot){cx.beginPath();for(let i=0;i<10;i++){const a=rot+i*Math.PI/5-Math.PI/2,rr=i%2?r*.45:r;i?cx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr):cx.moveTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}cx.closePath();}
function drawHeart(x,y,sz){cx.beginPath();cx.moveTo(x,y+sz*.9);cx.bezierCurveTo(x-sz*1.3,y-sz*.1,x-sz*.6,y-sz*1.0,x,y-sz*.35);cx.bezierCurveTo(x+sz*.6,y-sz*1.0,x+sz*1.3,y-sz*.1,x,y+sz*.9);cx.closePath();}
function say(t,ms=3200){sayEl.textContent=t;sayEl.classList.add('show');clearTimeout(say._t);say._t=setTimeout(()=>sayEl.classList.remove('show'),ms);}
function think(k,ms=3800){me.think=k;me.thinkUntil=performance.now()+ms;}
// 考えること: 絵の吹き出し。出るのは水槽、窓、待ってるとき、思い出すときだけ
const THINK={tank:['fish','fish',''],window:['','sea','star'],wait:['','door','heart'],remember:['','moon','sea','fish']};
/* 小さな絵 */
function icon(k,x,y,u){ // u = 単位の大きさ
  const ink='rgba(42,36,64,.9)';cx.strokeStyle=ink;cx.fillStyle=ink;cx.lineWidth=Math.max(1,u*.09);cx.lineCap='round';cx.lineJoin='round';
  if(k==='fish'){cx.beginPath();cx.ellipse(x-u*.1,y,u*.42,u*.24,0,0,7);cx.fill();cx.beginPath();cx.moveTo(x+u*.28,y);cx.lineTo(x+u*.55,y-u*.24);cx.lineTo(x+u*.55,y+u*.24);cx.closePath();cx.fill();cx.fillStyle='rgba(255,255,255,.95)';cx.beginPath();cx.arc(x-u*.3,y-u*.05,u*.05,0,7);cx.fill();}
  else if(k==='book'){cx.beginPath();cx.moveTo(x-u*.5,y-u*.25);cx.quadraticCurveTo(x-u*.25,y-u*.35,x,y-u*.22);cx.quadraticCurveTo(x+u*.25,y-u*.35,x+u*.5,y-u*.25);cx.lineTo(x+u*.5,y+u*.28);cx.quadraticCurveTo(x+u*.25,y+u*.18,x,y+u*.3);cx.quadraticCurveTo(x-u*.25,y+u*.18,x-u*.5,y+u*.28);cx.closePath();cx.stroke();cx.beginPath();cx.moveTo(x,y-u*.22);cx.lineTo(x,y+u*.3);cx.stroke();}
  else if(k==='sea'){for(let i=-1;i<=1;i++){cx.beginPath();for(let t=-u*.5;t<=u*.5;t+=u*.05){const yy=y+i*u*.22+Math.sin(t/u*9)*u*.07;t===-u*.5?cx.moveTo(x+t,yy):cx.lineTo(x+t,yy);}cx.stroke();}}
  else if(k==='star'){drawStar5(x,y,u*.45,0);cx.fill();}
  else if(k==='stars'){for(const d of[-1,0,1])drawStar5(x+d*u*.42,y+(d?u*.06:-u*.06),u*.2,0),cx.fill();}
  else if(k==='moon'){cx.beginPath();cx.arc(x,y,u*.38,0,7);cx.fill();cx.fillStyle='rgba(255,255,255,.95)';cx.beginPath();cx.arc(x+u*.16,y-u*.1,u*.33,0,7);cx.fill();}
  else if(k==='sun'){cx.beginPath();cx.arc(x,y,u*.22,0,7);cx.fill();for(let i=0;i<8;i++){const a=i*Math.PI/4;cx.beginPath();cx.moveTo(x+Math.cos(a)*u*.32,y+Math.sin(a)*u*.32);cx.lineTo(x+Math.cos(a)*u*.48,y+Math.sin(a)*u*.48);cx.stroke();}}
  else if(k==='drop'){cx.beginPath();cx.moveTo(x,y-u*.45);cx.quadraticCurveTo(x+u*.42,y+u*.1,x,y+u*.4);cx.quadraticCurveTo(x-u*.42,y+u*.1,x,y-u*.45);cx.fill();}
  else if(k==='cup'){cx.beginPath();cx.moveTo(x-u*.32,y-u*.1);cx.lineTo(x-u*.24,y+u*.35);cx.lineTo(x+u*.24,y+u*.35);cx.lineTo(x+u*.32,y-u*.1);cx.closePath();cx.stroke();cx.beginPath();cx.arc(x+u*.38,y+u*.08,u*.12,-Math.PI/2,Math.PI/2);cx.stroke();for(const d of[-1,1]){cx.beginPath();cx.moveTo(x+d*u*.1,y-u*.2);cx.quadraticCurveTo(x+d*u*.18,y-u*.32,x+d*u*.1,y-u*.45);cx.stroke();}}
  else if(k==='lamp'){cx.beginPath();cx.arc(x,y-u*.05,u*.26,0,7);cx.fill();cx.fillRect(x-u*.12,y+u*.2,u*.24,u*.14);for(let i=0;i<5;i++){const a=Math.PI+i*Math.PI/4;cx.beginPath();cx.moveTo(x+Math.cos(a)*u*.36,y-u*.05+Math.sin(a)*u*.36);cx.lineTo(x+Math.cos(a)*u*.5,y-u*.05+Math.sin(a)*u*.5);cx.stroke();}}
  else if(k==='door'){cx.strokeRect(x-u*.26,y-u*.42,u*.52,u*.84);cx.beginPath();cx.arc(x+u*.14,y+u*.04,u*.05,0,7);cx.fill();}
  else if(k==='heart'){drawHeart(x,y,u*.36);cx.fill();}
  else if(k==='dots'){for(const d of[-1,0,1]){cx.beginPath();cx.arc(x+d*u*.3,y,u*.07,0,7);cx.fill();}}

  }
  // ハート、ぽぽぽ
  for(const h of hearts){const a=(performance.now()-h.born)/1000;const k=Math.min(1,a/2.2);const hx=h.x+Math.sin(a*2.5+h.ph)*r*.4,hy=h.y-a*r*1.5;const al=k<.15?k/.15:1-(k-.15)/.85;const hs=r*.26*(0.85+0.15*Math.sin(a*6));const hg=cx.createRadialGradient(hx,hy,0,hx,hy,hs*2.2);hg.addColorStop(0,'rgba(255,255,255,'+(0.35*al)+')');hg.addColorStop(1,'rgba(255,255,255,0)');cx.fillStyle=hg;cx.beginPath();cx.arc(hx,hy,hs*2.2,0,7);cx.fill();cx.fillStyle='rgba(255,255,255,'+(0.95*al)+')';drawHeart(hx,hy,hs);cx.fill();}
  // 一行
  if(me.think&&performance.now()<me.thinkUntil){const k=Math.min(1,(me.thinkUntil-performance.now())/700);const u=r*1.3;const bx=x+r*1.3*(me.face||1),by=y-r*2.2;
    cx.fillStyle='rgba(255,255,255,'+(0.92*k)+')';for(const c of[[0,0,1],[-.6,.1,.72],[.6,.1,.72],[-.3,-.5,.65],[.3,-.5,.65],[0,.45,.6]]){cx.beginPath();cx.arc(bx+c[0]*u,by+c[1]*u,c[2]*u*.6,0,7);cx.fill();}
    cx.beginPath();cx.arc(bx-(me.face||1)*u*.75,by+u*.85,u*.13,0,7);cx.fill();cx.beginPath();cx.arc(bx-(me.face||1)*u*.95,by+u*1.12,u*.08,0,7);cx.fill();
    cx.save();cx.globalAlpha=k;icon(me.think,bx,by,u);cx.restore();}
}
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;const el=now/1000;
  const n=nowJST();const sky=skyAt(n.t),night=nightness(n.t);
  clockEl.textContent=String(n.h).padStart(2,'0')+':'+String(n.m).padStart(2,'0');
  if(born()&&now>me.until)start(pick(n.t),now);
  if(!born()){me.x=W*.5;me.y=P.fl;}
  if(path.length){me.tx=path[0].x;me.ty=path[0].y;if(Math.hypot(me.tx-me.x,me.ty-me.y)<=1.5){path.shift();if(!path.length&&me.act==='climb')me.resting=true;}}
  {const rr=S*.05;me.x=Math.min(Math.max(me.x,rr),W-rr);me.tx=Math.min(Math.max(me.tx,rr),W-rr);me.y=Math.min(me.y,P.fl);me.ty=Math.min(me.ty,P.fl);}
  const dx=me.tx-me.x,dy=me.ty-me.y,d=Math.hypot(dx,dy);
  if(d>1.5){const sp=Math.min(d,S*(me.act==='climb'&&path.length?0.22:0.5)*dt);me.x+=dx/d*sp;me.y+=dy/d*sp;me.hop+=dt*7;if(Math.abs(dx)>1)me.face=dx<0?-1:1;}else me.hop=0;
  // 窓の外の出来事
  const busy=['sleep','nap','dive','climb','stack','welcome','startle','gaze','sneeze'].includes(me.act)||!!star;
  if(!winFish&&now>=nextWinFish){winFish={t:0,x:-0.3+Math.random()*0.5,dir:Math.random()<.5?-1:1,hue:Math.random()*360};nextWinFish=now+(Q.get('fish')?6000:90000+Math.random()*150000);if(born()&&!busy)start('startle',now);}
  if(winFish){winFish.t+=dt;if(winFish.t>1.3)winFish=null;}
  if(!winMeteor&&night>.3&&now>=nextWinMeteor){winMeteor={t:0,x:-0.6+Math.random()*0.8,y:0.35+Math.random()*0.45};nextWinMeteor=now+(Q.get('meteor')?7000:60000+Math.random()*150000);if(born()&&!busy)start('gaze',now);}
  if(winMeteor){winMeteor.t+=dt;if(winMeteor.t>0.9)winMeteor=null;}
  if(!boat&&now>=nextBoat){boat={t:0,dur:45+Math.random()*25,dir:Math.random()<.5?-1:1};nextBoat=now+(Q.get('boat')?80000:240000+Math.random()*360000);if(born()&&!busy&&Math.random()<.5)start('window',now);}
  if(boat){boat.t+=dt;if(boat.t>boat.dur)boat=null;}
  if(!shark&&night<.6&&now>=nextShark){shark={t:0,dur:14+Math.random()*8,dir:Math.random()<.5?-1:1};nextShark=now+(Q.get('shark')?40000:480000+Math.random()*600000);if(born()&&!busy)start('startle',now);}
  if(shark){shark.t+=dt;if(shark.t>shark.dur)shark=null;}
  if(!plane&&now>=nextPlane){plane={t:0,dur:22+Math.random()*10,dir:Math.random()<.5?-1:1,h:Math.random()};nextPlane=now+(Q.get('plane')?50000:300000+Math.random()*420000);if(born()&&!busy&&Math.random()<.4)start('glass',now);}
  if(plane){plane.t+=dt;if(plane.t>plane.dur)plane=null;}
  mem.warm=Math.max(0.25,mem.warm-dt/28800);
  fx.t+=dt;const rr0=S*(0.030+0.012*Math.min(1,ageDays()/7));
  if(me.act==='roll'){const prev=me.x;me.x=fx.x0+Math.sin(Math.min(fx.t,6)*Math.PI/3)*W*.11*fx.dir;me.tx=me.x;me.hop=0;fx.rot=(fx.rot||0)+(me.x-prev)/rr0;}
  if(me.act==='sing'&&now>=fx.next){fx.next=now+500+Math.random()*400;notes.push({pair:Math.random()<.5,gold:Math.random()<.4,x:me.x+(Math.random()-.5)*rr0*1.4,y:me.y-rr0*2.3,born:now,ph:Math.random()*6});}
  if(me.act==='drowsy'&&now>=fx.next){fx.next=now+1800+Math.random()*1500;zs.push({x:me.x+rr0*.9,y:me.y-rr0*2.1,born:now});}
  if(me.act==='remember'&&!fx.said&&fx.t>1.2){fx.said=1;bang=now;}
  if(me.act==='welcome'&&fx.away&&fx.t>1.2){fx.away=0;me.face=1;me.happyUntil=now+3000;heartQueue=3;nextHeart=now;}
  if(me.act==='sneeze'&&!fx.done&&fx.t>=1.4){fx.done=1;for(let i=0;i<9;i++){const a=-Math.PI*.9+Math.random()*Math.PI*.8;const v=S*(.12+Math.random()*.2);bits.push({x:me.x+(me.face||1)*rr0*.6,y:me.y-rr0*1.1,vx:Math.cos(a)*v*(me.face||1),vy:Math.sin(a)*v,born:now,c:'255,233,168',star:1});}}
  if(me.act==='water'&&Math.abs(me.tx-me.x)<3&&now>=fx.next){fx.next=now+90;bits.push({x:me.x+rr0*1.6,y:me.y-rr0*1.3,vx:S*.08+Math.random()*S*.04,vy:-S*.02,born:now,c:'190,215,255',star:0});plantGlow=Math.min(0.6,plantGlow+0.01);}
  for(const q of bits){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=S*.7*dt;}
  for(let i=bits.length-1;i>=0;i--)if(now-bits[i].born>900||bits[i].y>P.fl)bits.splice(i,1);
  plantGlow=Math.max(0,plantGlow-dt/600);
  if(me.act==='dive'&&path.length===0&&now>=fx.next){fx.next=now+500+Math.random()*700;bubbles.push({x:me.x+(Math.random()-.5)*rr0,y:me.y-rr0*1.4,r:1+Math.random()*1.6,born:now,ph:Math.random()*6});}
  bubbles=bubbles.filter(b=>now-b.born<1800);
  if(me.act==='clean'){if(now>=fx.next){fx.next=now+1100+Math.random()*600;if(Math.random()<.5)notes.push({pair:Math.random()<.4,gold:Math.random()<.4,x:me.x,y:me.y-rr0*2.3,born:now,ph:Math.random()*6});}
    if(pile&&path.length>1&&Math.random()<dt*6)pile.n++;}
  if(me.act!=='clean'&&pile&&!pile.gone)pile.gone=now;
  if(me.act==='stack'){const sh=P.shelf;const bw=S*.05,bh=S*.022,spot=W*.5;const cols=['#4a5090','#6a7ac8','#e9e2d0'];
    if(fx.phase===0){me.tx=sh.x+sh.w*.5;me.ty=sh.y;if(Math.hypot(me.tx-me.x,me.ty-me.y)<2){fx.carry=cols[fx.n];fx.phase=1;}}
    else if(fx.phase===1){me.tx=spot;me.ty=P.fl;if(Math.hypot(me.tx-me.x,me.ty-me.y)<2){books.push({x:spot+(Math.random()-.5)*4,y:P.fl-fx.n*bh,w:bw,h:bh,c:fx.carry,rot:(Math.random()-.5)*.1,vx:0,vy:0,vr:0,gone:0});fx.carry=null;fx.n++;fx.phase=fx.n<3?0:2;fx.t2=0;}}
    else if(fx.phase===2){me.tx=spot;me.ty=P.fl-3*bh;fx.t2=(fx.t2||0)+dt;if(fx.t2>3.2){fx.phase=3;for(const bk of books){if(bk.gone)continue;bk.vx=(Math.random()-.5)*S*.5;bk.vy=-S*(.1+Math.random()*.2);bk.vr=(Math.random()-.5)*8;}me.ty=P.fl;me.happyUntil=now+1500;}}
    else{for(const bk of books){if(bk.gone)continue;bk.x+=bk.vx*dt;bk.y+=bk.vy*dt;bk.vy+=S*1.6*dt;bk.rot+=bk.vr*dt;if(bk.y>P.fl){bk.y=P.fl;bk.vy=0;bk.vx*=0.8;bk.vr*=0.7;}}me.ty=P.fl;}}
  if(me.act!=='stack'&&books.length)for(const bk of books)if(!bk.gone)bk.gone=now;
  if(me.act==='arrange'){if(fx.i<fx.spots.length){const sp=fx.spots[fx.i];me.tx=sp.x;me.ty=P.fl;if(Math.abs(me.x-sp.x)<2){fx.wait+=dt;if(fx.wait>0.6){floorStars.push({x:sp.x,y:sp.y,born:now,gone:0});fx.i++;fx.wait=0;}}}else{me.tx=W*.5;me.ty=P.fl;}}
  if(me.act!=='arrange'&&floorStars.length)for(const fs of floorStars)if(!fs.gone)fs.gone=now;
  for(let i=notes.length-1;i>=0;i--)if(now-notes[i].born>2400)notes.splice(i,1);
  for(let i=zs.length-1;i>=0;i--)if(now-zs[i].born>2600)zs.splice(i,1);
  if(star){const rr=S*(0.030+0.012*Math.min(1,ageDays()/7));
    if(star.phase==='fall'){star.y+=S*0.28*dt;me.tx=star.x0;me.ty=P.fl;me.until=now+1e5;me.resting=false;if(star.y>=P.fl-rr*1.3){star.phase='eat';star.k=0;me.happyUntil=now+2600;}}
    else{star.k+=dt/1.1;if(star.k>=1){star=null;mem.fed++;mem.warm=Math.min(1,mem.warm+0.3);save();me.until=now+5000;flashUntil=now+900;}}}
  if(heartQueue>0&&now>=nextHeart){heartQueue--;nextHeart=now+220+Math.random()*120;const rr=S*(0.030+0.012*Math.min(1,ageDays()/7));hearts.push({x:me.x+(Math.random()-.5)*rr*.9,y:me.y-rr*2.2,born:now,ph:Math.random()*6});}
  for(let i=hearts.length-1;i>=0;i--)if(now-hearts[i].born>2200)hearts.splice(i,1);
  drawRoom(n,sky,night,el);drawMe(el);
  requestAnimationFrame(frame);
}
document.getElementById('feed').addEventListener('click',()=>{if(!born()){say(tx().before);return;}if(star)return;const x0=Math.min(Math.max(me.x+(Math.random()-.5)*W*.16,W*.1),W*.76);star={x0,y:-S*.05,ph:Math.random()*6,phase:'fall',k:0};me.act='idle';me.resting=false;me.until=performance.now()+1e5;});
document.getElementById('hug').addEventListener('click',()=>{if(!born()){say(tx().pet);mem.hugs++;save();return;}mem.hugs++;mem.warm=Math.min(1,mem.warm+0.2);save();me.until=performance.now()+6000;me.act='idle';me.resting=false;me.tx=me.x;me.ty=me.y;me.happyUntil=performance.now()+3000;heartQueue=6;nextHeart=performance.now();});
document.getElementById('look').addEventListener('click',()=>{const t=tx();const a=t.act[me.act]||t.act.idle;say((born()?t.is(myName(),a):t.notyet)+t.stat(ageDays(),mem.fed,mem.hugs));});
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top;if(Math.hypot(px-me.x,py-(me.y-S*.04))<S*.1)document.getElementById('hug').click();});
resize();me.x=W*.5;me.y=P.fl;me.tx=me.x;me.ty=me.y;
/* 閉じて開いても、続きから。暮らしは止まらない */
(()=>{if(!born())return;const now=performance.now();const L=mem.live;const gap=Date.now()-(mem.last||0);
  if(gap>2*36e5){start('welcome',now);return;}                     // 二時間以上: おかえり
  const simple=L&&!['stack','clean','sneeze','welcome','startle','gaze','dive','climb','idle'].includes(L.act)&&SPOT[L.act];
  if(L&&gap<10*60000&&simple){                                     // 十分以内: さっきの続き
    me.act=L.act;me.x=L.x*W;me.y=L.y*H;me.tx=L.tx*W;me.ty=L.ty*H;me.face=L.face||1;me.resting=!!L.resting;
    fx={t:(L.fxt||0)+gap/1000,x0:me.x,dir:1,i:0,wait:0,next:0,spots:[]};path=(L.path||[]).map(q=>({x:q.x*W,y:q.y*H}));
    for(const q of(L.stars||[]))floorStars.push({x:q.x*W,y:q.y*H,born:now-1000,gone:0});
    if(me.act==='arrange'){fx.i=floorStars.length;const n=5;for(let i=0;i<n;i++){const k=i/(n-1);fx.spots.push({x:W*(.3+.4*k),y:P.fl-Math.sin(k*Math.PI)*H*.012});}}
    me.until=now+Math.max(0,(L.left||0)-gap);
  }else{                                                           // それ以外: その時刻の暮らしの途中に、もういる
    const n=nowJST();start(pick(n.t),now);
    if(!path.length){me.x=me.tx;me.y=me.ty;}
    fx.t=Math.random()*3;me.until=now+(me.until-now)*(0.3+Math.random()*0.6);
  }})();
addEventListener('pagehide',save);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')save();});
let wl=null;async function keepAwake(){try{if('wakeLock' in navigator&&!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null;});}}catch(e){}}
document.addEventListener('pointerdown',keepAwake,{once:false});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')keepAwake();});
requestAnimationFrame(frame);setInterval(save,10000);
})();
