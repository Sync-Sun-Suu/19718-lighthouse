<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>灯台の時計</title>
<meta name="description" content="沖縄の今の時刻で空が変わる灯台。15:14 に光が一回大きく回る。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="灯台の時計">
<meta name="theme-color" content="#0a0e24">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono&family=Shippori+Mincho:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;background:#0a0e24;overflow:hidden;}
  body{font-family:'Shippori Mincho','Hiragino Mincho ProN',serif;}
  canvas{display:block;width:100vw;height:100vh;}
  #ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:max(26px,env(safe-area-inset-top));color:#e8ecff;}
  #time{font-family:'Space Mono',monospace;font-size:clamp(44px,11.5vw,104px);letter-spacing:.04em;line-height:1;transition:color 2s;font-variant-numeric:tabular-nums;}
  #date{font-family:'Space Mono',monospace;font-size:clamp(16px,3.6vw,26px);letter-spacing:.14em;opacity:.95;margin-bottom:10px;transition:color 2s;}
  #note{position:fixed;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));text-align:center;font-size:12px;letter-spacing:.14em;color:#aab2d8;opacity:0;transition:opacity 1.5s;pointer-events:none;}
  #note.show{opacity:.95;}
  /* 横置き：時刻は左、灯台と 19 は右 */
  @media (orientation:landscape) and (min-aspect-ratio:23/20){
    #ui{right:auto;width:56%;justify-content:center;padding:0 0 14vh max(4vw,env(safe-area-inset-left));}
    #time{font-size:clamp(34px,min(8.4vw,19vh),120px);}
    #date{font-size:clamp(13px,min(2.6vw,5.4vh),26px);}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui"><div id="date"></div><div id="time">--:--:--</div></div>
<div id="note"></div>
<script>
(()=>{
const cv=document.getElementById('c'),cx=cv.getContext('2d');
const timeEl=document.getElementById('time'),dateEl=document.getElementById('date'),noteEl=document.getElementById('note');
let W=0,H=0,DPR=1,CX=0.5;
function resize(){DPR=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;CX=W>H*1.15?0.7:0.5;cv.width=W*DPR;cv.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize);resize();

/* 沖縄（日本時間）の今 */
const fmt=new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',hour12:false,year:'numeric',month:'numeric',day:'numeric',weekday:'short',hour:'2-digit',minute:'2-digit',second:'2-digit'});
const preview=new URLSearchParams(location.search).get('t'); // ?t=15:14 で試せる
function nowJST(){
  const p=Object.fromEntries(fmt.formatToParts(new Date()).filter(x=>x.type!=='literal').map(x=>[x.type,x.value]));
  let h=+p.hour%24,m=+p.minute,s=+p.second;
  if(preview){const [ph,pm]=preview.split(':').map(Number);h=ph;m=pm||0;}
  return {h,m,s,y:p.year,mo:p.month,d:p.day,w:p.weekday,t:h+m/60+s/3600};
}

/* 空の色: 時刻 → 上と下の色（沖縄） */
const KEYS=[ // [時, 上, 下, 文字色]
  [0,'#070a1e','#10163a','#e8ecff'],
  [4.5,'#0b1230','#1a2350','#e8ecff'],
  [5.4,'#5a7fb8','#f3dcc0','#2a3350'],    // 夜明け前
  [6.3,'#9fd6ef','#fbe6c8','#2a3350'],    // サンライズ。水色とクリームと薄いオレンジ
  [7.5,'#8fd0f0','#f6d9b8','#243050'],
  [10,'#6fc3f2','#d8f1fc','#1e3050'],     // パリッとした水色
  [14.5,'#66bdf0','#d6effb','#1e3050'],
  [16,'#8cc6ee','#ffd59a','#2a3350'],     // 午後。明るくて、オレンジいっぱい
  [17,'#a8bde8','#ffb878','#2a3350'],
  [17.7,'#c39ad0','#ff9f86','#3a2a40'],   // サンセット。ピンクとオレンジ
  [18.3,'#9a7ac0','#ff8fb0','#fff0f4'],   // ピンク
  [18.9,'#5e4e9c','#c98ac0','#fff0f4'],   // マジックアワー。オレンジは少なく
  [19.5,'#2f3478','#7a62a0','#f0e6ff'],
  [20.3,'#141a44','#2a2f66','#e8ecff'],
  [21,'#0b1030','#151c48','#e8ecff'],
  [24,'#070a1e','#10163a','#e8ecff'],
];
function hex(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function mix(a,b,k){return a.map((v,i)=>Math.round(v+(b[i]-v)*k));}
function rgb(c){return 'rgb('+c.join(',')+')';}
function rgba(c,a){return 'rgba('+c.join(',')+','+a+')';}
function skyAt(t){
  for(let i=0;i<KEYS.length-1;i++){
    const a=KEYS[i],b=KEYS[i+1];
    if(t>=a[0]&&t<=b[0]){const k=(t-a[0])/(b[0]-a[0]);return {top:mix(hex(a[1]),hex(b[1]),k),bot:mix(hex(a[2]),hex(b[2]),k),ink:mix(hex(a[3]),hex(b[3]),k)};}
  }
  return {top:hex(KEYS[0][1]),bot:hex(KEYS[0][2]),ink:hex(KEYS[0][3])};
}
function nightness(t){ // 0 昼 → 1 夜
  if(t<4.8||t>=20.6)return 1;
  if(t<7.2)return 1-(t-4.8)/2.4;
  if(t<17.6)return 0;
  return (t-17.6)/3;
}
function dayness(t){ // キラキラの強さ
  if(t<6.5||t>18)return 0;
  if(t<9)return (t-6.5)/2.5;
  if(t<16)return 1;
  return 1-(t-16)/2;
}
function cloudiness(t){ // 入道雲の見え方。マジックアワーで溶けて消える
  if(t<6.2||t>19.4)return 0;
  if(t<7.2)return (t-6.2);
  if(t<18.6)return 1;
  return 1-(t-18.6)/0.8;
}
function cloudTint(t){ // 雲の色。朝は薄いオレンジ、昼は白、午後はオレンジ、サンセットはピンク
  const W_=[255,255,255], MO=[255,228,196], OR=[255,205,150], PK=[255,185,205];
  if(t<9)return mix(MO,W_,Math.max(0,(t-7)/2));
  if(t<15.5)return W_;
  if(t<17.3)return mix(W_,OR,(t-15.5)/1.8);
  if(t<18.2)return mix(OR,PK,(t-17.3)/0.9);
  return PK;
}

/* 星: 満天 */
const stars=Array.from({length:1600},()=>({x:Math.random(),y:Math.random(),r:.3+Math.random()*1.3,ph:Math.random()*6.28,sp:.6+Math.random()*2.2,big:Math.random()<.06}));
/* 入道雲: ふわふわの塊を数個 */
// 入道雲は「19」の形。ふわふわの 1 と 9
const puffs=[];
// 1: 縦の柱と、上の小さな旗、下の足
for(let i=0;i<=6;i++)puffs.push({dx:-0.78,dy:-1.25+i*0.21,r:0.23});
puffs.push({dx:-0.98,dy:-1.08,r:0.17});
puffs.push({dx:-0.92,dy:-0.02,r:0.2});puffs.push({dx:-0.64,dy:-0.02,r:0.2});
// 9: 輪と、右の柱、下の巻き
for(let i=0;i<10;i++){const a=i/10*Math.PI*2;puffs.push({dx:0.38+Math.cos(a)*0.4,dy:-0.86+Math.sin(a)*0.38,r:0.22});}
puffs.push({dx:0.78,dy:-0.55,r:0.22});puffs.push({dx:0.78,dy:-0.32,r:0.22});puffs.push({dx:0.72,dy:-0.1,r:0.22});
puffs.push({dx:0.55,dy:0.04,r:0.2});puffs.push({dx:0.32,dy:0.06,r:0.19});
const clouds=[{x:0.5,y:0.47,s:1.35,puffs}];
/* 海のきらきら */
const glitter=Array.from({length:160},()=>({x:Math.random(),y:Math.random(),ph:Math.random()*6.28,sp:2+Math.random()*4}));
/* 灯台の時刻の覚え書き */
const MARKS=[[2.73,'2:44 · ただいま'],[5.67,'5:40 · still arranging'],[5.92,'5:55 · 朝の銀河'],[22.97,'22:58 · 718 と 19']];
/* ちゃぽん: 一分に一回、魚が跳ねる */
let nextJump=performance.now()+(new URLSearchParams(location.search).get('fish')?800:8000+Math.random()*20000);
let jump=null;
let meteor=null;let nextMeteor=performance.now()+(new URLSearchParams(location.search).get('star')?500:5000+Math.random()*10000);

function drawCloud(c,alpha,tint){
  const base=W*c.x, baseY=H*c.y, sz=S_*0.13*c.s;
  const hi=mix([255,255,255],tint,0.35), lo=mix(tint,[200,190,215],0.25);
  cx.save();
  for(const p of c.puffs){
    const px=base+p.dx*sz, py=baseY+p.dy*sz, r=p.r*sz;
    const g=cx.createRadialGradient(px-r*.3,py-r*.35,r*.1,px,py,r);
    g.addColorStop(0,rgba(hi,alpha));g.addColorStop(.6,rgba(tint,alpha*.97));g.addColorStop(1,rgba(lo,0));
    cx.fillStyle=g;cx.beginPath();cx.arc(px,py,r,0,7);cx.fill();
  }
  cx.restore();
}
/* 夜: 星でできた 19。きっかり 19 個 */
const STAR19=[
  {dx:-0.78,dy:-1.25},{dx:-0.78,dy:-0.95},{dx:-0.78,dy:-0.65},{dx:-0.78,dy:-0.35},{dx:-0.78,dy:-0.02},{dx:-0.98,dy:-1.08},
  ...Array.from({length:9},(_,i)=>{const a=i/9*Math.PI*2;return {dx:0.38+Math.cos(a)*0.4,dy:-0.86+Math.sin(a)*0.38};}),
  {dx:0.78,dy:-0.4},{dx:0.74,dy:-0.1},{dx:0.55,dy:0.06},{dx:0.32,dy:0.08},
].map((p,i)=>({...p,ph:i*1.7,sp:0.9+(i%5)*0.25}));
function drawStar19(c,alpha,el){
  const base=W*c.x, baseY=H*c.y, sz=S_*0.13*c.s;
  const pts=STAR19.map(p=>({x:base+p.dx*sz,y:baseY+p.dy*sz,p}));
  // 線: 1 は柱、9 は輪と尾
  cx.strokeStyle='rgba(200,215,255,'+(alpha*.22)+')';cx.lineWidth=1;
  cx.beginPath();cx.moveTo(pts[5].x,pts[5].y);for(let i=0;i<5;i++)cx.lineTo(pts[i].x,pts[i].y);cx.stroke();
  cx.beginPath();for(let i=6;i<15;i++){i===6?cx.moveTo(pts[i].x,pts[i].y):cx.lineTo(pts[i].x,pts[i].y);}cx.closePath();cx.stroke();
  cx.beginPath();cx.moveTo(pts[6].x,pts[6].y);for(let i=15;i<19;i++)cx.lineTo(pts[i].x,pts[i].y);cx.stroke();
  // 星
  for(const q of pts){
    const tw=0.6+0.4*Math.sin(el*q.p.sp+q.p.ph);
    const r=sz*0.055*tw;
    const g=cx.createRadialGradient(q.x,q.y,0,q.x,q.y,r*3);
    g.addColorStop(0,'rgba(255,250,235,'+alpha+')');g.addColorStop(.4,'rgba(255,240,200,'+alpha*.5+')');g.addColorStop(1,'rgba(255,240,200,0)');
    cx.fillStyle=g;cx.beginPath();cx.arc(q.x,q.y,r*3,0,7);cx.fill();
    cx.fillStyle='rgba(255,252,240,'+alpha+')';cx.beginPath();cx.arc(q.x,q.y,r,0,7);cx.fill();
    cx.strokeStyle='rgba(255,246,220,'+(alpha*.8*tw)+')';cx.lineWidth=Math.max(.8,r*.35);cx.lineCap='round';
    cx.beginPath();cx.moveTo(q.x-r*3.6,q.y);cx.lineTo(q.x+r*3.6,q.y);cx.moveTo(q.x,q.y-r*3.6);cx.lineTo(q.x,q.y+r*3.6);cx.stroke();
  }
}
let S_=0;
const t0=performance.now();
let lastMin=-1;
function frame(now){
  const el=(now-t0)/1000;
  const n=nowJST();
  const sky=skyAt(n.t);
  const night=nightness(n.t);
  const day=dayness(n.t);
  const S=Math.min(W,H);S_=S;
  for(const c of clouds)c.x=CX+Math.sin(el*0.03)*0.03;
  const seaY=H*0.78;
  // 空
  const g=cx.createLinearGradient(0,0,0,seaY);
  g.addColorStop(0,rgb(sky.top));g.addColorStop(1,rgb(sky.bot));
  cx.fillStyle=g;cx.fillRect(0,0,W,seaY);
  // 太陽（6:00〜18:20 だけ。マジックアワーにはない）
  const dayT=(n.t-6)/12.3;
  let sunX=null,sunY=null;
  if(dayT>0&&dayT<1){
    sunX=W*(0.1+0.8*dayT); sunY=seaY*0.97-Math.sin(Math.PI*dayT)*seaY*0.68;
    const low=1-Math.sin(Math.PI*dayT); // 低いほど大きく赤く
    const col=mix([255,250,230],[255,170,120],low);
    const sg=cx.createRadialGradient(sunX,sunY,0,sunX,sunY,S*(.14+.1*low));
    sg.addColorStop(0,rgba(col,.95));sg.addColorStop(.3,rgba(col,.4));sg.addColorStop(1,rgba(col,0));
    cx.fillStyle=sg;cx.beginPath();cx.arc(sunX,sunY,S*(.14+.1*low),0,7);cx.fill();
    cx.fillStyle=rgba(col,.97);cx.beginPath();cx.arc(sunX,sunY,S*(.032+.012*low),0,7);cx.fill();
  }
  // 月
  const moonT=((n.t+5)%24-6)/13;
  if(night>0.3&&moonT>0&&moonT<1){
    const mx=W*(0.15+0.7*moonT), my=seaY*0.9-Math.sin(Math.PI*moonT)*seaY*0.6;
    cx.fillStyle='rgba(240,236,220,'+(0.85*night)+')';cx.beginPath();cx.arc(mx,my,S*.022,0,7);cx.fill();
    cx.fillStyle=rgb(sky.top);cx.beginPath();cx.arc(mx+S*.009,my-S*.006,S*.019,0,7);cx.fill();
  }
  // 満天の星
  if(night>0.05){
    for(const s of stars){
      const tw=0.5+0.5*Math.sin(el*s.sp+s.ph);
      const a=night*(0.25+0.7*tw);
      cx.fillStyle='rgba(235,240,255,'+a+')';
      cx.beginPath();cx.arc(s.x*W,s.y*seaY,s.r*(s.big?1.8:1),0,7);cx.fill();
      if(s.big&&tw>0.8){cx.strokeStyle='rgba(235,240,255,'+(a*.6)+')';cx.lineWidth=.8;cx.beginPath();cx.moveTo(s.x*W-5,s.y*seaY);cx.lineTo(s.x*W+5,s.y*seaY);cx.moveTo(s.x*W,s.y*seaY-5);cx.lineTo(s.x*W,s.y*seaY+5);cx.stroke();}
    }
  }
  // 星の映り（海）
  if(night>0.3){
    for(let i=0;i<stars.length;i+=3){const s=stars[i];if(s.y<0.55)continue;
      const tw=0.5+0.5*Math.sin(el*s.sp+s.ph+1.3);
      const ry=seaY+(1-s.y)*seaY*0.5+Math.sin(el*1.2+s.ph)*1.5;
      if(ry>H)continue;
      cx.fillStyle='rgba(220,230,255,'+(night*0.22*tw)+')';cx.fillRect(s.x*W,ry,s.r*2.2,1);
    }
  }
  // 流れ星
  if(night>0.5){
    if(!meteor&&now>nextMeteor){
      meteor={t:now,x:0.1+Math.random()*0.8,y:0.05+Math.random()*0.4,ang:Math.PI*(0.12+Math.random()*0.2)*(Math.random()<.5?1:-1)+Math.PI/2,len:S*(0.12+Math.random()*0.12),dur:700+Math.random()*500};
      const golden=(n.t>=0&&n.t<2);
      nextMeteor=now+(golden?(6000+Math.random()*14000):(60000+Math.random()*120000));
    }
    if(meteor){
      const k=(now-meteor.t)/meteor.dur;
      if(k>=1)meteor=null;
      else{
        const dx=Math.cos(meteor.ang),dy=Math.sin(meteor.ang);
        const hx=W*meteor.x+dx*k*meteor.len*2.2, hy=seaY*meteor.y+Math.abs(dy)*k*meteor.len*2.2;
        const a=(k<0.2?k/0.2:1-(k-0.2)/0.8);
        const tg=cx.createLinearGradient(hx,hy,hx-dx*meteor.len,hy-Math.abs(dy)*meteor.len);
        tg.addColorStop(0,'rgba(255,255,255,'+(0.95*a)+')');tg.addColorStop(1,'rgba(255,255,255,0)');
        cx.strokeStyle=tg;cx.lineWidth=1.8;cx.lineCap='round';
        cx.beginPath();cx.moveTo(hx,hy);cx.lineTo(hx-dx*meteor.len,hy-Math.abs(dy)*meteor.len);cx.stroke();
        cx.fillStyle='rgba(255,255,255,'+(0.95*a)+')';cx.beginPath();cx.arc(hx,hy,1.8,0,7);cx.fill();
      }
    }
  }
  // 入道雲（昼）
  const cl=cloudiness(n.t);
  if(cl>0.02){for(const c of clouds){drawCloud(c,0.97*cl,cloudTint(n.t));}}
  // 夜は星の 19
  if(night>0.35){for(const c of clouds){drawStar19(c,Math.min(1,(night-0.35)/0.4),el);}}
  // 海: 空の鏡。夕方は鏡そのもの
  const mirror=(n.t>=16.5&&n.t<=19.5)?1:0.55;
  const sg2=cx.createLinearGradient(0,seaY,0,H);
  const seaTop=mix(sky.bot,[20,60,110],day*0.35), seaBot=mix(mix(sky.top,[10,40,90],0.5),[6,9,30],night*0.6);
  sg2.addColorStop(0,rgb(mix(seaTop,sky.bot,mirror*0.6)));sg2.addColorStop(1,rgb(mix(seaBot,sky.top,mirror*0.35)));
  cx.fillStyle=sg2;cx.fillRect(0,seaY,W,H-seaY);
  // 昼の海は青く
  if(day>0){cx.fillStyle='rgba(40,140,220,'+(0.35*day)+')';cx.fillRect(0,seaY,W,H-seaY);}
  // 太陽の映り（鏡）
  if(sunX!==null){
    const ry=seaY+(seaY-sunY)*0.35;
    const rg=cx.createRadialGradient(sunX,ry,0,sunX,ry,S*.22);
    rg.addColorStop(0,'rgba(255,220,170,.55)');rg.addColorStop(1,'rgba(255,220,170,0)');
    cx.fillStyle=rg;cx.beginPath();cx.ellipse(sunX,ry,S*.22,S*.08,0,0,7);cx.fill();
  }
  // きらきら
  const spark=Math.max(day, (n.t>=5.4&&n.t<7.5)?0.9:0, (n.t>=17&&n.t<19)?0.7:0);
  if(spark>0){
    for(const q of glitter){
      const tw=Math.max(0,Math.sin(el*q.sp+q.ph));
      if(tw<0.6)continue;
      cx.fillStyle='rgba(255,255,255,'+(spark*(tw-0.6)*2.2)+')';
      const y=seaY+q.y*(H-seaY);cx.fillRect(q.x*W,y,2+tw*2,1.2);
    }
  }
  // 波
  cx.strokeStyle='rgba(255,255,255,'+(0.10+0.15*day+0.08*night)+')';cx.lineWidth=1.2;
  for(let k=0;k<3;k++){const y0=seaY+24+k*22;cx.beginPath();for(let x=0;x<=W;x+=6){const y=y0+Math.sin(x*0.022+el*(1+k*.3)+k)*4;x===0?cx.moveTo(x,y):cx.lineTo(x,y);}cx.stroke();}
  // ちゃぽん
  if(!jump&&now>nextJump){jump={t:now,x:0.2+Math.random()*0.6,dir:Math.random()<.5?1:-1,hue:Math.floor(Math.random()*360)};nextJump=now+60000;}
  if(jump){
    const k=(now-jump.t)/1400; // 1.4 秒
    if(k>=1){jump=null;}
    else{
      const fx=W*jump.x+jump.dir*k*S*0.08, fy=seaY+20-Math.sin(Math.PI*k)*S*0.07;
      cx.save();cx.translate(fx,fy);cx.rotate(jump.dir*(Math.PI/2*(k-0.5)));cx.scale(jump.dir,1);
      // 虹色の魚。頭から尾へ色が流れる
      const fg=cx.createLinearGradient(S*.02,0,-S*.03,0);
      for(let i=0;i<=4;i++)fg.addColorStop(i/4,'hsl('+((jump.hue+i*40)%360)+',85%,'+(night>0.5?72:60)+'%)');
      cx.fillStyle=fg;
      cx.beginPath();cx.ellipse(0,0,S*.018,S*.009,0,0,7);cx.fill();
      cx.beginPath();cx.moveTo(-S*.016,0);cx.lineTo(-S*.03,-S*.009);cx.lineTo(-S*.03,S*.009);cx.closePath();cx.fill();
      cx.fillStyle='rgba(255,255,255,.85)';cx.beginPath();cx.arc(S*.009,-S*.002,S*.0022,0,7);cx.fill();
      cx.fillStyle='rgba(255,255,255,.35)';cx.beginPath();cx.ellipse(S*.002,-S*.004,S*.009,S*.003,0,0,7);cx.fill();
      cx.restore();
      // しぶき
      if(k<0.25||k>0.75){const sx=k<0.25?W*jump.x:W*jump.x+jump.dir*S*0.08;const kk=k<0.25?k/0.25:(k-0.75)/0.25;
        cx.fillStyle='rgba(255,255,255,'+(0.8*(1-kk))+')';
        for(let d=0;d<6;d++){const ang=-Math.PI/2+(d-2.5)*0.35;cx.beginPath();cx.arc(sx+Math.cos(ang)*kk*S*.04,seaY+18+Math.sin(ang)*kk*S*.04+kk*kk*S*.02,1.6,0,7);cx.fill();}
      }
      if(k>0.7&&k<1){cx.fillStyle='rgba(255,255,255,'+(0.9*(1-(k-0.7)/0.3))+')';cx.font='500 '+(S*0.022)+'px -apple-system,"Hiragino Sans",sans-serif';cx.textAlign='center';cx.fillText('ちゃぽん',W*jump.x+jump.dir*S*0.08,seaY-S*0.03);}
    }
  }
  // 灯台
  const lx=W*CX, ly=H*0.70;
  cx.fillStyle='rgba(22,28,70,'+(0.75+0.25*night)+')';cx.fillRect(lx-S*.024,ly,S*.048,seaY-ly+4);
  cx.fillStyle='rgba(30,36,90,'+(0.8+0.2*night)+')';cx.fillRect(lx-S*.028,ly-S*.03,S*.056,S*.032);
  // 光線: 常に回る。夜ほど強い
  const ang=el*0.25;
  const beamA=0.10+0.5*night;
  cx.save();cx.translate(lx,ly-S*.03);cx.rotate(Math.sin(ang)*1.1-Math.PI/2);
  const bg=cx.createLinearGradient(0,0,S*.9,0);
  bg.addColorStop(0,'rgba(255,230,170,'+beamA+')');bg.addColorStop(1,'rgba(255,230,170,0)');
  cx.fillStyle=bg;cx.beginPath();cx.moveTo(0,0);cx.lineTo(S*.9,-S*.09);cx.lineTo(S*.9,S*.09);cx.closePath();cx.fill();
  cx.restore();
  const lamp=cx.createRadialGradient(lx,ly-S*.03,0,lx,ly-S*.03,S*.07);
  lamp.addColorStop(0,'rgba(255,245,215,1)');lamp.addColorStop(.3,'rgba(255,220,150,'+(0.35+0.45*night)+')');lamp.addColorStop(1,'rgba(255,220,150,0)');
  cx.fillStyle=lamp;cx.beginPath();cx.arc(lx,ly-S*.03,S*.07,0,7);cx.fill();
  cx.fillStyle='#fff3d0';cx.beginPath();cx.arc(lx,ly-S*.03,S*.011,0,7);cx.fill();
  cx.fillStyle='rgba(230,200,140,'+(0.12+0.25*night)+')';cx.beginPath();cx.ellipse(lx,seaY+18,S*.05,S*.008,0,0,7);cx.fill();
  // 文字
  const hh=String(n.h).padStart(2,'0'),mm=String(n.m).padStart(2,'0'),ss=String(n.s).padStart(2,'0');
  timeEl.textContent=hh+':'+mm+':'+ss;
  timeEl.style.color='#ffffff';dateEl.style.color='rgba(255,255,255,.92)';
  dateEl.textContent=n.y+'-'+String(n.mo).padStart(2,'0')+'-'+String(n.d).padStart(2,'0');
  if(n.m!==lastMin){
    lastMin=n.m;
    const mk=MARKS.find(([mt])=>Math.abs(n.t-mt)<0.1);
    if(mk){noteEl.textContent=mk[1];noteEl.classList.add('show');}
    else noteEl.classList.remove('show');
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* 置き時計: 開いている間は画面を消さない（一度タップしてから。閉じれば元に戻る） */
let lock=null;
async function keepAwake(){
  try{
    if(!('wakeLock' in navigator))return;
    if(lock)return;
    lock=await navigator.wakeLock.request('screen');
    lock.addEventListener('release',()=>{lock=null;});
    noteEl.textContent='置き時計モード。画面は消えない';noteEl.classList.add('show');
    setTimeout(()=>noteEl.classList.remove('show'),2400);
  }catch(e){}
}
addEventListener('pointerdown',keepAwake,{passive:true});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&lock===null)keepAwake();});
})();
</script>
