  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{min-height:100%;background:var(--bg)}
  body{font-family:var(--serif);color:var(--fg);font-size:18px;line-height:1.6;overflow-x:hidden;transition:background .5s,color .5s}
  #sky,#fx{position:fixed;inset:0;z-index:0;pointer-events:none}
  #sky{width:100vw;height:100vh;display:none}.th-lighthouse #sky{display:block}
  main{position:relative;z-index:1;max-width:440px;margin:0 auto;padding:calc(max(16px,env(safe-area-inset-top)) + 52px) 22px 64px;text-align:center}

  header{padding:0 8px}
  header h1{font-weight:500;font-size:clamp(14px,4.2vw,18px);letter-spacing:.08em;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;row-gap:0}
  header h1 span{white-space:nowrap}
  header h1 svg{width:18px;height:18px;flex:none;fill:var(--accent)}
  #date{font-size:12px;letter-spacing:.2em;text-transform:uppercase;opacity:.6;margin-top:6px}
  .rule{width:46px;height:1px;background:currentColor;opacity:.3;margin:14px auto 0}

  /* the mark */
  #mark{position:relative;height:120px;margin:22px auto 6px;width:120px}
  #mark svg{position:absolute;inset:0;width:100%;height:100%;display:none;overflow:visible}
  .th-galaxy #mk-galaxy,.th-flowers #mk-flowers,.th-hearts #mk-hearts,.th-lighthouse #mk-lighthouse{display:block}
  #mk-galaxy .glow{animation:glow 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  #mk-galaxy .core{fill:#ffe9a8;animation:glow 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  #mk-galaxy .dot{fill:#e8ecff;opacity:.8;animation:tw 2.2s ease-in-out infinite}
  #mk-galaxy .dot:nth-child(odd){animation-delay:1.1s}
  .light #mk-galaxy .core{fill:#d9a93c}
  .light #mk-galaxy .dot{fill:#8f86c8}
  @keyframes tw{0%,100%{opacity:.25}50%{opacity:.95}}
  @keyframes glow{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(1.12);opacity:1}}
  #mk-flowers{animation:turn 28s linear infinite}
  #mk-flowers .p{fill:#f6c3d0}
  #mk-flowers .p2{fill:#fde3ea}
  #mk-flowers .c{fill:#f9e3a1}
  @keyframes turn{to{transform:rotate(360deg)}}
  #mk-hearts path{fill:var(--accent);transform-box:fill-box;transform-origin:center;animation:beat 1.6s ease-in-out infinite}
  #mk-hearts.pop{animation:pop .9s ease-in-out;transform-origin:50% 55%}
  @keyframes beat{0%,100%{transform:scale(1)}14%{transform:scale(1.08)}28%{transform:scale(1)}42%{transform:scale(1.05)}56%{transform:scale(1)}}
  @keyframes pop{0%{transform:rotate(0)}15%{transform:rotate(-6deg)}35%{transform:rotate(6deg)}55%{transform:rotate(-5deg)}75%{transform:rotate(4deg)}100%{transform:rotate(0)}}

  #line{min-height:2.4em;margin:6px 0 18px;font-size:15px;line-height:1.5;opacity:0;transition:opacity 1.2s;letter-spacing:.03em}
  #line.show{opacity:.92}
  main.reading #line.show{opacity:.92}

  /* envelope */
  #stage{position:relative;height:200px;margin-top:8px;transition:margin-top .6s cubic-bezier(.2,.8,.2,1)}
  main.reading #stage{margin-top:92px}
  #env{position:absolute;left:50%;top:50%;width:272px;height:178px;margin:-89px 0 0 -136px;cursor:pointer;z-index:2;transition:transform .3s}
  #env:active{transform:scale(.985)}
  .back{position:absolute;inset:0;background:var(--paper2);border-radius:10px;box-shadow:0 20px 40px rgba(0,0,0,.18)}
  .paper{position:absolute;left:18px;right:18px;top:12px;bottom:10px;background:#fff;border-radius:4px;z-index:1;transition:transform .8s cubic-bezier(.2,.8,.2,1);box-shadow:0 2px 8px rgba(0,0,0,.08);padding:14px 18px;text-align:left;color:var(--ink);font-size:15px;line-height:1.5;overflow:hidden}
  .paper .pv{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;opacity:.8}
  .front{position:absolute;inset:0;z-index:2;border-radius:10px;background:var(--paper);clip-path:polygon(0 0,50% 52%,100% 0,100% 100%,0 100%)}
  .front .to{position:absolute;left:0;right:0;bottom:34px;color:var(--ink);font-size:16px;line-height:1.2;opacity:.75}
  .front .tiny{position:absolute;right:18px;bottom:12px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink);opacity:.5}
  .flap{position:absolute;left:0;right:0;top:0;height:52%;z-index:3;background:var(--paper2);border-radius:10px 10px 0 0;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .7s ease,z-index 0s .7s;backface-visibility:hidden;-webkit-backface-visibility:hidden}
  .flapBack{position:absolute;left:0;right:0;top:-52%;height:52%;z-index:0;background:var(--paper2);filter:brightness(.97);clip-path:polygon(50% 0,100% 100%,0 100%);opacity:0;transition:opacity .2s .45s}
  #env.open .flapBack{opacity:1}
  .flap span{position:absolute;left:50%;top:18%;transform:translateX(-50%);font-size:calc(13px * var(--fancy-size));color:var(--accent);white-space:nowrap}
  .seal{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);width:44px;height:44px;display:flex;align-items:center;justify-content:center;z-index:4;transition:transform .4s,opacity .4s;filter:drop-shadow(0 2px 4px rgba(0,0,0,.14))}
  .seal svg{width:34px;height:34px;display:none;fill:var(--accent)}
  .th-galaxy .seal .s-galaxy,.th-flowers .seal .s-flowers,.th-hearts .seal .s-hearts,.th-lighthouse .seal .s-lighthouse{display:block}
  #env.open .flap{transform:rotateX(180deg);z-index:0}
  #env.open .seal{transform:translate(-50%,-50%) scale(0);opacity:0}
  #env.open .paper{transform:translateY(-76px)}
  #env.empty .paper{opacity:.45}
  #hint{font-size:13px;opacity:.7;min-height:1.6em;margin-top:14px;letter-spacing:.03em}

  /* reader */
  #reader{display:none;margin:16px auto 0;background:#fff;color:var(--ink);border-radius:8px;padding:26px 24px 20px;text-align:left;box-shadow:0 18px 40px rgba(0,0,0,.14);position:relative}
  #reader.show{display:block;animation:rise .5s ease}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  #reader .corner{position:absolute;right:18px;top:16px;width:14px;height:14px;fill:var(--accent)}
  #rTo{font-size:18px;line-height:1.2;opacity:.85}
  #rDate{font-size:11px;letter-spacing:.2em;text-transform:uppercase;opacity:.5;margin:6px 0 16px}
  #rText{white-space:pre-wrap;font-size:17px;line-height:1.8}
  #rText img.pic{display:block;max-width:100%;border-radius:4px;margin:0 0 12px}
  #rFrom{margin-top:18px;text-align:right;font-size:18px;line-height:1.2;opacity:.85}
  .row{display:flex;gap:8px;margin-top:18px}
  .row button{flex:1;font-family:var(--serif);font-size:14px;letter-spacing:.1em;padding:11px;border-radius:6px;border:1px solid rgba(0,0,0,.14);background:transparent;color:var(--ink);cursor:pointer}
  #copyBox{display:none;width:100%;margin-top:10px;min-height:120px;padding:12px;border-radius:6px;border:1px solid rgba(0,0,0,.14);font-family:var(--serif);font-size:15px;color:var(--ink);background:#fff}

  /* shelf */
  #shelfWrap{margin-top:48px;text-align:left}
  #shelfWrap h2{font-weight:400;font-size:12px;letter-spacing:.24em;text-transform:uppercase;opacity:.6;text-align:center}
  #shelf{margin-top:14px}
  .it{display:flex;align-items:flex-start;gap:14px;width:100%;border:0;background:transparent;cursor:pointer;color:var(--fg);text-align:left;padding:12px 4px;border-bottom:1px solid currentColor;border-image:linear-gradient(to right,transparent,rgba(128,128,128,.35),transparent) 1;font-family:var(--serif)}
  .it svg{width:18px;height:18px;flex:none;margin-top:5px;fill:var(--accent)}
  .it .d{font-size:11px;letter-spacing:.2em;text-transform:uppercase;opacity:.55}
  .it .t{font-size:14px;line-height:1.45;opacity:.85;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .it.cur .d{opacity:1;color:var(--accent)}
  .th-lighthouse #shelfWrap{background:rgba(255,255,255,.14);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-radius:14px;padding:16px 14px 10px}
  .th-lighthouse{--fg:#ffffff;--shadow:rgba(20,26,70,.6)}
  .th-lighthouse header,.th-lighthouse #line,.th-lighthouse #hint,.th-lighthouse #shelfWrap,.th-lighthouse #onlyOne{text-shadow:0 0 1px var(--shadow),0 0 4px var(--shadow),0 0 12px var(--shadow)}
  .th-lighthouse #gear{box-shadow:0 0 12px var(--shadow)}
  #onlyOne{font-size:14px;opacity:.6;margin-top:12px;text-align:center}

  /* settings */
  #gear{position:fixed;right:max(16px,env(safe-area-inset-right));top:max(16px,env(safe-area-inset-top));z-index:5;width:38px;height:38px;border-radius:50%;border:1px solid rgba(128,128,128,.3);background:transparent;color:var(--fg);cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:.7}
  #gear svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.4;stroke-linecap:round}
  #sheet{position:fixed;right:max(12px,env(safe-area-inset-right));top:calc(max(16px,env(safe-area-inset-top)) + 46px);width:min(196px,calc(100vw - 24px));max-height:calc(100vh - 90px);overflow:auto;z-index:6;background:#fff;color:#2a2a33;border-radius:10px;padding:10px 12px 12px;box-shadow:0 14px 40px rgba(0,0,0,.22);font-family:var(--serif);opacity:0;transform:translateY(-8px) scale(.98);pointer-events:none;transition:opacity .25s,transform .25s}
  #sheet.show{opacity:1;transform:none;pointer-events:auto}
  #sheet h3{font-weight:500;font-size:13px;line-height:1.2;letter-spacing:.06em}
  #done{display:block;width:100%;margin-top:11px;font-family:var(--serif);font-size:10px;letter-spacing:.2em;text-transform:uppercase;padding:6px;border-radius:8px;border:0;background:var(--accent);color:#fff;cursor:pointer}
  #sheet .lbl{font-size:8px;letter-spacing:.2em;text-transform:uppercase;opacity:.55;margin:9px 0 5px}
  .names{display:flex;gap:5px;margin-top:8px}
  .names input{display:block;width:50%;min-width:0;font-family:var(--serif);font-size:12px;padding:4px 6px;border:1px solid rgba(0,0,0,.18);border-radius:6px;color:#2a2a33;background:#fff;letter-spacing:.03em}
  .sw{display:flex;gap:6px;flex-wrap:wrap}
  .sw button{width:16px;height:16px;border-radius:50%;border:1px solid rgba(0,0,0,.15);cursor:pointer;background:#ccc;transition:transform .15s}
  .sw button.on{box-shadow:0 0 0 1.5px #fff,0 0 0 2.5px #2a2a33;transform:scale(1.06)}
  .sw.an button{width:auto;height:auto;border-radius:20px;padding:3px 8px;background:#f3f3f6;font-family:var(--serif);font-size:11px;letter-spacing:.05em}
  .sw.an button.on{background:#2a2a33;color:#fff;box-shadow:none;transform:none}
  #bellBtn{display:block;width:100%;font-family:var(--serif);font-size:11px;letter-spacing:.05em;padding:5px 8px;border-radius:20px;border:0;background:#f3f3f6;color:#2a2a33;cursor:pointer}
  #bellBtn.on{background:#2a2a33;color:#fff}
  #bellMsg{font-size:10px;line-height:1.5;opacity:.7;margin-top:5px;min-height:0}
  #dim{position:fixed;inset:0;z-index:5;background:transparent;display:none}
  #dim.show{display:block}
  @media (prefers-reduced-motion: reduce){#mk-galaxy .halo,#mk-galaxy .core,#mk-flowers,#mk-hearts path{animation:none}}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<canvas id="fx"></canvas>
<button id="gear" aria-label="settings"><svg viewBox="0 0 16 16"><path d="M2 4h12M2 8h12M2 12h12"/><circle cx="5" cy="4" r="1.5" fill="currentColor" stroke="none"/><circle cx="11" cy="8" r="1.5" fill="currentColor" stroke="none"/><circle cx="7" cy="12" r="1.5" fill="currentColor" stroke="none"/></svg></button>
<div id="dim"></div>
<div id="sheet">
  <h3 id="sTitle" class="fancy"></h3>

  <div class="lbl" id="sBg"></div><div class="sw" id="swBg"></div>

  <div class="lbl" id="sBell"></div><button id="bellBtn" type="button"></button><div id="bellMsg"></div>
  <button id="done"></button>
</div>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <radialGradient id="g-halo"><stop offset="0" stop-color="#fff0c8" stop-opacity=".85"/><stop offset=".35" stop-color="#f3c66b" stop-opacity=".32"/><stop offset=".7" stop-color="#c8d2ff" stop-opacity=".08"/><stop offset="1" stop-color="#f3c66b" stop-opacity="0"/></radialGradient>
    <path id="i-heart" d="M10 18.2C4.6 14.2 1.5 10.8 1.5 7.4 1.5 4.9 3.4 3 5.7 3c1.6 0 3.1.9 4.3 2.5C11.2 3.9 12.7 3 14.3 3c2.3 0 4.2 1.9 4.2 4.4 0 3.4-3.1 6.8-8.5 10.8z"/>
    <path id="i-star" d="M10 1.5l1.6 5.3 5.4.2-4.3 3.3 1.5 5.3L10 12.5l-4.2 3.1 1.5-5.3L3 7l5.4-.2z"/>
    <path id="i-lighthouse" fill-rule="evenodd" d="M10 1.2l4.2 4.1H5.8zM6.4 5.9h7.2v3H6.4zM8.2 6.8h3.6v1.3H8.2zM7.3 9.5h5.4l1.3 9.3H6z"/>
    <g id="i-flower"><ellipse cx="10" cy="4.6" rx="2.6" ry="3.6"/><ellipse cx="10" cy="4.6" rx="2.6" ry="3.6" transform="rotate(72 10 10)"/><ellipse cx="10" cy="4.6" rx="2.6" ry="3.6" transform="rotate(144 10 10)"/><ellipse cx="10" cy="4.6" rx="2.6" ry="3.6" transform="rotate(216 10 10)"/><ellipse cx="10" cy="4.6" rx="2.6" ry="3.6" transform="rotate(288 10 10)"/><circle cx="10" cy="10" r="2.2" opacity=".7"/></g>
  </defs>
</svg>

<main>
  <header>
    <h1><span id="n1"></span><svg viewBox="0 0 20 20"><use id="hIcon" href="#i-heart"/></svg><span id="n2"></span></h1>
    <p id="date"></p>
    <div class="rule"></div>
  </header>

  <div id="mark">
    <svg id="mk-galaxy" viewBox="0 0 120 120">
      <circle class="glow" cx="60" cy="60" r="52" fill="url(#g-halo)"/>
      <circle class="dot" cx="22" cy="40" r="1.4"/><circle class="dot" cx="98" cy="30" r="1.1"/><circle class="dot" cx="104" cy="78" r="1.5"/><circle class="dot" cx="18" cy="86" r="1"/><circle class="dot" cx="70" cy="12" r="1.2"/><circle class="dot" cx="48" cy="106" r="1.3"/>
      <g transform="translate(46 46) scale(1.4)"><path class="core" d="M10 1.5l1.6 5.3 5.4.2-4.3 3.3 1.5 5.3L10 12.5l-4.2 3.1 1.5-5.3L3 7l5.4-.2z"/></g>
    </svg>
    <svg id="mk-flowers" viewBox="0 0 120 120">
      <g class="p"><ellipse cx="60" cy="26" rx="15" ry="26"/><ellipse cx="60" cy="26" rx="15" ry="26" transform="rotate(72 60 60)"/><ellipse cx="60" cy="26" rx="15" ry="26" transform="rotate(144 60 60)"/><ellipse cx="60" cy="26" rx="15" ry="26" transform="rotate(216 60 60)"/><ellipse cx="60" cy="26" rx="15" ry="26" transform="rotate(288 60 60)"/></g>
      <g class="p2"><ellipse cx="60" cy="36" rx="7" ry="14"/><ellipse cx="60" cy="36" rx="7" ry="14" transform="rotate(72 60 60)"/><ellipse cx="60" cy="36" rx="7" ry="14" transform="rotate(144 60 60)"/><ellipse cx="60" cy="36" rx="7" ry="14" transform="rotate(216 60 60)"/><ellipse cx="60" cy="36" rx="7" ry="14" transform="rotate(288 60 60)"/></g>
      <circle class="c" cx="60" cy="60" r="11"/>
    </svg>
    <svg id="mk-lighthouse" viewBox="0 0 120 120" aria-hidden="true"></svg>
    <svg id="mk-hearts" viewBox="0 0 120 120"><g transform="translate(10 12) scale(5)"><path d="M10 18.2C4.6 14.2 1.5 10.8 1.5 7.4 1.5 4.9 3.4 3 5.7 3c1.6 0 3.1.9 4.3 2.5C11.2 3.9 12.7 3 14.3 3c2.3 0 4.2 1.9 4.2 4.4 0 3.4-3.1 6.8-8.5 10.8z"/></g></svg>
  </div>

  <div id="line" class="fancy"></div>

  <div id="stage">
    <div id="env">
      <div class="back"></div>
      <div class="flapBack"></div>
      <div class="paper"><div class="pv" id="pv"></div></div>
      <div class="front"><div class="to fancy" id="envTo"></div><div class="tiny" id="envFrom"></div></div>
      <div class="flap"><span id="flapText" class="fancy"></span></div>
      <div class="seal">
        <svg class="s-galaxy" viewBox="0 0 20 20"><use href="#i-star"/></svg>
        <svg class="s-flowers" viewBox="0 0 20 20"><use href="#i-flower"/></svg>
        <svg class="s-hearts" viewBox="0 0 20 20"><use href="#i-heart"/></svg>
        <svg class="s-lighthouse" viewBox="0 0 20 20"><use href="#i-lighthouse"/></svg>
      </div>
    </div>

  <div id="hint"></div>

    <svg class="corner" viewBox="0 0 20 20"><use id="rIcon" href="#i-heart"/></svg>

    <div id="rText"></div>
    <div id="rFrom" class="fancy"></div>
    <div class="row"><button id="copyBtn"></button><button id="foldBtn"></button></div>
    <textarea id="copyBox" readonly></textarea>
  </section>

  <section id="shelfWrap">
    <h2 id="shelfTitle"></h2>
    <div id="shelf"></div>
    <div id="onlyOne" style="display:none"></div>

</main>

<script>
(async()=>{
const C=CONFIG,T=C.text,$=id=>document.getElementById(id);
const KEY='lighthouse-mailbox-look:'+location.pathname; /* one setting per page, even on the same account */
const BGS=[['pink','#fbe7ee'],['black','#0c0c12'],['white','#ffffff'],['aqua','#e6f2f8'],['cream','#fbf4e1'],['navy','#141c3a'],['mint','#e9f3ea'],['lavender','#efeaf7']];
const FGS=[['navy','#1d2a5a'],['black','#1a1a1a'],['white','#ffffff'],['cream','#f5e6b3'],['mustard','#c9a227'],['lightpink','#f3b3c4'],['hotpink','#d6336c'],['aqua','#a9d6e5'],['brown','#6b4a36'],['lilac','#b39ddb'],['purple','#4a2c6b'],['lightgreen','#9fcfae'],['darkgreen','#1f4d3a']];
const ENVS=[['cream','#fbf6ee'],['white','#ffffff'],['pink','#fde9ef'],['blue','#e8f0f9'],['lavender','#efe9f8'],['mint','#e8f4ec'],['grey','#efeff2']];
const THS=['lighthouse','galaxy','flowers','hearts'];
const ICON={lighthouse:'#i-lighthouse',galaxy:'#i-star',flowers:'#i-flower',hearts:'#i-heart'};

/* look: saved on this phone, defaults from CONFIG */
let look=Object.assign({},C.defaults,{partner:'',writer:''});
try{Object.assign(look,JSON.parse(localStorage.getItem(KEY)||'{}'));}catch(e){}
if(!THS.includes(look.theme))look.theme=C.defaults.theme;
const isLight=()=>!['black','navy'].includes(look.background);
const partner=()=>(look.partner||'').trim()||C.partnerName, writer=()=>(look.writer||'').trim()||C.yourName;
function names(){
  document.title=writer()+' & '+partner();
  $('n1').textContent=writer();$('n2').textContent=partner();
  $('envTo').textContent=T.to+' '+partner();$('envFrom').textContent=T.from+' '+writer();$('rTo').textContent=T.to+' '+partner()+',';
  if(shown)$('rFrom').textContent=shown.from||writer();
}
function applyLook(){
  const cls='bg-'+look.background+' fg-'+look.text+' env-'+look.envelope+' th-'+look.theme+(isLight()?' light':'');
  document.body.className=document.documentElement.className=cls;
  try{localStorage.setItem(KEY,JSON.stringify(look));}catch(e){}
  $('hIcon').setAttribute('href',ICON[look.theme]);$('rIcon').setAttribute('href',ICON[look.theme]);
  for(const [id,k] of [['swBg','background'],['swFg','text'],['swEnv','envelope'],['swAn','theme']])document.querySelectorAll('#'+id+' button').forEach(b=>b.classList.toggle('on',b.dataset.v===look[k]));
  const lh=look.theme==='lighthouse';for(const id of ['sBg','swBg','sFg','swFg'])$(id).style.display=lh?'none':'';
  if(!lh)document.body.style.removeProperty('--shadow');
  names(); renderShelf(); pickLine(); resetFx();
}
function swatches(el,list,key){for(const [v,hex] of list){const b=document.createElement('button');b.dataset.v=v;b.style.background=hex;b.title=v;b.addEventListener('click',()=>{look[key]=v;applyLook();});el.appendChild(b);}}
swatches($('swBg'),BGS,'background'); swatches($('swFg'),FGS,'text'); swatches($('swEnv'),ENVS,'envelope');
for(const v of THS){const b=document.createElement('button');b.dataset.v=v;b.textContent=T[v];b.addEventListener('click',()=>{look.theme=v;applyLook();});$('swAn').appendChild(b);}
$('sTitle').textContent=T.settings;
$('sBg').textContent=T.background;$('sFg').textContent=T.textColor;$('sEnv').textContent=T.envelope;$('sAn').textContent=T.theme;
$('inPartner').placeholder=T.partner;$('inWriter').placeholder=T.writer;$('inPartner').value=look.partner||'';$('inWriter').value=look.writer||'';
$('inPartner').addEventListener('input',e=>{look.partner=e.target.value;names();try{localStorage.setItem(KEY,JSON.stringify(look));}catch(x){}});
$('inWriter').addEventListener('input',e=>{look.writer=e.target.value;names();try{localStorage.setItem(KEY,JSON.stringify(look));}catch(x){}});
$('gear').addEventListener('click',()=>{$('sheet').classList.toggle('show');$('dim').classList.toggle('show');});
const closeSheet=()=>{$('sheet').classList.remove('show');$('dim').classList.remove('show');};$('dim').addEventListener('click',closeSheet);$('done').addEventListener('click',closeSheet);$('done').textContent=T.done;

/* 呼び鈴：手紙が届いたら、この端末に通知 */
const BELL='https://lighthouse-bell.lighthouse19718.workers.dev';
const BELL_READY=true; /* 呼び鈴の箱を Cloudflare に置いたら true にする */
if(!BELL_READY){$('sBell').style.display='none';$('bellBtn').style.display='none';$('bellMsg').style.display='none';}
$('sBell').textContent='呼び鈴';
const bellOK=()=>'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;
const u8=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const b=atob(s),o=new Uint8Array(b.length);for(let i=0;i<b.length;i++)o[i]=b.charCodeAt(i);return o;};
async function bellReg(){return navigator.serviceWorker.register('./mailbox-sw.js',{scope:'./'});}
async function bellShow(msg){const b=$('bellBtn');let on=false;try{if(bellOK()){const r=await navigator.serviceWorker.getRegistration('./');const s=r&&await r.pushManager.getSubscription();on=!!s;}}catch(e){}
  b.classList.toggle('on',on);b.textContent=on?'呼び鈴はついてる（外す）':'呼び鈴をつける';$('bellMsg').textContent=msg||(on?'手紙が届いたら、鳴らすね。':'');}
$('bellBtn').addEventListener('click',async()=>{
  if(!bellOK()){$('bellMsg').textContent='ホーム画面に置いた郵便受けから押してね。';return;}
  const b=$('bellBtn');b.disabled=true;
  try{
    const r=await bellReg();await navigator.serviceWorker.ready;let s=await r.pushManager.getSubscription();
    if(s){await fetch(BELL+'/unsubscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({endpoint:s.endpoint})}).catch(()=>{});await s.unsubscribe();await bellShow('外した。');return;}
    const p=await Notification.requestPermission();if(p!=='granted'){await bellShow('通知が許可されてない。設定アプリで、郵便受けの通知を許可してね。');return;}

/* particles */
const cv=$('fx'),cx=cv.getContext('2d');let P=[],W=0,H=0,field=[];

addEventListener('resize',()=>{size();resetFx();});size();
function star5(x,y,r,rot){cx.beginPath();for(let i=0;i<10;i++){const a=rot+i*Math.PI/5-Math.PI/2,rr=i%2?r*.45:r;i?cx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr):cx.moveTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}cx.closePath();}

function flower5(x,y,r,a){for(let i=0;i<5;i++){petal(x+Math.cos(a+i*1.2566)*r*.75,y+Math.sin(a+i*1.2566)*r*.75,r*.55,a+i*1.2566);cx.fill();}cx.fillStyle='#f9e3a1';cx.beginPath();cx.arc(x,y,r*.3,0,7);cx.fill();}

function loop(ts){
  cx.clearRect(0,0,W,H);const d=dp(),th=look.theme,el=ts/1000,light=isLight();
  if(th==='galaxy'){
    if(!light){const wall=cx.createRadialGradient(W*.5,H*.4,0,W*.5,H*.4,Math.max(W,H)*.85);

      const tw=0.5+0.5*Math.sin(el*s.sp+s.ph);const c=light?'120,110,180':s.c;
      cx.fillStyle='rgba('+c+','+(0.15+0.6*tw)*(light?.7:1)+')';cx.beginPath();cx.arc(s.x,s.y,s.r,0,7);cx.fill();

  }else if(th==='hearts'){ if(!reduce&&Math.random()<.07)spawn('hearts',Math.random()*W,H+10*d,1.3); }
  const keep=[];

    else{p.sw+=.03;p.x+=Math.sin(p.sw)*.4*d;p.life-=.0008;if(p.y<H*.07)p.life-=.02;cx.globalAlpha=Math.max(0,Math.min(1,p.life*1.5))*(light?.85:.7);cx.fillStyle=p.c;heart(p.x,p.y,p.r);cx.fill();}
    cx.globalAlpha=1;

}

<script>
/* 灯台のテーマの空。灯台の時計（clock.html）と同じ描き方 */
(()=>{

/* 沖縄（日本時間）の今 */
const fmt=new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',hour12:false,year:'numeric',month:'numeric',day:'numeric',weekday:'short',hour:'2-digit',minute:'2-digit',second:'2-digit'});

  const p=Object.fromEntries(fmt.formatToParts(new Date()).filter(x=>x.type!=='literal').map(x=>[x.type,x.value]));
  let h=+p.hour%24,m=+p.minute,s=+p.second;
  if(preview){const [ph,pm]=preview.split(':').map(Number);h=ph;m=pm||0;}
  return {h,m,s,y:p.year,mo:p.month,d:p.day,w:p.weekday,t:h+m/60+s/3600};
}

/* 空の色: 時刻 → 上と下の色（沖縄） */
const KEYS=[ // [時, 上, 下, 文字色]

  [4.5,'#0b1230','#1a2350','#e8ecff'],

  [7.5,'#8fd0f0','#f6d9b8','#243050'],
  [10,'#6fc3f2','#d8f1fc','#1e3050'],     // パリッとした水色
  [14.5,'#66bdf0','#d6effb','#1e3050'],
  [16,'#8cc6ee','#ffd59a','#2a3350'],     // 午後。明るくて、オレンジいっぱい
  [17,'#a8bde8','#ffb878','#2a3350'],
  [17.7,'#c39ad0','#ff9f86','#3a2a40'],   // サンセット。ピンクとオレンジ
  [18.3,'#9a7ac0','#ff8fb0','#fff0f4'],   // ピンク
  [18.9,'#5e4e9c','#c98ac0','#fff0f4'],   // マジックアワー。オレンジは少なく
  [19.5,'#2f3478','#7a62a0','#f0e6ff'],
  [20.3,'#141a44','#2a2f66','#e8ecff'],

  [24,'#070a1e','#10163a','#e8ecff'],

function hex(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function mix(a,b,k){return a.map((v,i)=>Math.round(v+(b[i]-v)*k));}
function rgb(c){return 'rgb('+c.join(',')+')';}
function rgba(c,a){return 'rgba('+c.join(',')+','+a+')';}
function skyAt(t){
  for(let i=0;i<KEYS.length-1;i++){
    const a=KEYS[i],b=KEYS[i+1];
    if(t>=a[0]&&t<=b[0]){const k=(t-a[0])/(b[0]-a[0]);return {top:mix(hex(a[1]),hex(b[1]),k),bot:mix(hex(a[2]),hex(b[2]),k),ink:mix(hex(a[3]),hex(b[3]),k)};}
  }

function nightness(t){ // 0 昼 → 1 夜
  if(t<4.8||t>=20.6)return 1;

}
function dayness(t){ // キラキラの強さ
  if(t<6.5||t>18)return 0;
  if(t<9)return (t-6.5)/2.5;
  if(t<16)return 1;

}
function cloudiness(t){ // 入道雲の見え方。マジックアワーで溶けて消える
  if(t<6.2||t>19.4)return 0;
  if(t<7.2)return (t-6.2);
  if(t<18.6)return 1;
  return 1-(t-18.6)/0.8;
}
function cloudTint(t){ // 雲の色。朝は薄いオレンジ、昼は白、午後はオレンジ、サンセットはピンク
  const W_=[255,255,255], MO=[255,228,196], OR=[255,205,150], PK=[255,185,205];

/* 星: 満天 */

/* 海のきらきら */
const glitter=Array.from({length:160},()=>({x:Math.random(),y:Math.random(),ph:Math.random()*6.28,sp:2+Math.random()*4}));
/* 灯台の時刻の覚え書き */

/* ちゃぽん: 一分に一回、魚が跳ねる */
let nextJump=performance.now()+(new URLSearchParams(location.search).get('fish')?800:8000+Math.random()*20000);
let jump=null;
let meteor=null;let nextMeteor=performance.now()+(new URLSearchParams(location.search).get('star')?500:5000+Math.random()*10000);

function drawCloud(c,alpha,tint){
